name: test

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from smoke on purpose: check.sh stops at the first failing stage, so
  # running lint in the same job would let one shellcheck nit hide every test
  # result. Twenty seconds of runner time buys an independent red/green.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: lint
        run: bash scripts/check.sh --lint-only

  # Focused suites share state and are intentionally serialized. Their stage
  # durations stay visible without competing for one runner's CPU and making
  # load-sensitive process tests flaky.
  focused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: focused suites
        run: bash scripts/check.sh --focused-only

  # scripts-smoke is the dominant wall-clock cost. Native matrix children get
  # separate runners instead of four process trees racing on one VM. The
  # deterministic partition and bounded slow-test timing make rebalancing
  # evidence-driven.
  smoke_shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    name: scripts-smoke (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
      - name: smoke shard
        env:
          OMS_SMOKE_TIMINGS: "1"
        run: bash scripts/check.sh --scripts-smoke-only --shard "${{ matrix.shard }}/4"

  # Exercise the same install -> update -> uninstall contract on every
  # supported host, and in both ownership modes. Windows selects copy mode on
  # its own; the Ubuntu copy leg exists because copy mode would otherwise be
  # provable only on the slowest runner in the matrix.
  install_e2e:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            link_mode: auto
          - os: ubuntu-latest
            link_mode: copy
          - os: macos-latest
            link_mode: auto
          - os: windows-latest
            link_mode: auto
    runs-on: ${{ matrix.os }}
    name: install-e2e (${{ matrix.os }}, ${{ matrix.link_mode }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: install / update / uninstall lifecycle
        env:
          OH_MY_SETTING_LINK_MODE: ${{ matrix.link_mode }}
        run: bash tests/install-lifecycle-smoke.sh

  # The one parser that rejects a here-document inside $( ) whose body holds an
  # odd apostrophe, and the one userland where BSD sed/awk/date differ. Both
  # classes are invisible to a Linux-only gate, and both have shipped breakage.
  portability_macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - name: stock Bash 3.2 parse
        run: OMS_BASH32_BIN=/bin/bash bash scripts/check-bash32.sh
      - name: BSD userland fixtures
        run: bash tests/bsd-portability-smoke.sh

  # README promises Python 3.9+. Newer parsers can emulate most of that
  # grammar, but only a real 3.9 interpreter proves the no-tomllib HUD path.
  python39:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Python 3.9 compatibility
        run: |
          bash scripts/check-python.sh
          bash tests/codex-hud-config-smoke.sh

  # Branch protection targets only this fixed name. Matrix child check names
  # can change as shards are rebalanced; this job fails closed on every failed,
  # cancelled, or skipped dependency.
  gate:
    if: always()
    needs: [lint, focused, smoke_shard, install_e2e, portability_macos, python39]
    runs-on: ubuntu-latest
    steps:
      - name: require every verification job
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          SMOKE_SHARD_RESULT: ${{ needs.smoke_shard.result }}
          INSTALL_E2E_RESULT: ${{ needs.install_e2e.result }}
          PORTABILITY_MACOS_RESULT: ${{ needs.portability_macos.result }}
          PYTHON39_RESULT: ${{ needs.python39.result }}
        run: |
          status=0
          for result in \
            "$LINT_RESULT" \
            "$FOCUSED_RESULT" \
            "$SMOKE_SHARD_RESULT" \
            "$INSTALL_E2E_RESULT" \
            "$PORTABILITY_MACOS_RESULT" \
            "$PYTHON39_RESULT"; do
            if [ "$result" != success ]; then
              echo "required job result: $result" >&2
              status=1
            fi
          done
          exit "$status"
