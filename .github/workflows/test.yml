name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected_plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      native: ${{ steps.plan.outputs.native }}
      rust: ${{ steps.plan.outputs.docs_only == 'true' && 'false' || steps.rust_scope.outputs.required }}
      docs_only: ${{ steps.plan.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: select Rust migration checks
        id: rust_scope
        timeout-minutes: 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          required=true
          if { [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; } && \
              git rev-parse --verify "$DIFF_BASE^{tree}" >/dev/null 2>&1; then
            git diff --no-renames --name-only -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/oms-rust-paths"
            required=false
            while IFS= read -r -d '' path; do
              case "${path,,}" in
                Cargo.toml|Cargo.lock|rust-toolchain.toml|crates/*|*.py|*.pyw|*.sh|*.bash|*.zsh|*.fish|*.js|*.mjs|*.cjs|*.json|*.yaml|*.yml|*.toml)
                  required=true ;;
                *)
                  name="${path##*/}"
                  case "${name#.}" in
                    *.) required=true ;;
                    *.*) ;;
                    *) required=true ;;
                  esac
                  ;;
              esac
            done < "$RUNNER_TEMP/oms-rust-paths"
          fi
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
      - name: select affected changes
        id: plan
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if { [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; } && \
              git rev-parse --verify "$DIFF_BASE^{tree}" >/dev/null 2>&1; then
            bash scripts/check.sh --affected --print-affected-mode \
              --changed-from "$DIFF_BASE" --changed-to HEAD \
              --ci-output "$GITHUB_OUTPUT"
          else
            printf 'mode=full\nnative=true\ndocs_only=false\n' >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck
        timeout-minutes: 5
        run: |
          curl -sSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.99.1 --profile minimal
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path Cargo.toml --locked
      - name: lint
        timeout-minutes: 10
        run: bash scripts/check.sh --lint-only

  rust:
    needs: affected_plan
    if: needs.affected_plan.outputs.rust == 'true' || needs.affected_plan.outputs.mode == 'full'
    name: rust (ubuntu-24.04)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc +1.99.1 --version
          cargo +1.99.1 --version
      - name: restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path Cargo.toml --locked
      - name: Rust workspace checks
        timeout-minutes: 30
        run: |
          set -euo pipefail
          total_start=$SECONDS
          failed_phase=none
          phase_timings=()

          print_timing_summary() {
            local rc=$?
            printf '==> Rust workspace phase timings (total=%ds, status=%d, failed_phase=%s)\n' \
              "$((SECONDS - total_start))" "$rc" "$failed_phase"
            if [ "${#phase_timings[@]}" -gt 0 ]; then
              printf '  %s\n' "${phase_timings[@]}"
            fi
          }
          trap print_timing_summary EXIT

          run_phase() {
            local phase="$1"
            shift
            local start=$SECONDS
            local status=0
            printf '==> [rust:%s] start\n' "$phase"
            if "$@"; then
              status=0
            else
              status=$?
            fi
            local elapsed=$((SECONDS - start))
            if [ "$status" -eq 0 ]; then
              phase_timings+=("phase=${phase} status=ok exit=0 elapsed_s=${elapsed}")
              printf '==> [rust:%s] ok (%ds)\n' "$phase" "$elapsed"
            else
              failed_phase="$phase"
              phase_timings+=("phase=${phase} status=failed exit=${status} elapsed_s=${elapsed}")
              printf '==> [rust:%s] failed (exit=%d, %ds)\n' "$phase" "$status" "$elapsed" >&2
              return "$status"
            fi
          }

          run_phase fmt cargo +1.99.1 fmt --manifest-path Cargo.toml --all -- --check
          run_phase clippy cargo +1.99.1 clippy --manifest-path Cargo.toml --workspace --all-targets --locked --offline -- -D warnings
          run_phase doctests cargo +1.99.1 test --manifest-path Cargo.toml --workspace --doc --locked --offline
          run_phase migrate cargo +1.99.1 run --manifest-path Cargo.toml -p oms-migrate --locked --offline -- check --repo .

  # cargo test runs test binaries one after another; the workspace suite took
  # about 10 minutes in one job. Shards run in parallel; the rest shard excludes
  # the listed packages, so a new package is always tested.
  rust_tests:
    needs: affected_plan
    if: needs.affected_plan.outputs.rust == 'true' || needs.affected_plan.outputs.mode == 'full'
    name: rust tests (${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [core, commands, rest]
    env:
      SHARD: ${{ matrix.shard }}
      SHARD_CORE: oms oms-migrate oms-graph-shell
      SHARD_COMMANDS: oms-command-memory oms-command-landing oms-command-panel oms-command-peer oms-mcp-server
    steps:
      - uses: actions/checkout@v7
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: restore Rust dependency cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          key: ${{ matrix.shard }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path Cargo.toml --locked
      - name: Rust tests
        timeout-minutes: 20
        run: |
          set -euo pipefail
          args=()
          case "$SHARD" in
            core) for p in $SHARD_CORE; do args+=(-p "$p"); done ;;
            commands) for p in $SHARD_COMMANDS; do args+=(-p "$p"); done ;;
            rest) args=(--workspace); for p in $SHARD_CORE $SHARD_COMMANDS; do args+=(--exclude "$p"); done ;;
            *) echo "unknown Rust test shard: $SHARD" >&2; exit 2 ;;
          esac
          cargo +1.99.1 test --manifest-path Cargo.toml "${args[@]}" --all-targets --locked --offline

  focused:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: restore native release build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-release
          workspaces: ". -> target/lifecycle-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path Cargo.toml --locked
      - name: focused smoke suites
        timeout-minutes: 15
        run: bash scripts/check.sh --focused-only

  install_e2e:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full' || needs.affected_plan.outputs.native == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    name: native (ubuntu-latest, copy)
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: restore native release build cache
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: native-release
          workspaces: ". -> target/lifecycle-build"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path Cargo.toml --locked
      - name: stage native binaries
        timeout-minutes: 10
        run: |
          . scripts/lib/platform.sh
          oms_native_stage .
      - name: install / update / uninstall lifecycle
        timeout-minutes: 10
        env:
          OH_MY_SETTING_LINK_MODE: copy
        run: bash tests/install-lifecycle-smoke.sh

  affected_verify:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'affected'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: affected checks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install pinned Rust toolchain
        if: needs.affected_plan.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: fetch locked Rust dependencies
        if: needs.affected_plan.outputs.docs_only != 'true'
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path Cargo.toml --locked
      - name: verify affected changes
        timeout-minutes: 15
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check.sh --affected --changed-from "$DIFF_BASE" --changed-to HEAD

  gate:
    if: always()
    needs: [affected_plan, lint, rust, rust_tests, focused, install_e2e, affected_verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: require every verification job
        timeout-minutes: 5
        env:
          AFFECTED_PLAN_RESULT: ${{ needs.affected_plan.result }}
          AFFECTED_MODE: ${{ needs.affected_plan.outputs.mode }}
          AFFECTED_NATIVE: ${{ needs.affected_plan.outputs.native }}
          AFFECTED_RUST: ${{ needs.affected_plan.outputs.rust }}
          LINT_RESULT: ${{ needs.lint.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          RUST_TESTS_RESULT: ${{ needs.rust_tests.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          INSTALL_E2E_RESULT: ${{ needs.install_e2e.result }}
          AFFECTED_VERIFY_RESULT: ${{ needs.affected_verify.result }}
        run: |
          status=0
          [ "$AFFECTED_PLAN_RESULT" = success ] || status=1
          case "$AFFECTED_MODE" in
            full)
              [ "$LINT_RESULT" = success ] || status=1
              [ "$RUST_RESULT" = success ] || status=1
              [ "$RUST_TESTS_RESULT" = success ] || status=1
              [ "$FOCUSED_RESULT" = success ] || status=1
              [ "$INSTALL_E2E_RESULT" = success ] || status=1
              [ "$AFFECTED_VERIFY_RESULT" = skipped ] || status=1
              ;;
            affected)
              [ "$LINT_RESULT" = skipped ] || status=1
              [ "$FOCUSED_RESULT" = skipped ] || status=1
              [ "$AFFECTED_VERIFY_RESULT" = success ] || status=1
              if [ "$AFFECTED_NATIVE" = true ]; then
                [ "$INSTALL_E2E_RESULT" = success ] || status=1
              else
                [ "$INSTALL_E2E_RESULT" = skipped ] || status=1
              fi
              if [ "$AFFECTED_RUST" = true ]; then
                [ "$RUST_RESULT" = success ] || status=1
                [ "$RUST_TESTS_RESULT" = success ] || status=1
              else
                [ "$RUST_RESULT" = skipped ] || status=1
                [ "$RUST_TESTS_RESULT" = skipped ] || status=1
              fi
              ;;
            *) status=1 ;;
          esac
          [ "$status" -eq 0 ] || {
            echo "gate failed: mode=$AFFECTED_MODE plan=$AFFECTED_PLAN_RESULT lint=$LINT_RESULT rust=$RUST_RESULT rust_tests=$RUST_TESTS_RESULT focused=$FOCUSED_RESULT e2e=$INSTALL_E2E_RESULT verify=$AFFECTED_VERIFY_RESULT" >&2
          }
          exit "$status"
