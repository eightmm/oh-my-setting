name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected_plan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      native: ${{ steps.plan.outputs.native }}
      rust: ${{ steps.rust_scope.outputs.required }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: select Rust migration checks
        id: rust_scope
        timeout-minutes: 1
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          required=true
          if { [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; } && \
              git rev-parse --verify "$DIFF_BASE^{tree}" >/dev/null 2>&1; then
            git diff --no-renames --name-only -z "$DIFF_BASE" HEAD > "$RUNNER_TEMP/oms-rust-paths"
            required=false
            while IFS= read -r -d '' path; do
              case "${path,,}" in
                rust/*|migration/*|*.py|*.pyw|*.sh|*.bash|*.zsh|*.fish|*.js|*.mjs|*.cjs|*.json|*.yaml|*.yml|*.toml)
                  required=true ;;
                *)
                  name="${path##*/}"
                  case "${name#.}" in
                    *.) required=true ;;
                    *.*) ;;
                    *) required=true ;;
                  esac
                  ;;
              esac
            done < "$RUNNER_TEMP/oms-rust-paths"
          fi
          printf 'required=%s\n' "$required" >> "$GITHUB_OUTPUT"
      - name: select affected changes
        id: plan
        timeout-minutes: 5
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if { [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; } && \
              git rev-parse --verify "$DIFF_BASE^{tree}" >/dev/null 2>&1; then
            bash scripts/check.sh --affected --print-affected-mode \
              --changed-from "$DIFF_BASE" --changed-to HEAD \
              --ci-output "$GITHUB_OUTPUT"
          else
            printf 'mode=full\nnative=true\npython=false\noperator=\n' >> "$GITHUB_OUTPUT"
          fi

  lint:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck
        timeout-minutes: 5
        run: |
          curl -sSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.99.1 --profile minimal
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path rust/Cargo.toml --locked
      - name: lint
        timeout-minutes: 10
        run: bash scripts/check.sh --lint-only

  rust:
    needs: affected_plan
    if: needs.affected_plan.outputs.rust == 'true' || needs.affected_plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
      - name: Bash 5 on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          prefix="$(brew --prefix)"
          if ! "$prefix/bin/bash" -c "[ \${BASH_VERSINFO[0]} -ge 5 ]" 2>/dev/null; then
            brew install bash
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/bash" --version | head -n 1
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: |
          rustup toolchain install 1.99.1 --profile minimal --component rustfmt --component clippy
          rustc +1.99.1 --version
          cargo +1.99.1 --version
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path rust/Cargo.toml --locked
      - name: Rust workspace checks and tests
        timeout-minutes: 30
        run: |
          cargo +1.99.1 fmt --manifest-path rust/Cargo.toml --all -- --check
          cargo +1.99.1 clippy --manifest-path rust/Cargo.toml --workspace --all-targets --locked --offline -- -D warnings
          cargo +1.99.1 test --manifest-path rust/Cargo.toml --workspace --all-targets --locked --offline
          cargo +1.99.1 test --manifest-path rust/Cargo.toml --workspace --doc --locked --offline
          cargo +1.99.1 fmt --manifest-path rust/crates/oms-migrate/Cargo.toml --all -- --check
          cargo +1.99.1 clippy --manifest-path rust/crates/oms-migrate/Cargo.toml --all-targets --locked --offline -- -D warnings
          cargo +1.99.1 test --manifest-path rust/crates/oms-migrate/Cargo.toml --all-targets --locked --offline
          cargo +1.99.1 test --manifest-path rust/crates/oms-migrate/Cargo.toml --doc --locked --offline
          cargo +1.99.1 run --manifest-path rust/crates/oms-migrate/Cargo.toml --locked --offline -- check --repo .

  focused:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path rust/Cargo.toml --locked
      - name: focused smoke suites
        timeout-minutes: 15
        run: bash scripts/check.sh --focused-only

  install_e2e:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full' || needs.affected_plan.outputs.native == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.affected_plan.outputs.native == 'true' && '[{"os":"ubuntu-latest","link_mode":"copy"},{"os":"macos-latest","link_mode":"auto"}]' || '[{"os":"ubuntu-latest","link_mode":"copy"}]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    name: native (${{ matrix.os }}, ${{ matrix.link_mode }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - name: Bash 5 on macOS
        if: runner.os == 'macOS'
        timeout-minutes: 10
        run: |
          prefix="$(brew --prefix)"
          if ! "$prefix/bin/bash" -c "[ \${BASH_VERSINFO[0]} -ge 5 ]" 2>/dev/null; then
            brew install bash
          fi
          echo "$prefix/bin" >> "$GITHUB_PATH"
          "$prefix/bin/bash" --version | head -n 1
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path rust/Cargo.toml --locked
      - name: stage native binaries
        timeout-minutes: 10
        run: |
          . scripts/lib/platform.sh
          oms_native_stage .
      - name: install / update / uninstall lifecycle
        timeout-minutes: 10
        env:
          OH_MY_SETTING_LINK_MODE: ${{ matrix.link_mode }}
        run: bash tests/install-lifecycle-smoke.sh
      - name: BSD userland fixtures
        timeout-minutes: 10
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: bash tests/bsd-portability-smoke.sh

  affected_verify:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'affected'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    name: affected checks
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: install pinned Rust toolchain
        timeout-minutes: 5
        run: rustup toolchain install 1.99.1 --profile minimal
      - name: fetch locked Rust dependencies
        timeout-minutes: 5
        run: cargo +1.99.1 fetch --manifest-path rust/Cargo.toml --locked
      - name: verify affected changes
        timeout-minutes: 15
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: bash scripts/check.sh --affected --changed-from "$DIFF_BASE" --changed-to HEAD

  gate:
    if: always()
    needs: [affected_plan, lint, rust, focused, install_e2e, affected_verify]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: require every verification job
        timeout-minutes: 5
        env:
          AFFECTED_PLAN_RESULT: ${{ needs.affected_plan.result }}
          AFFECTED_MODE: ${{ needs.affected_plan.outputs.mode }}
          AFFECTED_NATIVE: ${{ needs.affected_plan.outputs.native }}
          AFFECTED_RUST: ${{ needs.affected_plan.outputs.rust }}
          LINT_RESULT: ${{ needs.lint.result }}
          RUST_RESULT: ${{ needs.rust.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          INSTALL_E2E_RESULT: ${{ needs.install_e2e.result }}
          AFFECTED_VERIFY_RESULT: ${{ needs.affected_verify.result }}
        run: |
          status=0
          [ "$AFFECTED_PLAN_RESULT" = success ] || status=1
          case "$AFFECTED_MODE" in
            full)
              [ "$LINT_RESULT" = success ] || status=1
              [ "$RUST_RESULT" = success ] || status=1
              [ "$FOCUSED_RESULT" = success ] || status=1
              [ "$INSTALL_E2E_RESULT" = success ] || status=1
              [ "$AFFECTED_VERIFY_RESULT" = skipped ] || status=1
              ;;
            affected)
              [ "$LINT_RESULT" = skipped ] || status=1
              [ "$FOCUSED_RESULT" = skipped ] || status=1
              [ "$AFFECTED_VERIFY_RESULT" = success ] || status=1
              if [ "$AFFECTED_NATIVE" = true ]; then
                [ "$INSTALL_E2E_RESULT" = success ] || status=1
              else
                [ "$INSTALL_E2E_RESULT" = skipped ] || status=1
              fi
              if [ "$AFFECTED_RUST" = true ]; then
                [ "$RUST_RESULT" = success ] || status=1
              else
                [ "$RUST_RESULT" = skipped ] || status=1
              fi
              ;;
            *) status=1 ;;
          esac
          [ "$status" -eq 0 ] || {
            echo "gate failed: mode=$AFFECTED_MODE plan=$AFFECTED_PLAN_RESULT lint=$LINT_RESULT rust=$RUST_RESULT focused=$FOCUSED_RESULT e2e=$INSTALL_E2E_RESULT verify=$AFFECTED_VERIFY_RESULT" >&2
          }
          exit "$status"
