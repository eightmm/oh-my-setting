name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '23 3 * * 1'

# Least privilege: this workflow only reads the repo.
permissions:
  contents: read

# Replace obsolete runs only within the same event; a scheduled/manual full
# check must not cancel the push run that a landing is waiting for.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Split from smoke on purpose: check.sh stops at the first failing stage, so
  # running lint in the same job would let one shellcheck nit hide every test
  # result. Twenty seconds of runner time buys an independent red/green.
  lint:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    # apt has hung this job for an hour before timing anything out (observed
    # 2026-08-18: "install shellcheck" stalled 60+ minutes and held a release
    # base hostage until a manual cancel+rerun). Fail the step fast instead —
    # a rerun of a 5-minute failure is cheap; a silent hour is not.
    steps:
      - uses: actions/checkout@v7
      - name: install shellcheck
        timeout-minutes: 5
        # Pinned release binary, digest-verified: three apt-mirror stalls in
        # one day (2026-08-19) each cost a 5-minute timeout and a manual
        # rerun. The GitHub release download shares no fate with the apt
        # mirrors, and the pin keeps lint results reproducible.
        run: |
          curl -sSL -o /tmp/shellcheck.tar.xz \
            https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz
          echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  /tmp/shellcheck.tar.xz" | sha256sum -c -
          tar -xJf /tmp/shellcheck.tar.xz -C /tmp
          sudo install /tmp/shellcheck-v0.10.0/shellcheck /usr/local/bin/shellcheck
          shellcheck --version
      - name: lint
        timeout-minutes: 15
        run: bash scripts/check.sh --lint-only

  # Focused suites stay serial WITHIN a lane — load-sensitive process tests
  # must not compete for one runner's CPU — but the lanes are separate VMs,
  # like the smoke shards below, because one serial pass had grown past
  # twenty minutes of wall clock. The partition is positional
  # (check.sh --focused-lane), so a newly registered stage lands in a lane
  # automatically and the lane union is provably the whole focused list
  # (source-distribution-smoke pins that invariant). runtime-core and
  # install-profile are registered focused stages, so they are no longer
  # repeated here as extra steps.
  focused:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        lane: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    name: focused (${{ matrix.lane }}/4)
    steps:
      - uses: actions/checkout@v7
      - name: focused suites
        run: bash scripts/check.sh --focused-only --focused-lane "${{ matrix.lane }}/4"

  # scripts-smoke is the dominant wall-clock cost. Native matrix children get
  # separate runners instead of four process trees racing on one VM. The
  # deterministic partition and bounded slow-test timing make rebalancing
  # evidence-driven.
  smoke_shard:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    runs-on: ubuntu-latest
    name: scripts-smoke (${{ matrix.shard }}/4)
    steps:
      - uses: actions/checkout@v7
      - name: smoke shard
        env:
          OMS_SMOKE_TIMINGS: "1"
        run: bash scripts/check.sh --scripts-smoke-only --shard "${{ matrix.shard }}/4"

  # Select once and run narrow checks in this job. Full selections fan out to
  # the existing lanes; no graph artifact/cache or second selection is needed.
  affected_plan:
    runs-on: ubuntu-latest
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: prepare lazy shellcheck
        run: |
          # Selection and narrow verification still run once. Full selections
          # never execute this launcher; parallel narrow lint installs once.
          cat > "$RUNNER_TEMP/oms-shellcheck" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          cache="$RUNNER_TEMP/oms-shellcheck-cache"
          exec 9> "$RUNNER_TEMP/oms-shellcheck.lock"
          flock 9
          [ ! -f "$cache/failed" ] || exit 1
          if [ ! -x "$cache/shellcheck-v0.10.0/shellcheck" ]; then
            mkdir -p "$cache"
            if ! (
              curl -fsSL --max-time 60 --retry 1 -o "$cache/archive.tar.xz" \
                https://github.com/koalaman/shellcheck/releases/download/v0.10.0/shellcheck-v0.10.0.linux.x86_64.tar.xz &&
              echo "6c881ab0698e4e6ea235245f22832860544f17ba386442fe7e9d629f8cbedf87  $cache/archive.tar.xz" | sha256sum -c - &&
              tar -xJf "$cache/archive.tar.xz" -C "$cache"
            ); then
              touch "$cache/failed"
              exit 1
            fi
          fi
          flock -u 9
          exec 9>&-
          exec "$cache/shellcheck-v0.10.0/shellcheck" "$@"
          SH
          chmod +x "$RUNNER_TEMP/oms-shellcheck"
          echo "OMS_SHELLCHECK_BIN=$RUNNER_TEMP/oms-shellcheck" >> "$GITHUB_ENV"
      - name: select and verify affected changes
        id: plan
        timeout-minutes: 35
        env:
          EVENT_NAME: ${{ github.event_name }}
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if { [ "$EVENT_NAME" = pull_request ] || [ "$EVENT_NAME" = push ]; } && \
              git rev-parse --verify "$DIFF_BASE^{tree}" >/dev/null 2>&1; then
            bash scripts/check.sh --affected --changed-from "$DIFF_BASE" --changed-to HEAD \
              --ci-output "$GITHUB_OUTPUT"
          else
            echo 'mode=full' >> "$GITHUB_OUTPUT"
            printf '\n### OMS verification selection\n\nFull check: scheduled/manual run or unavailable base revision.\n' >> "$GITHUB_STEP_SUMMARY"
          fi

  # Exercise the same install -> update -> uninstall contract on every
  # supported host and ownership mode. Linux auto is already a focused stage;
  # do not run the same fixture twice on a full gate. Keep Linux copy and the
  # native macOS/Windows legs, which exercise different platform behavior.
  install_e2e:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            link_mode: copy
          - os: macos-latest
            link_mode: auto
          - os: windows-latest
            link_mode: auto
    runs-on: ${{ matrix.os }}
    name: native (${{ matrix.os }}, ${{ matrix.link_mode }})
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: install / update / uninstall lifecycle
        env:
          OH_MY_SETTING_LINK_MODE: ${{ matrix.link_mode }}
        run: bash tests/install-lifecycle-smoke.sh

      # Reuse the native host and interpreter. Each check still reports a
      # failure if another check failed; cancellation must stop obsolete work.
      - name: native durable artifact store
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        run: bash tests/windows-durable-writer-smoke.sh
      - name: native persisted process liveness
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 3
        run: bash tests/scripts-smoke.sh --only test_process_liveness_uses_non_destructive_windows_probe
      - name: native reenter anchor
        if: ${{ !cancelled() && runner.os == 'Windows' }}
        timeout-minutes: 3
        run: bash tests/scripts-smoke.sh --only test_autopilot_windows_reenter_launch_keeps_parent_anchor
      - name: stock Bash 3.2 parse
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: OMS_BASH32_BIN=/bin/bash bash scripts/check-bash32.sh
      - name: BSD userland fixtures
        if: ${{ !cancelled() && runner.os == 'macOS' }}
        run: bash tests/bsd-portability-smoke.sh

  # README promises Python 3.9+. Newer parsers can emulate most of that
  # grammar, but only a real 3.9 interpreter proves the no-tomllib HUD path.
  python39:
    needs: affected_plan
    if: needs.affected_plan.outputs.mode == 'full'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.9"
      - name: Python 3.9 compatibility
        run: |
          bash scripts/check-python.sh
          bash tests/runtime-core-smoke.sh
          bash tests/install-profile-smoke.sh
          bash tests/codex-hud-config-smoke.sh

  # Branch protection can target this fixed name. Only plan-authorized skips
  # are accepted; missing, failed, and cancelled required jobs fail closed.
  gate:
    if: always()
    needs: [lint, focused, smoke_shard, affected_plan, install_e2e, python39]
    runs-on: ubuntu-latest
    steps:
      - name: require every verification job
        env:
          LINT_RESULT: ${{ needs.lint.result }}
          FOCUSED_RESULT: ${{ needs.focused.result }}
          SMOKE_SHARD_RESULT: ${{ needs.smoke_shard.result }}
          AFFECTED_PLAN_RESULT: ${{ needs.affected_plan.result }}
          AFFECTED_MODE: ${{ needs.affected_plan.outputs.mode }}
          INSTALL_E2E_RESULT: ${{ needs.install_e2e.result }}
          PYTHON39_RESULT: ${{ needs.python39.result }}
        run: |
          status=0
          [ "$AFFECTED_PLAN_RESULT" = success ] || status=1
          case "$AFFECTED_MODE" in
            affected)
              expected=skipped
              ;;
            full)
              expected=success
              ;;
            *) expected=invalid; status=1 ;;
          esac
          for result in \
            "$LINT_RESULT" \
            "$FOCUSED_RESULT" \
            "$SMOKE_SHARD_RESULT" \
            "$INSTALL_E2E_RESULT" \
            "$PYTHON39_RESULT"; do
            if [ "$result" != "$expected" ]; then
              echo "required job result: $result (expected $expected)" >&2
              status=1
            fi
          done
          if [ "$status" -ne 0 ]; then
            echo "scope results: plan=$AFFECTED_PLAN_RESULT/$AFFECTED_MODE focused=$FOCUSED_RESULT smoke=$SMOKE_SHARD_RESULT" >&2
          fi
          exit "$status"
