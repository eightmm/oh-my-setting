[package]
name = "oms-command-hooks"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"


[dependencies]
oms-toml = { path = "../oms-toml" }
oms-context = { path = "../oms-context" }
oms-command-telemetry = { path = "../oms-command-telemetry" }
oms-command-task = { path = "../oms-command-task" }
oms-command-operations = { path = "../oms-command-operations" }
oms-command-room = { path = "../oms-command-room" }
oms-command-memory = { path = "../oms-command-memory" }
oms-command-peer = { path = "../oms-command-peer" }
oms-command-state = { path = "../oms-command-state" }
oms-command-landing = { path = "../oms-command-landing" }
oms-command-journal = { path = "../oms-command-journal" }
oms-command-lifecycle = { path = "../oms-command-lifecycle" }
oms-command-autonomy = { path = "../oms-command-autonomy" }
oms-contract-markdown = { path = "../oms-contract-markdown" }
oms-work-inspect = { path = "../oms-work-inspect" }
oms-reference = { path = "../oms-reference" }
oms-json = { path = "../oms-json" }
oms-lock = { path = "../oms-lock" }
oms-safe-fs = { path = "../oms-safe-fs" }
oms-scrub = { path = "../oms-scrub" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regex = "=1.13.1"
