<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OMS 마을</title>
<style>
:root{
  color-scheme:light dark;font:14px/1.45 var(--font-sans,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif);
  --bg:var(--color-background-primary,light-dark(#fbfaf6,#1c1f25));
  --surface:var(--color-background-secondary,light-dark(#f3f0e7,#252932));
  --ink:var(--color-text-primary,light-dark(#23262b,#eef0f3));
  --soft:var(--color-text-secondary,light-dark(#5d636c,#aeb4bd));
  --line:var(--color-border-secondary,light-dark(#e2ddd0,#3a3f49));
  --focus:var(--color-ring-info,light-dark(#1467b4,#96c7ff));
  --danger:var(--color-text-danger,light-dark(#b3261e,#ffb4ac));
  --danger-bg:var(--color-background-danger,light-dark(#fdecea,#3a2523));
  --ok:var(--color-text-success,light-dark(#17632f,#9fe0ae));
  --warn:var(--color-text-warning,light-dark(#7a4a12,#ffd292));
  --warn-bg:var(--color-background-warning,light-dark(#fff5e3,#30291f));
  --r:var(--border-radius-lg,14px);--r-sm:var(--border-radius-md,9px);
  --mono:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);
  --sea:light-dark(#bfe4f1,#15304a);--wave:light-dark(#d9f0f8,#1d4061);
  --grass:light-dark(#a3d57d,#4e7d4a);--grass2:light-dark(#97cc71,#477347);--lip:light-dark(#7db65c,#3d6340);
  --dirt:light-dark(#cf9f6f,#6d5440);--dirt2:light-dark(#ab7f55,#56422f);
  --wall:light-dark(#fbf1df,#e4d7bf);--wall2:light-dark(#e6d6ba,#bfb096);
  --win:#ffd86b;--win-off:light-dark(#8593a8,#3d4759);--plank:light-dark(#c9a074,#8a6a4a);
  --tagbg:light-dark(#fffdf8,#2b2f38);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
.app{display:grid;gap:10px;padding:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
h1{font-size:18px;margin:0;line-height:1.2}
.sub{margin:0;color:var(--soft);font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums;margin-left:4px}
.stat.hot{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger);background:var(--danger-bg)}
.tools{display:flex;gap:6px;align-items:center}
.age{font-size:12px;color:var(--soft);white-space:nowrap}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 11px;min-height:32px;cursor:pointer}
button:hover{border-color:var(--soft)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.attn{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:thin;min-height:32px}
.attn .lbl{font-size:12px;color:var(--soft);white-space:nowrap;margin-right:2px}
.chip{border-radius:999px;padding:2px 10px;min-height:28px;white-space:nowrap;font-size:12.5px;background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.chip b{color:var(--danger);margin-left:5px}
.quiet{font-size:12.5px;color:var(--soft)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sea);height:clamp(380px,72vh,920px);touch-action:none;user-select:none;-webkit-user-select:none}
#map{width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
.find{position:absolute;z-index:1;left:10px;top:10px;display:flex;gap:6px}
.find input{font:inherit;color:inherit;width:min(220px,46vw);min-height:32px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:color-mix(in srgb,var(--bg) 92%,transparent)}
.ctl{position:absolute;z-index:1;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:34px;height:34px;padding:0;font-size:17px;line-height:1;background:color-mix(in srgb,var(--bg) 90%,transparent)}
.ctl button.wide{width:auto;padding:0 10px;font-size:12.5px}
#mini{position:absolute;z-index:1;left:10px;bottom:10px;width:140px;height:90px;background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.hint{position:absolute;z-index:1;right:10px;bottom:10px;font-size:11.5px;color:var(--soft);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:2px 8px;border-radius:6px}
.status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--soft);pointer-events:none}
.status[hidden]{display:none}
aside{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;overflow:auto;max-height:clamp(380px,72vh,920px)}
aside h2{font-size:16px;margin:0;word-break:break-word}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.portrait{flex:none;width:72px;height:80px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.badge{font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.badge.fresh{color:var(--ok)}.badge.attn{color:var(--danger);background:var(--danger-bg)}.badge.warn{color:var(--warn);background:var(--warn-bg)}
.note{font-size:12.5px;color:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0 12px}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;font-size:13px}
dt{color:var(--soft)}dd{margin:0;word-break:break-word}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok)}
.mono{font-family:var(--mono);font-size:12.5px}
h3{font-size:13px;margin:16px 0 8px;color:var(--soft);font-weight:600}
.crew{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.crew li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg)}
.crew svg{flex:none}
.crew .nm{font-weight:700;letter-spacing:.04em;font-family:var(--mono);font-size:12.5px}
.crew .rl{font-size:12px;color:var(--soft)}
.mark{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.areas{display:grid;gap:5px;list-style:none;margin:8px 0 0;padding:0}
.areas button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--bg)}
details.legend{font-size:12.5px;color:var(--soft)}
details.legend ul{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 0;padding-left:18px}
/* map */
.house{cursor:pointer;outline:none}
.house .sel{fill:transparent;stroke:transparent;stroke-width:2.5}
.house:hover .sel{stroke:color-mix(in srgb,var(--focus) 45%,transparent)}
.house:focus-visible .sel,.house[aria-pressed="true"] .sel{stroke:var(--focus);fill:color-mix(in srgb,var(--focus) 16%,transparent)}
.dim{filter:saturate(.22) brightness(1.04)}
.tag{opacity:0;transition:opacity .15s;pointer-events:none}
#map.near .tag,#map.few .tag,.tag.on{opacity:1}
.ctag{opacity:0}
.more{font:700 8px system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:2.5px}
.picked .ctag{opacity:1}
.tagbox{fill:var(--tagbg);stroke:var(--line)}
.tagtx{fill:var(--ink);font-size:10.5px;font-weight:600}
.areatx{fill:var(--ink);font-size:13px;font-weight:700}
.puff{fill:#f4f4f4;opacity:0;animation:puff 2.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.85}100%{opacity:0;transform:translate(-5px,-16px) scale(1.6)}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.8px)}}
.zz{font-size:8px;fill:var(--soft);font-weight:700}
@media (prefers-reduced-motion:reduce){.puff,.bob{animation:none}.puff{opacity:.6}.tag{transition:none}}
@media (max-width:760px){.body{grid-template-columns:minmax(0,1fr)}aside{max-height:none}.mapwrap{height:clamp(340px,62vh,640px)}#mini{display:none}}
</style>
</head>

    <div class="brand">
      <svg width="34" height="34" viewBox="-17 -22 34 30" aria-hidden="true"><polygon points="0,-8 14,-1 0,6 -14,-1" fill="#a3d57d"/><polygon points="-14,-1 0,6 0,9 -14,2" fill="#cf9f6f"/><polygon points="14,-1 0,6 0,9 14,2" fill="#ab7f55"/><polygon points="-6,-4 3,0 3,-7 -6,-11" fill="#fbf1df"/><polygon points="3,0 8,-2.5 8,-9.5 3,-7" fill="#e6d6ba"/><polygon points="-7,-10 2,-6 5.5,-15 -3.5,-19" fill="#e07f45"/><polygon points="2,-6 9,-9.5 5.5,-15" fill="#e6d6ba"/></svg>

      <svg id="mini" aria-hidden="true"><g id="minig"></g><rect id="minivp" fill="none" stroke="var(--focus)" stroke-width="1.5"/></svg>
      <span class="hint" id="hint"></span>
      <p class="status" id="status" role="status"></p>
    </section>
    <aside id="insp" aria-live="polite"></aside>
  </div>
  <details class="legend"><summary id="legendT"></summary><ul id="legend"></ul></details>
</div>

const TW=32,TH=16,LOT=3,GAP=3,DEPTH=16;

}

function initialize(){

async function refresh(){
