<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OMS 홈</title>
<style>
:root{
  color-scheme:light dark;font:14px/1.45 var(--font-sans,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif);
  --bg:var(--color-background-primary,light-dark(#fbfbfa,#1c1f25));
  --surface:var(--color-background-secondary,light-dark(#ffffff,#23272e));
  --ink:var(--color-text-primary,light-dark(#1f2328,#eef0f3));
  --soft:var(--color-text-secondary,light-dark(#59636e,#aeb4bd));
  --line:var(--color-border-secondary,light-dark(#e4e4de,#3a3f49));
  --focus:var(--color-ring-info,light-dark(#1467b4,#96c7ff));
  --ok:var(--color-text-success,light-dark(#17632f,#9fe0ae));
  --warn:var(--color-text-warning,light-dark(#7a4a12,#ffd292));
  --warn-bg:var(--color-background-warning,light-dark(#fff5e3,#30291f));
  --r:var(--border-radius-lg,14px);--r-sm:var(--border-radius-md,8px);
  --mono:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);
  /* Band colors stay the page's own so the triage reads the same in every host; they differ in lightness, not hue alone. */
  --need:light-dark(#b8400c,#ffa66e);--busy:light-dark(#2459d6,#94b6ff);--calm:var(--ok);--idle:light-dark(#8a919a,#7f868f);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
.app{display:grid;gap:14px;padding:14px;max-width:1240px;margin:0 auto}
header{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
h1{font-size:18px;margin:0;line-height:1.2;letter-spacing:-.01em}
.sub{margin:2px 0 0;color:var(--soft);font-size:12px}
.tools{display:flex;gap:6px;align-items:center}
.age{font-size:12px;color:var(--soft);white-space:nowrap}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 11px;min-height:32px;cursor:pointer}
button:hover{border-color:var(--soft)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.bar-row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.find input{font:inherit;color:inherit;width:min(220px,100%);min-height:32px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface)}
.sum{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.pill{display:inline-flex;align-items:center;gap:7px;border-radius:999px;padding:3px 12px;min-height:30px;font-size:12.5px;font-weight:600;border-color:transparent;background:color-mix(in srgb,var(--b) 11%,var(--bg));color:color-mix(in srgb,var(--b) 82%,var(--ink))}
.pill::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--b)}
.pill b{font-variant-numeric:tabular-nums}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-left:auto}
.chip{border-radius:999px;padding:2px 11px;min-height:30px;white-space:nowrap;font-size:12.5px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip span{opacity:.7;margin-left:5px;font-variant-numeric:tabular-nums}
.k-need{--b:var(--need)}.k-busy{--b:var(--busy)}.k-calm{--b:var(--calm)}.k-quiet,.k-gone{--b:var(--idle)}
.list{display:grid;gap:12px;min-width:0}
.band{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.band h2{display:flex;align-items:baseline;gap:8px;margin:0;padding:12px 16px 9px;font-size:14px}
.band h2 .n{font-size:12px;color:var(--soft);font-weight:600;font-variant-numeric:tabular-nums}
.band h2 .hint{font-size:12px;color:var(--soft);font-weight:400}
.band ul{list-style:none;margin:0;padding:0}
.row{width:100%;display:grid;grid-template-columns:10px minmax(130px,190px) minmax(0,1fr) 124px 156px 56px 16px;align-items:center;column-gap:14px;padding:11px 16px;text-align:left;border:0;border-top:1px solid var(--line);border-radius:0;background:transparent;min-height:56px}
.row:hover{background:color-mix(in srgb,var(--b) 5%,transparent)}
.row[aria-expanded="true"]{background:color-mix(in srgb,var(--b) 7%,transparent)}
.dot{width:10px;height:10px;border-radius:50%;background:var(--b)}
.who,.why{display:flex;flex-direction:column;gap:2px;min-width:0}
.al{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-family:var(--mono);font-size:11.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nx{font-size:13px;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.goal{font-size:12.5px;color:var(--soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cnt{display:inline-block;margin-right:6px;padding:0 7px;border-radius:999px;font-size:11.5px;font-weight:700;line-height:18px;background:color-mix(in srgb,var(--need) 14%,var(--bg));color:color-mix(in srgb,var(--need) 85%,var(--ink));vertical-align:1px}
.pl{display:grid;gap:5px;font-size:12px;color:var(--soft)}
.pl b{font-weight:500;color:var(--ink);font-variant-numeric:tabular-nums;justify-self:end;margin-top:-17px}
.track{height:4px;border-radius:2px;background:var(--line);overflow:hidden}
.track i{display:block;height:100%;background:var(--ink);min-width:2px}
.cr{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden;padding:4px;font-size:11.5px;color:var(--soft);font-variant-numeric:tabular-nums}
.cr .lbl{margin:0 3px 0 1px}
.mn{flex:none;display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;font:600 10.5px/1 var(--font-sans,system-ui,sans-serif);letter-spacing:.02em;background:var(--mb);color:var(--mf)}
.mn.main{box-shadow:0 0 0 2px var(--surface),0 0 0 3.5px var(--mf)}
.p-codex{--mb:light-dark(#edeff2,#30353d);--mf:light-dark(#2b3138,#dfe3e8)}
.p-claude{--mb:light-dark(#f5ebe4,#3b2d25);--mf:light-dark(#87431f,#f2c3a6)}
.p-antigravity{--mb:light-dark(#e6eefb,#22304a);--mf:light-dark(#1e4bb8,#a9c4ff)}
.p-none{--mb:light-dark(#efefec,#2e3238);--mf:light-dark(#59636e,#aeb4bd)}
.ag{font-size:12px;color:var(--soft);font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.chev{color:var(--soft);transition:transform .15s}
.row[aria-expanded="true"] .chev{transform:rotate(180deg)}
.det{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px 20px;padding:4px 16px 16px 40px;background:color-mix(in srgb,var(--b) 7%,transparent)}
.det[hidden]{display:none}
.det h3{margin:0 0 5px;font-size:11.5px;font-weight:600;letter-spacing:.04em;color:var(--soft)}
.det p{margin:0;font-size:13px;line-height:1.5;word-break:break-word}
.det .mono{font-family:var(--mono);font-size:12.5px}
.crew{display:grid;gap:6px;list-style:none;margin:0;padding:0;font-size:13px}
.crew li{display:flex;align-items:center;gap:8px}
.note{grid-column:1/-1;font-size:12.5px;color:var(--soft);border-top:1px dashed var(--line);padding-top:10px}
.rest{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;padding:12px 16px;border:1px dashed var(--line);border-radius:var(--r)}
.rest h2{margin:0;font-size:13.5px}
.rest h2 .n{color:var(--soft);font-weight:600;margin-left:4px}
.rest ul{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0 0 0 auto;padding:0}
.tag{display:inline-flex;align-items:center;gap:6px;min-height:34px;padding:0 11px;font-size:12.5px;font-weight:500;background:var(--surface)}
.tag[aria-expanded="true"]{border-color:var(--focus);box-shadow:0 0 0 1px var(--focus)}
.tag .meta{font-family:inherit}
.rest .det{flex-basis:100%;padding:10px 4px 4px;background:transparent}
.status{text-align:center;padding:40px 16px;color:var(--soft)}
.status[hidden]{display:none}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@media (prefers-reduced-motion:reduce){.chev{transition:none}}
@media (max-width:1000px){
  .row{grid-template-columns:10px minmax(0,1fr) auto;grid-template-areas:"d w a" ". y y" ". p c";row-gap:6px;column-gap:10px}
  .row .pl{display:flex;align-items:center;gap:8px}.row .pl .track{flex:1;order:1}.row .pl b{order:2;margin:0}
  .row .dot{grid-area:d}.row .who{grid-area:w}.row .ag{grid-area:a}.row .why{grid-area:y}.row .pl{grid-area:p}.row .cr{grid-area:c;justify-content:flex-end}.row .chev{display:none}
  .det{grid-template-columns:minmax(0,1fr);padding-left:36px}
  .chips{margin-left:0}
}
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="brand">
      <svg width="30" height="30" viewBox="0 0 32 32" aria-hidden="true"><rect x="1" y="1" width="30" height="30" rx="9" fill="currentColor"></rect><circle cx="16" cy="16" r="6.5" fill="none" stroke="var(--bg)" stroke-width="2.4"></circle></svg>
      <div><h1 id="title"></h1><p class="sub" id="sub"></p></div>
    </div>
    <div class="tools"><span class="age" id="age"></span><button id="expand" hidden></button><button id="refresh"></button></div>
  </header>
  <div class="bar-row">
    <ul class="sum" id="sum" aria-label=""></ul>
    <span class="chips" id="areas"></span>
    <span class="find"><input id="find" type="search" autocomplete="off"></span>
  </div>
  <main class="list" id="list"><p class="status" id="status" role="status"></p></main>
</div>
<script>
'use strict';
// Read-only overview: this page calls only oms_list_projects and renders no action control.
const PROVS=['codex','claude','antigravity'],ABBR={codex:'Cx',claude:'Cl',antigravity:'Ag'};
const STATES=['fresh','stale','missing','unavailable','withheld'];
const T={
ko:{title:'OMS 홈',sub:n=>`프로젝트 ${n}개 · 읽기 전용`,mains:n=>` · Main 실행 ${n}`,refresh:'새로고침',refreshing:'갱신 중…',expand:'크게 보기',find:'프로젝트 찾기',all:'전체',summary:'상태 요약',
 sect:{need:'확인 필요',busy:'일하는 중',calm:'평온',quiet:'조용함',gone:'연결 안 됨'},
 hint:{need:'확인할 것이 많은 순',busy:'worker가 움직이는 프로젝트',calm:'최신이고 할 일 없음'},noMatch:'맞는 프로젝트가 없습니다.',
 st:{fresh:'최신',stale:'오래됨',missing:'기록 없음',unavailable:'폴더 없음',withheld:'비공개'},degraded:'일부만',
 readOnly:'여기서는 보기만 합니다. 작업 시작과 승인은 이 프로젝트 대화에서 OMS 패널을 열어 하세요.',withheld:'이 프로젝트의 내용은 공개되지 않습니다.',
 main:'Main',area:'동네',goal:'목표',branch:'브랜치',dirty:'변경 있음',clean:'깨끗함',plan:'계획',next:'다음 할 일',seen:'갱신',crew:'일하는 worker',noCrew:'지금 일하는 worker는 없습니다.',
 attn:n=>`확인 ${n}`,more:n=>`외 ${n}명`,other:'기타',unknown:'모름',noGoal:'목표 없음',
 now:'방금',m:'분 전',h:'시간 전',d:'일 전',loading:'불러오는 중…',bound:'이 연결은 프로젝트 하나에 묶여 있어 전체 목록을 볼 수 없습니다. 전체 프로젝트 연결에서 여세요.',fail:'불러오지 못했습니다. 잠시 뒤 다시 시도합니다.',failShort:'갱신 실패',openApp:'OMS 앱 안에서 열면 프로젝트가 보입니다.',empty:'등록된 프로젝트가 없습니다.',updated:'갱신'},
en:{title:'OMS Home',sub:n=>`${n} project${n===1?'':'s'} · read only`,mains:n=>` · ${n} Main${n===1?'':'s'} running`,refresh:'Refresh',refreshing:'Refreshing…',expand:'Expand',find:'Find a project',all:'All',summary:'Status summary',
 sect:{need:'Needs you',busy:'Working',calm:'Calm',quiet:'Quiet',gone:'Out of reach'},
 hint:{need:'most items first',busy:'workers are moving',calm:'fresh, nothing waiting'},noMatch:'No project matches.',
 st:{fresh:'fresh',stale:'stale',missing:'no record',unavailable:'folder missing',withheld:'withheld'},degraded:'partial',
 readOnly:'This page only reads. Start or approve work from the OMS panel in that project\'s own conversation.',withheld:'This project\'s details are withheld.',
 main:'Main',area:'Area',goal:'Goal',branch:'Branch',dirty:'uncommitted changes',clean:'clean',plan:'Plan',next:'Next',seen:'Updated',crew:'Workers',noCrew:'No worker is busy right now.',
 attn:n=>`${n} to check`,more:n=>`+${n} more`,other:'Other',unknown:'unknown',noGoal:'no goal',
 now:'just now',m:' min ago',h:' h ago',d:' d ago',loading:'Loading…',bound:'This connection is bound to one project, so the full list is not available. Open it from an all-projects connection.',fail:'Could not load. Retrying shortly.',failShort:'Refresh failed',openApp:'Open this inside the OMS app to see your projects.',empty:'No project is registered.',updated:'Updated'}};
let lang='ko',L=T.ko;

const str=(v,n)=>typeof v==='string'&&v.trim()?v.trim().slice(0,n):null;
const num=v=>typeof v==='number'&&Number.isFinite(v)&&v>=0?v:null;
const prov=v=>v==='agy'?'antigravity':PROVS.includes(v)?v:null;
function norm(c){
  if(!c||typeof c!=='object')return null;
  const alias=str(c.alias,80);if(!alias)return null;
  const state=STATES.includes(c.state)?c.state:'missing',area=str(c.area,24);
  if(state==='withheld')return{alias,state,area,crew:[],total:0,attention:0};
  const plan=c.plan&&typeof c.plan==='object'?{done:num(c.plan.done),total:num(c.plan.total)}:null;
  const crew=(Array.isArray(c.crew)?c.crew:[]).slice(0,3).filter(w=>w&&typeof w==='object').map((w,i)=>({provider:prov(w.provider),role:str(w.role,24),id:str(w.id,24)||String(i)}));
  const total=Math.max(crew.length,Math.min(num(c.crewTotal)||0,999));
  return{alias,state,area,main:prov(c.main),branch:str(c.branch,120),dirty:c.dirty===true,goal:str(c.goal,240),next:str(c.next,200),
    plan:plan&&plan.total?{done:Math.min(plan.done||0,plan.total),total:plan.total}:null,attention:Math.min(num(c.attention)||0,99),
    active:(num(c.active)||0)>0||c.active===true||total>0,degraded:c.degraded===true,observedAt:c.observedAt??null,crew,total};
}
function cardsFrom(r){
  // Cards arrive only in structuredContent and only on a catalog binding; the text content is a fixed sentence.
  const list=r?.structuredContent?.cards;
  return Array.isArray(list)?list.map(norm).filter(Boolean):null;
}
// observedAt is an RFC3339 UTC string or null.
function seconds(v){if(typeof v!=='string')return null;const t=Date.parse(v);return Number.isNaN(t)?null:t/1000}
function ago(v,now=Date.now()/1000){const s=seconds(v);if(s==null)return L.unknown;const d=Math.max(0,now-s);return d<60?L.now:d<3600?Math.floor(d/60)+L.m:d<86400?Math.floor(d/3600)+L.h:Math.floor(d/86400)+L.d}
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');

/* ---------- triage ---------- */
const SECT=['need','busy','calm','quiet','gone'],ROWS=['need','busy','calm'];
function sectOf(c){return c.attention>0?'need':c.state==='missing'||c.state==='unavailable'||c.state==='withheld'?'gone':c.state==='stale'?'quiet':c.active?'busy':'calm'}
const byAlias=(a,b)=>a.alias<b.alias?-1:a.alias>b.alias?1:0;
// Triage order: what needs you, then what is working, calm, quiet and out of reach; never the arrival order.
function groups(list){
  const g=Object.fromEntries(SECT.map(k=>[k,[]]));for(const c of list)g[sectOf(c)].push(c);
  g.need.sort((a,b)=>b.attention-a.attention||byAlias(a,b));for(const k of SECT.slice(1))g[k].sort(byAlias);return g;
}
function stateWord(c){return L.st[c.state]+(c.degraded?' · '+L.degraded:'')}
function label(c){
  const parts=[c.alias,L.sect[sectOf(c)],stateWord(c)];
  if(c.attention)parts.push(L.attn(c.attention));
  if(c.main)parts.push(L.main+' '+c.main);
  if(c.total)parts.push(L.crew+' '+c.total);
  if(c.state!=='withheld'&&c.observedAt!=null)parts.push(L.seen+' '+ago(c.observedAt));
  return parts.join(', ');
}
const mono=(p,main)=>`<span class="mn p-${p||'none'}${main?' main':''}" aria-hidden="true">${p?ABBR[p]:'?'}</span>`;
const pct=c=>Math.round(c.plan.done/c.plan.total*100);
const CHEV='<svg class="chev" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg>';
let cards=null,shown=[],picked=null,zone=null,query='',lastLoad=0,lastTry=0,loading=false,failed=false,sig='';
const el=id=>document.getElementById(id);
const media=q=>globalThis.matchMedia?matchMedia(q):{matches:true};
const reduce=media('(prefers-reduced-motion: reduce)');
const did=c=>'d-'+encodeURIComponent(c.alias).replace(/[^A-Za-z0-9_-]/g,'_');
// One row per project: why it needs you first, then goal, plan, who is on it and how fresh it is.
function row(c,k){
  const li=document.createElement('li'),b=document.createElement('button');
  b.className='row';b.type='button';b.dataset.alias=c.alias;b.setAttribute('aria-expanded',String(c.alias===picked));b.setAttribute('aria-controls',did(c));b.setAttribute('aria-label',label(c));
  const meta=[c.branch,c.dirty?L.dirty:null,c.degraded?L.degraded:null].filter(Boolean).join(' · ')||stateWord(c);
  const crew=c.crew.map(w=>mono(w.provider)).join('')+(c.total>c.crew.length?`<span class="lbl">+${Math.min(c.total-c.crew.length,99)}${c.total-c.crew.length>99?'+':''}</span>`:'');
  b.innerHTML=`<span class="dot" aria-hidden="true"></span><span class="who"><span class="al">${esc(c.alias)}</span><span class="meta">${esc(meta)}</span></span>`
    +`<span class="why"><span class="nx">${c.attention?`<span class="cnt">${esc(L.attn(c.attention))}</span>`:''}${esc(c.next||c.goal||L.noGoal)}</span>${c.next&&c.goal?`<span class="goal">${esc(c.goal)}</span>`:''}</span>`
    +`<span class="pl">${c.plan?`${esc(L.plan)}<b>${c.plan.done} / ${c.plan.total}</b><span class="track"><i style="width:${pct(c)}%"></i></span>`:''}</span>`
    +`<span class="cr">${c.main?mono(c.main,true):''}${crew}</span>`
    +`<span class="ag"${typeof c.observedAt==='string'?` data-at="${esc(c.observedAt)}"`:''}>${esc(c.observedAt!=null?ago(c.observedAt):'')}</span>${CHEV}`;
  li.className='k-'+k;li.append(b,detail(c));return li;
}
function tag(c){
  const b=document.createElement('button');b.className='tag';b.type='button';b.dataset.alias=c.alias;b.setAttribute('aria-expanded',String(c.alias===picked));b.setAttribute('aria-controls',did(c));b.setAttribute('aria-label',label(c));
  b.innerHTML=`${c.main?mono(c.main):''}${esc(c.alias)}<span class="meta">${esc(c.state==='withheld'?L.st.withheld:stateWord(c)+(c.dirty?' · '+L.dirty:''))}</span>`;
  return b;
}
function block(h,body){const d=document.createElement('div'),t=document.createElement('h3');t.textContent=h;d.append(t,body);return d}
function para(t,cls){const p=document.createElement('p');p.textContent=t;if(cls)p.className=cls;return p}
function detail(c){
  const d=document.createElement('div');d.className='det';d.id=did(c);d.hidden=c.alias!==picked;
  if(d.hidden)return d;
  if(c.state==='withheld'){d.append(para(L.withheld,'note'));return d}
  const left=document.createElement('div');left.style.display='grid';left.style.gap='12px';
  left.append(block(L.next,para(c.next||L.unknown)));
  if(c.goal)left.append(block(L.goal,para(c.goal)));
  const mid=document.createElement('div');mid.style.display='grid';mid.style.gap='12px';
  if(c.branch)mid.append(block(L.branch,para(c.branch+' · '+(c.dirty?L.dirty:L.clean),'mono')));
  if(c.plan)mid.append(block(L.plan,para(`${c.plan.done} / ${c.plan.total} (${pct(c)}%)`)));
  mid.append(block(L.seen,para(ago(c.observedAt)+' · '+stateWord(c)+(c.area?' · '+c.area:''))));
  const ul=document.createElement('ul');ul.className='crew';
  const li=(p,t,main)=>{const x=document.createElement('li');x.innerHTML=mono(p,main);x.append(t);ul.append(x)};
  if(c.main)li(c.main,L.main+' · '+c.main,true);
  for(const w of c.crew)li(w.provider,(w.provider||L.unknown)+(w.role?' · '+w.role:''));
  const right=block(L.crew,c.main||c.crew.length?ul:para(L.noCrew));if(c.total>c.crew.length)right.append(para(L.more(c.total-c.crew.length)));
  d.append(left,mid,right,para(L.readOnly,'note'));return d;
}
function show(list){
  failed=false;lastLoad=lastTry=Date.now();
  const next=JSON.stringify(list);
  if(next===sig&&cards){hud();return}
  sig=next;cards=list;
  if(picked&&!cards.some(c=>c.alias===picked))picked=null;
  render();
}
function areas(){
  const box=el('areas'),n=new Map(),had=document.activeElement?.closest?.('#areas .chip')?.dataset?.k;
  for(const c of cards)n.set(c.area||'',(n.get(c.area||'')||0)+1);
  if(zone!=null&&!n.has(zone))zone=null;
  box.replaceChildren();if(n.size<2)return;
  const chip=(k,t,v)=>{const b=document.createElement('button');b.className='chip';b.type='button';b.dataset.k=k??'*';b.setAttribute('aria-pressed',String(zone===k));b.textContent=t;
    const s=document.createElement('span');s.textContent=String(v);b.append(s);b.onclick=()=>{zone=k;render()};box.append(b);if(had===b.dataset.k)b.focus()};
  chip(null,L.all,cards.length);
  for(const k of[...n.keys()].sort((a,b)=>(a==='')-(b==='')||(a<b?-1:a>b?1:0)))chip(k,k||L.other,n.get(k));
}
function render(){
  if(!cards)return;
  const box=el('list'),focus=document.activeElement?.closest?.('#list [data-alias]')?.dataset?.alias;
  areas();
  const q=query.toLowerCase(),vis=cards.filter(c=>(zone==null||(c.area||'')===zone)&&(!q||c.alias.toLowerCase().includes(q))),g=groups(vis),parts=[];shown=vis;
  for(const k of SECT){
    const list=g[k];if(!list.length)continue;
    const sec=document.createElement('section');sec.id='sec-'+k;sec.setAttribute('aria-labelledby','h-'+k);
    if(ROWS.includes(k)){
      sec.className='band k-'+k;
      sec.innerHTML=`<h2 id="h-${k}">${esc(L.sect[k])} <span class="n">${list.length}</span><span class="hint">${esc(L.hint[k])}</span></h2>`;
      const ul=document.createElement('ul');for(const c of list)ul.append(row(c,k));sec.append(ul);
    }else{
      // Quiet and unreachable projects shrink to name tags; the picked one opens below the tags.
      sec.className='rest k-'+k;
      sec.innerHTML=`<h2 id="h-${k}">${esc(L.sect[k])}<span class="n">${list.length}</span></h2>`;
      const ul=document.createElement('ul');for(const c of list){const li=document.createElement('li');li.append(tag(c));ul.append(li)}
      sec.append(ul);const open=list.find(c=>c.alias===picked);if(open)sec.append(detail(open));
    }
    parts.push(sec);
  }
  box.replaceChildren(el('status'),...parts);
  status(cards.length?vis.length?'':L.noMatch:L.empty);
  if(focus)for(const b of box.querySelectorAll('[data-alias]'))if(b.dataset.alias===focus){b.focus({preventScroll:true});break}
  hud();
}
function hud(){
  const vis=cards||[],g=groups(shown),mains=vis.filter(c=>c.main).length;
  el('sub').textContent=L.sub(vis.length)+(mains?L.mains(mains):'');
  el('sum').setAttribute('aria-label',L.summary);
  el('sum').innerHTML=SECT.filter(k=>g[k].length).map(k=>`<li><button type="button" class="pill k-${k}" data-jump="${k}">${esc(L.sect[k])} <b>${g[k].length}</b></button></li>`).join('');
  age();
}
function age(){const a=el('age');a.textContent=failed?L.failShort+(lastLoad?' · '+L.updated+' '+ago(new Date(lastLoad).toISOString()):''):lastLoad?L.updated+' '+ago(new Date(lastLoad).toISOString()):'';a.style.color=failed?'var(--warn)':''}
function select(alias,back){
  const prev=picked;picked=alias;render();
  if(!alias&&back&&prev)for(const b of el('list').querySelectorAll('[data-alias]'))if(b.dataset.alias===prev){b.focus();break}
}
function status(t){const s=el('status');s.textContent=t;s.hidden=!t}

/* ---------- host bridge (MCP Apps) ---------- */
const pending=new Map();let seq=0,hostOrigin='*',disposed=false,initP,hostModes=[];
function send(m,o=hostOrigin){window.parent.postMessage({jsonrpc:'2.0',...m},o)}
function request(method,params,timeout=30000){
  if(disposed)return Promise.reject(new Error('closed'));const id=++seq;
  return new Promise((res,rej)=>{const t=setTimeout(()=>{pending.delete(id);rej(new Error('timeout'))},timeout);pending.set(id,{res,rej,t});send({id,method,params})});
}
const hostColors=['background-primary','background-secondary','text-primary','text-secondary','border-primary','border-secondary','text-warning','background-warning','ring-info','text-danger','background-danger','text-success','background-success','text-info','background-info'];
const safe=v=>typeof v==='string'&&v.length<=200&&!/[\\;{}]|\b(?:url|expression|var|env|attr)\s*\(/i.test(v);
function appearance(ctx){
  if(!ctx||typeof ctx!=='object')return;const root=document.documentElement;
  if('theme' in ctx){if(ctx.theme==='light'||ctx.theme==='dark')root.setAttribute('data-theme',ctx.theme);else root.removeAttribute('data-theme')}
  if('locale' in ctx&&typeof ctx.locale==='string')setLang(ctx.locale);
  if(Array.isArray(ctx.availableDisplayModes)){hostModes=ctx.availableDisplayModes;el('expand').hidden=!hostModes.includes('fullscreen')||ctx.displayMode==='fullscreen'}
  if('displayMode' in ctx&&ctx.displayMode==='fullscreen')el('expand').hidden=true;
  const vars=ctx.styles?.variables;if(!vars)return;
  for(const k of [...hostColors.map(n=>'--color-'+n),'--font-sans','--font-mono','--border-radius-lg','--border-radius-md']){
    const v=vars[k];let ok=safe(v);if(ok)ok=k.startsWith('--color-')?CSS.supports('color',v):CSS.supports(k.startsWith('--font-')?'font-family':'border-radius',v.trim());
    if(ok)root.style.setProperty(k,v.trim());else root.style.removeProperty(k)}
  if(cards)render();
}
addEventListener('message',e=>{
  const m=e.data;
  if(e.source!==window.parent||(hostOrigin!=='*'&&e.origin!==hostOrigin)||!m||typeof m!=='object'||m.jsonrpc!=='2.0')return;
  if(typeof m.method==='string'&&(typeof m.id==='string'||typeof m.id==='number')){
    const o=e.origin&&e.origin!=='null'?e.origin:'*';
    if(m.method==='ui/resource-teardown'){disposed=true;for(const p of pending.values()){clearTimeout(p.t);p.rej(new Error('closed'))}pending.clear()}
    send({id:m.id,...(m.method==='ping'||m.method==='ui/resource-teardown'?{result:{}}:{error:{code:-32601,message:'Method not found'}})},o);return;
  }
  if(m.method==='ui/notifications/host-context-changed'){appearance(m.params);return}
  if(m.method==='ui/notifications/tool-result'){const list=cardsFrom(m.params);if(list)show(list);return}
  if('method' in m||!pending.has(m.id))return;
  if(e.origin&&e.origin!=='null')hostOrigin=e.origin;
  const p=pending.get(m.id);clearTimeout(p.t);pending.delete(m.id);
  m.error?p.rej(new Error(m.error.message||'host error')):p.res(m.result);
});
function initialize(){
  if(!initP)initP=(async()=>{
    const info=await request('ui/initialize',{appInfo:{name:'oms-home',version:'1'},appCapabilities:{availableDisplayModes:['inline','fullscreen']},protocolVersion:'2026-01-26'});
    appearance(info?.hostContext);send({method:'ui/notifications/initialized',params:{}});
  })().catch(e=>{initP=undefined;throw e});
  return initP;
}
async function refresh(){
  if(loading||disposed)return;loading=true;el('refresh').disabled=true;el('refresh').textContent=L.refreshing;
  if(!cards)status(L.loading);
  try{
    await initialize();
    const r=await request('tools/call',{name:'oms_list_projects',arguments:{cards:true}});
    if(!r||r.isError)throw new Error(r?.content?.[0]?.text||'tool error');
    const list=cardsFrom(r);show(list||[]);if(!list)status(L.bound);
  }catch{failed=true;lastTry=Date.now();if(!cards)status(L.fail);hud()}
  finally{loading=false;el('refresh').disabled=false;el('refresh').textContent=L.refresh}
}
const POLL=60000;
function due(){if(document.visibilityState==='visible'&&Date.now()-Math.max(lastLoad,lastTry)>=POLL)refresh()}

/* ---------- language + controls ---------- */
function setLang(loc){
  const next=/^en\b/i.test(loc||'')?'en':'ko';if(next===lang&&el('title').textContent)return;
  lang=next;L=T[lang];document.documentElement.lang=lang;
  el('title').textContent=L.title;document.title=L.title;
  el('refresh').textContent=L.refresh;el('expand').textContent=L.expand;el('find').placeholder=L.find;el('find').setAttribute('aria-label',L.find);
  if(cards)render();else hud();
}
function wire(){
  el('list').addEventListener('click',e=>{const b=e.target.closest?.('[data-alias]');if(b)select(b.dataset.alias===picked?null:b.dataset.alias,false)});
  el('sum').addEventListener('click',e=>{const k=e.target.closest?.('[data-jump]')?.dataset?.jump;const s=k&&el('sec-'+k);if(!s)return;s.scrollIntoView({block:'start',behavior:reduce.matches?'auto':'smooth'});s.querySelector('[data-alias]')?.focus({preventScroll:true})});
  document.addEventListener('keydown',e=>{if(e.key==='Escape'&&picked){e.preventDefault();select(null,true)}});
  el('refresh').onclick=()=>refresh();
  el('expand').onclick=async()=>{try{const r=await request('ui/request-display-mode',{mode:'fullscreen'},5000);if(r?.mode==='fullscreen')el('expand').hidden=true}catch{}};
  el('find').addEventListener('input',e=>{query=e.target.value.trim();render()});
  el('find').addEventListener('keydown',e=>{if(e.key!=='Enter')return;const b=el('list').querySelector('[data-alias]');if(b){e.preventDefault();select(b.dataset.alias,false);el('list').querySelector('[data-alias][aria-expanded="true"]')?.focus()}});
  document.addEventListener('visibilitychange',due);
  // Row ages tick in place so an unchanged payload never leaves them frozen.
  setInterval(()=>{due();age();for(const a of el('list').querySelectorAll('[data-at]'))a.textContent=ago(a.dataset.at)},15000);
}
setLang(navigator.language);wire();
if(window.parent===window)status(L.openApp);else refresh();
globalThis.OMSHome={show,groups,norm,cardsFrom,label,setLang};
</script>
