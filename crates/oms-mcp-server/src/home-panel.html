<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>OMS 마을</title>
<style>
:root{
  color-scheme:light dark;font:14px/1.45 var(--font-sans,system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo","Noto Sans KR",sans-serif);
  --bg:var(--color-background-primary,light-dark(#fbfaf6,#1c1f25));
  --surface:var(--color-background-secondary,light-dark(#f3f0e7,#252932));
  --ink:var(--color-text-primary,light-dark(#23262b,#eef0f3));
  --soft:var(--color-text-secondary,light-dark(#5d636c,#aeb4bd));
  --line:var(--color-border-secondary,light-dark(#e2ddd0,#3a3f49));
  --focus:var(--color-ring-info,light-dark(#1467b4,#96c7ff));
  --danger:var(--color-text-danger,light-dark(#b3261e,#ffb4ac));
  --danger-bg:var(--color-background-danger,light-dark(#fdecea,#3a2523));
  --ok:var(--color-text-success,light-dark(#17632f,#9fe0ae));
  --warn:var(--color-text-warning,light-dark(#7a4a12,#ffd292));
  --warn-bg:var(--color-background-warning,light-dark(#fff5e3,#30291f));
  --r:var(--border-radius-lg,14px);--r-sm:var(--border-radius-md,9px);
  --mono:var(--font-mono,ui-monospace,SFMono-Regular,Menlo,Consolas,monospace);
  --sea:light-dark(#bfe4f1,#15304a);--wave:light-dark(#d9f0f8,#1d4061);
  --grass:light-dark(#a3d57d,#4e7d4a);--grass2:light-dark(#97cc71,#477347);--lip:light-dark(#7db65c,#3d6340);
  --dirt:light-dark(#cf9f6f,#6d5440);--dirt2:light-dark(#ab7f55,#56422f);
  --wall:light-dark(#fbf1df,#e4d7bf);--wall2:light-dark(#e6d6ba,#bfb096);
  --win:#ffd86b;--win-off:light-dark(#8593a8,#3d4759);--plank:light-dark(#c9a074,#8a6a4a);
  --tagbg:light-dark(#fffdf8,#2b2f38);
}
:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink)}
.app{display:grid;gap:10px;padding:12px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.brand svg{flex:none}
h1{font-size:18px;margin:0;line-height:1.2}
.sub{margin:0;color:var(--soft);font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.stat{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:2px 10px;font-size:12.5px;white-space:nowrap}
.stat b{font-variant-numeric:tabular-nums;margin-left:4px}
.stat.hot{border-color:color-mix(in srgb,var(--danger) 45%,var(--line));color:var(--danger);background:var(--danger-bg)}
.tools{display:flex;gap:6px;align-items:center}
.age{font-size:12px;color:var(--soft);white-space:nowrap}
button{font:inherit;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-sm);padding:4px 11px;min-height:32px;cursor:pointer}
button:hover{border-color:var(--soft)}
button:disabled{opacity:.55;cursor:default}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
.attn{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:thin;min-height:32px}
.attn .lbl{font-size:12px;color:var(--soft);white-space:nowrap;margin-right:2px}
.chip{border-radius:999px;padding:2px 10px;min-height:28px;white-space:nowrap;font-size:12.5px;background:var(--danger-bg);border-color:color-mix(in srgb,var(--danger) 35%,var(--line))}
.chip b{color:var(--danger);margin-left:5px}
.quiet{font-size:12.5px;color:var(--soft)}
.body{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:12px;align-items:start}
.mapwrap{position:relative;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;background:var(--sea);height:clamp(380px,72vh,920px);touch-action:none;user-select:none;-webkit-user-select:none}
#map{width:100%;height:100%;display:block;cursor:grab}
#map.drag{cursor:grabbing}
.find{position:absolute;z-index:1;left:10px;top:10px;display:flex;gap:6px}
.find input{font:inherit;color:inherit;width:min(220px,46vw);min-height:32px;padding:4px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:color-mix(in srgb,var(--bg) 92%,transparent)}
.ctl{position:absolute;z-index:1;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.ctl button{width:34px;height:34px;padding:0;font-size:17px;line-height:1;background:color-mix(in srgb,var(--bg) 90%,transparent)}
.ctl button.wide{width:auto;padding:0 10px;font-size:12.5px}
#mini{position:absolute;z-index:1;left:10px;bottom:10px;width:140px;height:90px;background:color-mix(in srgb,var(--bg) 82%,transparent);border:1px solid var(--line);border-radius:8px;cursor:pointer}
.hint{position:absolute;z-index:1;right:10px;bottom:10px;font-size:11.5px;color:var(--soft);background:color-mix(in srgb,var(--bg) 85%,transparent);padding:2px 8px;border-radius:6px}
.status{position:absolute;inset:0;display:grid;place-items:center;text-align:center;padding:24px;color:var(--soft);pointer-events:none}
.status[hidden]{display:none}
aside{border:1px solid var(--line);border-radius:var(--r);background:var(--surface);padding:14px;overflow:auto;max-height:clamp(380px,72vh,920px)}
aside h2{font-size:16px;margin:0;word-break:break-word}
.who{display:flex;gap:12px;align-items:center;margin-bottom:10px}
.portrait{flex:none;width:72px;height:80px;border-radius:12px;background:var(--bg);border:1px solid var(--line)}
.badges{display:flex;flex-wrap:wrap;gap:5px;margin-top:5px}
.badge{font-size:11.5px;border-radius:999px;padding:1px 8px;border:1px solid var(--line);background:var(--bg);white-space:nowrap}
.badge.fresh{color:var(--ok)}.badge.attn{color:var(--danger);background:var(--danger-bg)}.badge.warn{color:var(--warn);background:var(--warn-bg)}
.note{font-size:12.5px;color:var(--soft);border:1px dashed var(--line);border-radius:10px;padding:8px 10px;margin:8px 0 12px}
dl{margin:0;display:grid;grid-template-columns:auto minmax(0,1fr);gap:7px 12px;font-size:13px}
dt{color:var(--soft)}dd{margin:0;word-break:break-word}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:3px}
.bar i{display:block;height:100%;background:var(--ok)}
.mono{font-family:var(--mono);font-size:12.5px}
h3{font-size:13px;margin:16px 0 8px;color:var(--soft);font-weight:600}
.crew{display:grid;gap:6px;list-style:none;margin:0;padding:0}
.crew li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:var(--bg)}
.crew svg{flex:none}
.crew .nm{font-weight:700;letter-spacing:.04em;font-family:var(--mono);font-size:12.5px}
.crew .rl{font-size:12px;color:var(--soft)}
.mark{width:14px;height:14px;vertical-align:-2px;margin-right:4px}
.areas{display:grid;gap:5px;list-style:none;margin:8px 0 0;padding:0}
.areas button{width:100%;display:flex;justify-content:space-between;gap:8px;text-align:left;background:var(--bg)}
details.legend{font-size:12.5px;color:var(--soft)}
details.legend ul{display:flex;flex-wrap:wrap;gap:4px 16px;margin:6px 0 0;padding-left:18px}
/* map */
.house{cursor:pointer;outline:none}
.house .sel{fill:transparent;stroke:transparent;stroke-width:2.5}
.house:hover .sel{stroke:color-mix(in srgb,var(--focus) 45%,transparent)}
.house:focus-visible .sel,.house[aria-pressed="true"] .sel{stroke:var(--focus);fill:color-mix(in srgb,var(--focus) 16%,transparent)}
.dim{filter:saturate(.22) brightness(1.04)}
.tag{opacity:0;transition:opacity .15s;pointer-events:none}
#map.near .tag,#map.few .tag,.tag.on{opacity:1}
.ctag{opacity:0}
.more{font:700 8px system-ui,sans-serif;fill:var(--ink);paint-order:stroke;stroke:var(--surface);stroke-width:2.5px}
.picked .ctag{opacity:1}
.tagbox{fill:var(--tagbg);stroke:var(--line)}
.tagtx{fill:var(--ink);font-size:10.5px;font-weight:600}
.areatx{fill:var(--ink);font-size:13px;font-weight:700}
.puff{fill:#f4f4f4;opacity:0;animation:puff 2.6s linear infinite;transform-box:fill-box;transform-origin:center}
@keyframes puff{0%{opacity:0;transform:translate(0,0) scale(.5)}20%{opacity:.85}100%{opacity:0;transform:translate(-5px,-16px) scale(1.6)}}
.bob{animation:bob 1.8s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-.8px)}}
.zz{font-size:8px;fill:var(--soft);font-weight:700}
@media (prefers-reduced-motion:reduce){.puff,.bob{animation:none}.puff{opacity:.6}.tag{transition:none}}
@media (max-width:760px){.body{grid-template-columns:minmax(0,1fr)}aside{max-height:none}.mapwrap{height:clamp(340px,62vh,640px)}#mini{display:none}}
</style>
</head>

    <div class="brand">
      <svg width="34" height="34" viewBox="-17 -22 34 30" aria-hidden="true"><polygon points="0,-8 14,-1 0,6 -14,-1" fill="#a3d57d"/><polygon points="-14,-1 0,6 0,9 -14,2" fill="#cf9f6f"/><polygon points="14,-1 0,6 0,9 14,2" fill="#ab7f55"/><polygon points="-6,-4 3,0 3,-7 -6,-11" fill="#fbf1df"/><polygon points="3,0 8,-2.5 8,-9.5 3,-7" fill="#e6d6ba"/><polygon points="-7,-10 2,-6 5.5,-15 -3.5,-19" fill="#e07f45"/><polygon points="2,-6 9,-9.5 5.5,-15" fill="#e6d6ba"/></svg>

      <svg id="mini" aria-hidden="true"><g id="minig"></g><rect id="minivp" fill="none" stroke="var(--focus)" stroke-width="1.5"/></svg>
      <span class="hint" id="hint"></span>
      <p class="status" id="status" role="status"></p>
    </section>
    <aside id="insp" aria-live="polite"></aside>
  </div>
  <details class="legend"><summary id="legendT"></summary><ul id="legend"></ul></details>
</div>

  return{alias,state,area,main:prov(c.main),branch:str(c.branch,120),dirty:c.dirty===true,goal:str(c.goal,240),next:str(c.next,200),
    plan:plan&&plan.total?{done:Math.min(plan.done||0,plan.total),total:plan.total}:null,attention:Math.min(num(c.attention)||0,99),

function cardsFrom(r){

// observedAt is an RFC3339 UTC string or null.

/* ---------- world layout: stable, deterministic ---------- */
const TW=32,TH=16,LOT=3,GAP=3,DEPTH=16;
const P=(i,j,z=0)=>[(i-j)*TW,(i+j)*TH-z];
function layout(cards){
  const groups=new Map();
  for(const c of cards){const a=c.area||'';if(!groups.has(a))groups.set(a,[]);groups.get(a).push(c)}
  const names=[...groups.keys()].sort((a,b)=>(!a)-(!b)||(a<b?-1:a>b?1:0));
  const islands=names.map(name=>{
    // Headroom keeps collisions and island growth rare; placing in home-slot order means a newcomer only shifts its own probe run.
    const list=groups.get(name);let k=2;while(k*k<list.length*1.5)k++;
    const cap=k*k,slots=new Array(cap).fill(null),home=c=>hash(c.alias)%cap;
    for(const c of [...list].sort((x,y)=>home(x)-home(y)||(x.alias<y.alias?-1:1))){let s=home(c);while(slots[s])s=(s+1)%cap;slots[s]=c}
    return{name,list,k,N:k*LOT+2,slots};
  });
  const total=islands.reduce((s,x)=>s+x.N*x.N,0),maxN=Math.max(0,...islands.map(x=>x.N));
  const limit=Math.max(maxN,Math.ceil(Math.sqrt(total)*1.45));
  const rows=[[]];let i=0,j=0,rowH=0;
  for(const s of islands){if(i>0&&i+s.N>limit){j+=rowH+GAP;i=0;rowH=0;rows.push([])}s.I=i;s.J=j;i+=s.N+GAP;rowH=Math.max(rowH,s.N);rows.at(-1).push(s)}
  const bridges=[];
  for(const r of rows)for(let n=1;n<r.length;n++){const a=r[n-1],b=r[n];bridges.push({axis:'i',from:a.I+a.N,to:b.I,at:a.J+Math.min(a.N,b.N)/2})}
  for(let n=1;n<rows.length;n++){const a=rows[n-1][0],b=rows[n][0];bridges.push({axis:'j',from:a.J+a.N,to:b.J,at:a.I+Math.min(a.N,b.N)/2})}
  const homes=new Map();
  for(const s of islands)s.slots.forEach((c,n)=>{if(c)homes.set(c.alias,{c,i:s.I+1+(n%s.k)*LOT,j:s.J+1+Math.floor(n/s.k)*LOT,island:s})});
  let x0=1/0,y0=1/0,x1=-1/0,y1=-1/0;
  for(const s of islands)for(const[x,y]of[P(s.I,s.J,60),P(s.I+s.N,s.J),P(s.I,s.J+s.N),P(s.I+s.N,s.J+s.N,-DEPTH-30)]){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}
  return{islands,bridges,homes,box:islands.length?{x:x0-30,y:y0-30,w:x1-x0+60,h:y1-y0+60}:{x:0,y:0,w:1,h:1}};
}

/* ---------- drawing ---------- */
const f=n=>Math.round(n*10)/10;
const pts=a=>a.map(([x,y])=>f(x)+','+f(y)).join(' ');
const poly=(a,fill,x='')=>`<polygon points="${pts(a)}" fill="${fill}"${x}/>`;
const esc=s=>String(s).replace(/[&<>"']/g,c=>'&#'+c.charCodeAt(0)+';');
const at=(i,j,z=0)=>{const[x,y]=P(i,j,z);return`translate(${f(x)} ${f(y)})`};
function box(i0,j0,i1,j1,z0,z1,top,left,right){
  return poly([P(i1,j0,z0),P(i1,j1,z0),P(i1,j1,z1),P(i1,j0,z1)],right)+poly([P(i0,j1,z0),P(i1,j1,z0),P(i1,j1,z1),P(i0,j1,z1)],left)+(top?poly([P(i0,j0,z1),P(i1,j0,z1),P(i1,j1,z1),P(i0,j1,z1)],top):'');
}
function bridge(b){
  const w=.9,z=-6;let q;
  if(b.axis==='i')q=[[b.from-.3,b.at-w/2],[b.to+.3,b.at-w/2],[b.to+.3,b.at+w/2],[b.from-.3,b.at+w/2]];
  else q=[[b.at-w/2,b.from-.3],[b.at+w/2,b.from-.3],[b.at+w/2,b.to+.3],[b.at-w/2,b.to+.3]];
  let o=poly(q.map(([i,j])=>P(i,j,z-3)),'var(--dirt2)')+poly(q.map(([i,j])=>P(i,j,z)),'var(--plank)');
  const n=Math.max(2,Math.round(Math.abs(b.to-b.from)*2.5));
  for(let k=1;k<n;k++){const t=(b.from-.3)+(b.to-b.from+.6)*k/n;const a=b.axis==='i'?[P(t,b.at-w/2,z),P(t,b.at+w/2,z)]:[P(b.at-w/2,t,z),P(b.at+w/2,t,z)];o+=`<line x1="${f(a[0][0])}" y1="${f(a[0][1])}" x2="${f(a[1][0])}" y2="${f(a[1][1])}" stroke="var(--dirt2)" stroke-width="1"/>`}
  return o;
}
function tree(i,j,seed){
  const[x,y]=P(i,j),r=7+(seed%4),g=['#5fae55','#4f9e4c','#6cbb5e'][seed%3];
  return`<g transform="translate(${f(x)} ${f(y)})"><ellipse cx="0" cy="0" rx="6" ry="3" fill="#000" opacity=".12"/><rect x="-1.5" y="-9" width="3" height="9" fill="#8a5a3b"/><circle cx="0" cy="${-9-r*.6}" r="${r}" fill="${g}"/><circle cx="${-r*.35}" cy="${-9-r*.9}" r="${r*.45}" fill="#fff" opacity=".18"/></g>`;
}
function flowers(i,j,seed){let o='';for(let k=0;k<4;k++){const s=hash(seed+':'+k),[x,y]=P(i+(s%100)/40,j+((s>>>8)%100)/40);o+=`<circle cx="${f(x)}" cy="${f(y)}" r="1.6" fill="${['#ffd1dc','#fff3a6','#ffffff','#ffb3a7'][s%4]}"/>`}return o}
function deco(key,i,j){const s=hash(key);let o=flowers(i+.3,j+.3,key);if(s%3!==0){o+=tree(i+.9,j+.8,s);if(s%2)o+=tree(i+2.1,j+1.4,s>>>3);if(s%5===0)o+=tree(i+1.3,j+2.3,s>>>5)}return o}
function fence(i,j){
  let o='';const e=[[i+.2,j+.2],[i+2.8,j+.2],[i+2.8,j+2.8],[i+.2,j+2.8]];
  for(const[a,b]of[[1,2],[3,2]]){const[p,q]=[e[a],e[b]];for(let k=0;k<=6;k++){const t=k/6,[x,y]=P(p[0]+(q[0]-p[0])*t,p[1]+(q[1]-p[1])*t);o+=`<rect x="${f(x-1)}" y="${f(y-8)}" width="2" height="8" fill="var(--plank)"/>`}
    const[x1,y1]=P(...p,5),[x2,y2]=P(...q,5);o+=`<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" stroke="var(--plank)" stroke-width="1.6"/>`}
  return o;
}
function house(c,i,j){
  const[roof,roofD]=PROV[c.main||'none'],lit=c.state==='fresh',i0=i+.35,j0=j+.35,i1=i+1.85,j1=j+1.6,h=22,rh=15,jm=(j0+j1)/2,ov=.12;
  const win=lit?'var(--win)':'var(--win-off)';
  let o=`<ellipse cx="${f(P(i1,j1)[0])}" cy="${f(P(i1,j1)[1]-4)}" rx="30" ry="9" fill="#000" opacity=".10"/>`;
  o+=poly([P(i1,j0),P(i1,j1),P(i1,j1,h),P(i1,j0,h)],'var(--wall2)');
  o+=poly([P(i0,j1),P(i1,j1),P(i1,j1,h),P(i0,j1,h)],'var(--wall)');
  o+=poly([P(i1,j0,h),P(i1,j1,h),P(i1,jm,h+rh)],'var(--wall2)');
  const d0=i0+.6,d1=i0+.9;o+=poly([P(d0,j1),P(d1,j1),P(d1,j1,12),P(d0,j1,12)],'#8a5a3b');
  o+=poly([P(i0+.18,j1,9),P(i0+.45,j1,9),P(i0+.45,j1,16),P(i0+.18,j1,16)],win,' stroke="#6b4a33" stroke-width=".6"');
  o+=poly([P(i0+1.08,j1,9),P(i0+1.35,j1,9),P(i0+1.35,j1,16),P(i0+1.08,j1,16)],win,' stroke="#6b4a33" stroke-width=".6"');
  o+=poly([P(i1,j0+.3,9),P(i1,j0+.62,9),P(i1,j0+.62,16),P(i1,j0+.3,16)],win,' stroke="#6b4a33" stroke-width=".6"');
  const ci0=i0+.25,ci1=i0+.5,cj0=j0+.15,cj1=j0+.38,cz=h+rh*.55;
  o+=poly([P(i0-ov,j0-ov,h-2),P(i1+ov,j0-ov,h-2),P(i1+ov,jm,h+rh),P(i0-ov,jm,h+rh)],roofD);
  o+=box(ci0,cj0,ci1,cj1,cz-6,h+rh+7,'#5b5f6b','#7a7f8c','#666b77');
  o+=poly([P(i0-ov,jm,h+rh),P(i1+ov,jm,h+rh),P(i1+ov,j1+ov,h-2),P(i0-ov,j1+ov,h-2)],roof);
  const[rx1,ry1]=P(i0-ov,jm,h+rh),[rx2,ry2]=P(i1+ov,jm,h+rh);o+=`<line x1="${f(rx1)}" y1="${f(ry1)}" x2="${f(rx2)}" y2="${f(ry2)}" stroke="${roofD}" stroke-width="1.5"/>`;
  const[sx,sy]=P((ci0+ci1)/2,(cj0+cj1)/2,h+rh+9);

  if(c.state==='stale'||c.state==='missing')o+=`<text class="zz" x="${f(sx+6)}" y="${f(sy-2)}">${c.state==='stale'?'z z':'?'}</text>`;

function garden(c,i,j){

  let o=poly([P(i0,j0),P(i1,j0),P(i1,j1),P(i0,j1)],'var(--dirt)')+poly([P(i0,j1),P(i1,j1),P(i1,j1,-2),P(i0,j1,-2)],'var(--dirt2)');

    o+=k<ripe?`<g transform="translate(${f(x)} ${f(y)})"><path d="M0 0 q-3 -4 -1 -7 M0 0 q3 -4 1 -7" stroke="#3f8a3a" stroke-width="1.4" fill="none"/><circle cx="0" cy="-7" r="2.2" fill="${['#ff6b6b','#ffb347','#ffd93d','#c77dff'][k%4]}"/></g>`
      :c.plan?`<path d="M${f(x)} ${f(y)} q-1.5 -2.5 0 -3.5" stroke="#6fae5f" stroke-width="1.2" fill="none"/>`:'';}

  claude:{hair:'#ecdcc2',hs:'#c9b08d',hi:'#fbf3e4',acc:'#f0a13a',top:'#fbf5ea',in:'#2f2928',low:'#2f2928',leg:'#3b3335',shoe:'#2a2422',bow:'#8c2a3c',tip:'#f0a13a'},
  antigravity:{hair:'#f7d27c',hs:'#dcaa52',bk:'#ebbf66',hi:'#fff3c8',acc:'#2a9d8f',top:'#fcfaf4',in:'#2c3a6e',low:'#2c3a6e',leg:'#fdfdfd',shoe:'#26222a',tip:'#ff6f91',tip2:'#4d7ff0'},
  none:{hair:'#8a6448',hs:'#664630',hi:'#b08a6c',acc:'#7a8494',top:'#9aa2ae',in:'#59616e',low:'#4a515c',leg:'#4a515c',shoe:'#646c79',tip:'#7a8494'}};
const SKIN='#fff1e7',SKL='#e8b9a0',OUT='#4b3b34';
const ol=(w=.4)=>` stroke="${OUT}" stroke-width="${w}" stroke-linejoin="round" stroke-linecap="round"`;
// Main mood follows the project's state, so a glance at the face says how the project is doing.
function mood(c){return c.state==='stale'?'sleep':c.state==='missing'||c.state==='unavailable'?'lost':c.attention>0?'worry':c.active?'busy':'happy'}
// Face: big round head, large dark eyes set low, round blush and a small cat mouth.
function face(m){
  let o=`<ellipse cx="0" cy="-19.3" rx="8" ry="7.4" fill="${SKIN}"${ol(.35)}/>`;
  for(const x of[-3.5,3.5]){const d=Math.sign(x);
    o+=m==='sleep'?`<path d="M${x-1.9} -16.6 Q${x} -15 ${x+1.9} -16.6" stroke="${OUT}" stroke-width=".6" fill="none" stroke-linecap="round"/>`
      :m==='lost'?`<circle cx="${x}" cy="-16.8" r="1" fill="#2a2230"/>`
      :`<ellipse cx="${x}" cy="-16.8" rx="2.3" ry="${m==='busy'?2.2:2.55}" fill="#2a2230"/><circle cx="${x-.75}" cy="-17.85" r="1.05" fill="#fff"/><circle cx="${x+.85}" cy="-15.8" r=".45" fill="#fff"/><path d="M${x+1.9*d} -18.6 l${.65*d} -.5 M${x+2.2*d} -17.6 l${.7*d} -.2" stroke="#2a2230" stroke-width=".4" stroke-linecap="round"/>`;
  }
  o+='<ellipse cx="-5.7" cy="-14.5" rx="1.75" ry="1.15" fill="#ffa7a6" opacity=".55"/><ellipse cx="5.7" cy="-14.5" rx="1.75" ry="1.15" fill="#ffa7a6" opacity=".55"/>';
  o+=m==='worry'?'<path d="M-1 -13.6 q.5 -.5 1 0 q.5 .5 1 0" stroke="#6b3a3a" stroke-width=".38" fill="none" stroke-linecap="round"/>'
    :m==='lost'?'<ellipse cx="0" cy="-13.8" rx=".5" ry=".42" fill="#6b3a3a"/>'
    :m==='sleep'?'<path d="M-.5 -13.8 h1" stroke="#6b3a3a" stroke-width=".38" stroke-linecap="round"/>'
    :m==='busy'?'<path d="M-.75 -13.4 L0 -14.2 L.75 -13.4" stroke="#6b3a3a" stroke-width=".38" fill="none" stroke-linecap="round" stroke-linejoin="round"/>'
    :'<path d="M-1.1 -14.2 Q-.55 -13.3 0 -14.1 Q.55 -13.3 1.1 -14.2" stroke="#6b3a3a" stroke-width=".38" fill="none" stroke-linecap="round"/>';
  return o;
}
// Bangs: crown cap with a strand-cut lower edge; pts run from the right temple to the left one.
function bangs(k,pts){
  let d='M-8.8 -17.4 C-9.6 -26.4 -4.9 -29.4 0 -29.4 C4.9 -29.4 9.6 -26.4 8.8 -17.4';
  for(const[x,y,cx,cy]of pts)d+=cx===undefined?` L${x} ${y}`:` Q${cx} ${cy} ${x} ${y}`;
  return`<path d="${d}Z" fill="${k.hair}"${ol()}/><path d="M-5.6 -25.6 Q-3.4 -27.4 -.6 -27.6 M1.4 -27.6 Q3.8 -27.3 5.4 -26" stroke="${k.hi}" stroke-width=".85" fill="none" stroke-linecap="round" opacity=".9"/>`;
}
const BOB=[[7.4,-19.8,8.4,-18.8],[6.2,-19],[5,-20.2,5.6,-19.4],[3.5,-19.5],[2,-20.4,2.8,-19.8],[.4,-19.6],[-1.2,-20.4,-.4,-19.9],[-2.8,-19.5],[-4.3,-20.3,-3.5,-19.8],[-5.8,-19.2],[-7.4,-20,-6.4,-19.4],[-8.8,-17.4,-8.4,-18.8]];
function sleeve(x,c,cuff){const d=Math.sign(x);return`<path d="M${x} -11.8 Q${x+1.7*d} -11.4 ${x+2.4*d} -8.2 L${x+.6*d} -7.6 Q${x+.1*d} -9.6 ${x-.6*d} -10.4Z" fill="${c}"${ol(.35)}/>${cuff?`<path d="M${x+2.5*d} -8.4 L${x+.5*d} -7.6" stroke="${cuff}" stroke-width=".9" stroke-linecap="round"/>`:''}<circle cx="${x+1.6*d}" cy="-7.1" r="1.1" fill="${SKIN}" stroke="${SKL}" stroke-width=".3"/>`}
function legs(k,top){return`<rect x="-2.75" y="${top}" width="2.1" height="${-1-top}" rx=".5" fill="${k.leg}"${ol(.3)}/><rect x=".65" y="${top}" width="2.1" height="${-1-top}" rx=".5" fill="${k.leg}"${ol(.3)}/><path d="M-3.9 -.7 Q-3.9 -2.4 -1.7 -2.4 Q-.4 -2.4 -.4 -.9 Q-.4 -.1 -2.1 -.1 Q-3.9 -.1 -3.9 -.7Z M3.9 -.7 Q3.9 -2.4 1.7 -2.4 Q.4 -2.4 .4 -.9 Q.4 -.1 2.1 -.1 Q3.9 -.1 3.9 -.7Z" fill="${k.shoe}"${ol(.35)}/>`}
function sdNone(k,m){
  let o=`<path d="M-9 -19.6 C-9.6 -26.6 -5 -29.4 0 -29.4 C5 -29.4 9.6 -26.6 9 -19.6 C9 -16.8 8.8 -15 8 -14 L-8 -14 C-8.8 -15 -9 -16.8 -9 -19.6Z" fill="${k.hs}"${ol()}/>`;
  o+=legs(k,-5)+`<path d="M-3.6 -8.4 L3.6 -8.4 L3.9 -5 L-3.9 -5Z" fill="${k.low}"${ol(.35)}/>`+sleeve(-3.8,k.top)+sleeve(3.8,k.top)+`<path d="M-4 -12 Q0 -12.8 4 -12 L4.6 -6.6 Q0 -6 -4.6 -6.6Z" fill="${k.top}"${ol(.35)}/>`;
  return o+face(m)+bangs(k,BOB);
}
function figure(p,k,m){const a=ART[p];return a?`<image href="${a.src}" x="${f(-a.w/2)}" y="${f(-a.h)}" width="${a.w}" height="${a.h}"/>`:sdNone(k,m)}
const eyeY=p=>ART[p]?-ART[p].h*(1-ART[p].e):-16.8,topY=p=>ART[p]?-ART[p].h:-29.4;
function chibi(c){
  const p=MASCOT[c.main]?c.main:'none',k=MASCOT[p],m=mood(c),fly=p==='antigravity',E=eyeY(p),T=topY(p);
  const o=fly?`<ellipse cx="0" cy="0" rx="4.4" ry="1" fill="#000" opacity=".1"/><ellipse cx="0" cy="-1.4" rx="6" ry="1.5" fill="none" stroke="${k.tip2}" stroke-width=".5" opacity=".6" stroke-dasharray="2 1"/><g transform="translate(0 -2.4)">`
    :'<ellipse cx="0" cy="0" rx="6" ry="1.5" fill="#000" opacity=".15"/><g>';
  // Mood marks sit by the head: a sweat drop when the project needs you, sleep z when stale, a question mark when missing.
  const over=m==='worry'?`<path d="M10.2 ${f(E-6)} q1.5 2.4 0 3.3 q-1.5 -.9 0 -3.3z" fill="#8fd3ff" stroke="#4f9fd0" stroke-width=".3"/>`
    :m==='sleep'?`<text x="8.6" y="${f(T+4)}" font-size="4.4" font-weight="800" fill="#7b88a8">z</text><text x="11.4" y="${f(T+.8)}" font-size="3" font-weight="800" fill="#7b88a8">z</text>`
    :m==='lost'?`<text x="9" y="${f(T+4.6)}" font-size="5" font-weight="800" fill="#7b88a8">?</text>`:'';
  return o+figure(p,k,m)+over+'</g>';
}
// Helper: a pocket-size copy of its provider's figure holding a sign with the provider mark; the hat says the role.
function helper(w){
  const p=MASCOT[w.provider]?w.provider:'none',k=MASCOT[p],top=hash(w.name||'x')%3,E=eyeY(p),dy=f(topY(p)+29.4+(ART[p]?3.2:0));
  const hat=w.role==='builder'?`<g transform="translate(0 ${dy})"><path d="M-8.2 -25.4 Q-7.8 -33 0 -33.4 Q7.8 -33 8.2 -25.4Z" fill="#ffc83d" stroke="#b8860b" stroke-width=".7"/><rect x="-10" y="-26.4" width="20" height="2" rx="1" fill="#ffc83d" stroke="#b8860b" stroke-width=".6"/><rect x="-.9" y="-33" width="1.8" height="6.6" fill="#d9a520"/></g>`
    :w.role==='reviewer'?`<circle cx="-3.3" cy="${f(E)}" r="2.9" fill="none" stroke="#3b3b45" stroke-width=".8"/><circle cx="3.3" cy="${f(E)}" r="2.9" fill="none" stroke="#3b3b45" stroke-width=".8"/><path d="M-.4 ${f(E-.3)} h.8" stroke="#3b3b45" stroke-width=".8"/>`
    :w.role==='researcher'?`<g transform="translate(0 ${dy})"><path d="M-9.6 -30.4 L0 -33.8 L9.6 -30.4 L0 -27Z" fill="#2f3542"/><path d="M-5 -29 v2.4 Q0 -24.4 5 -26.6 v-2.4" fill="#2f3542"/><path d="M8.8 -30.4 v5" stroke="#ffcf3f" stroke-width=".8"/><circle cx="8.8" cy="-25" r=".9" fill="#ffcf3f"/></g>`
    :top===0?`<path transform="translate(0 ${dy})" d="M0 -29 q-.8 -4.4 -4.8 -5.2 q1.2 4 4.8 5.2 q.8 -4.8 5.2 -5.6 q-1.2 4.4 -5.2 5.6" fill="#5fae55"/>`:'';
  let o='<ellipse cx="0" cy="-.3" rx="3.4" ry=".9" fill="#000" opacity=".15"/>'+`<g transform="scale(.4)">${figure(p,k,'happy')}${hat}</g>`;
  o+=`<rect x="5.2" y="-12.4" width=".7" height="10.4" fill="#8a5a3b"/><circle cx="4.7" cy="-4.4" r=".9" fill="${SKIN}" stroke="${SKL}" stroke-width=".25"/><rect x="2.9" y="-17.6" width="6.6" height="5.8" rx=".9" fill="#fff" stroke="${k.acc}" stroke-width=".45"/>`;
  o+=w.provider&&MARK[w.provider]?`<image href="${MARK[w.provider]}" x="3.75" y="-17" width="4.9" height="4.6"><title>${w.provider}</title></image>`:'<text x="6.2" y="-13.2" text-anchor="middle" font-size="4.6" font-weight="700" fill="#646c79">?</text>';
  return o;
}

/* ---------- lots and labels ---------- */
function stateWord(c){return L.st[c.state]+(c.degraded?' · '+L.degraded:'')}
function label(c){
  const parts=[c.alias,stateWord(c)];
  if(c.attention)parts.push(L.attention+' '+c.attention);
  if(c.total)parts.push(L.workers+' '+crewOf(c).map(w=>w.name+(w.provider?' ('+w.provider+')':'')).join(' ')+(c.total>c.crew.length?' '+L.more(c.total-c.crew.length):''));
  if(c.state!=='withheld'&&c.observedAt!=null)parts.push(L.seen+' '+ago(c.observedAt));
  return parts.join(', ');
}
function lot(home,picked){
  const{c,i,j}=home,dim=c.state==='stale'||c.state==='missing';
  let o=`<g class="house${picked?' picked':''}" tabindex="0" role="button" data-alias="${esc(c.alias)}" aria-pressed="${picked}" aria-label="${esc(label(c))}">`;
  o+=poly([P(i+.05,j+.05),P(i+LOT-.05,j+.05),P(i+LOT-.05,j+LOT-.05),P(i+.05,j+LOT-.05)],'transparent',' class="sel"');
  if(c.state==='withheld')o+=fence(i,j)+cloud(i,j);
  else if(c.state==='unavailable')o+=poly([P(i+.4,j+.4),P(i+2.4,j+.4),P(i+2.4,j+2.4),P(i+.4,j+2.4)],'var(--dirt)')+sign(i+1.5,j+1.7,L.st.unavailable);
  else{
    o+=`<g${dim?' class="dim"':''}>${house(c,i,j)}`;
    for(const[n,w]of crewOf(c).entries()){const[a,b]=PARK(n),tw=w.name.length*5+8,fill=PROV[w.provider||'none'][1];
      o+=`<g class="walker" data-i="${i}" data-j="${j}" data-k="${n}" transform="${at(i+a,j+b)}"><g class="bob" style="animation-delay:${-n*.5}s">${helper(w)}</g><g class="ctag"><path d="M6 -10 l4 -3 v6z" fill="${fill}"/><rect x="9" y="-15" width="${tw}" height="10" rx="3" fill="${fill}"/><text x="${9+tw/2}" y="-7.5" text-anchor="middle" font-size="7.5" font-weight="700" fill="#fff" font-family="var(--mono)">${w.name}</text></g></g>`}
    if(c.total>c.crew.length)o+=`<text class="more" transform="${at(i+2.6+c.crew.length*.22,j+.6+c.crew.length*.7)}" y="-3" text-anchor="middle">+${c.total-c.crew.length}</text>`;
    o+=garden(c,i,j);
    o+=`<g transform="${at(i+1.2,j+1.88)} scale(1.3)"><g class="bob">${chibi(c)}</g></g>`;
    if(c.degraded)o+=sign(i+.25,j+2.85,'⚠');
    o+='</g>';
  }
  return o+'</g>';
}
function tagFor(home){
  const{c,i,j}=home,[x,y]=P(i+1.1,j+1,c.state==='withheld'?44:56),word=[c.state==='fresh'?'':L.st[c.state],c.degraded?L.degraded:''].filter(Boolean).map(w=>' · '+w).join('');
  const text=c.alias+word,w=Math.min(220,text.length*6+14);
  let o=`<g class="tag fx" data-for="${esc(c.alias)}" data-x="${f(x)}" data-y="${f(y)}" transform="translate(${f(x)} ${f(y)})"><rect class="tagbox" x="${f(-w/2)}" y="-9" width="${f(w)}" height="17" rx="5"/><text class="tagtx" x="0" y="3.5" text-anchor="middle">${esc(text)}</text></g>`;
  if(c.attention){const[bx,by]=P(i+1.1,j+1,c.state==='withheld'?62:76),t='!'+c.attention,bw=t.length*7+10;
    o+=`<g class="fx" data-x="${f(bx)}" data-y="${f(by)}" transform="translate(${f(bx)} ${f(by)})" aria-hidden="true"><path d="M${-bw/2} -9 h${bw} a4 4 0 0 1 4 4 v8 a4 4 0 0 1 -4 4 h${-bw/2+4} l-4 5 l-2 -5 h${-bw/2+6} a4 4 0 0 1 -4 -4 v-8 a4 4 0 0 1 4 -4z" fill="#e5484d" stroke="#fff" stroke-width="1.2"/><text x="0" y="3.6" text-anchor="middle" font-size="11" font-weight="800" fill="#fff">${t}</text></g>`}
  return o;
}
function islandSvg(s,picked){
  const{I,J,N}=s;
  let o=box(I,J,I+N,J+N,-DEPTH,0,null,'var(--dirt)','var(--dirt2)')+poly([P(I,J),P(I+N,J),P(I+N,J+N),P(I,J+N)],'var(--grass)');
  o+=`<polyline points="${pts([P(I,J+N),P(I+N,J+N),P(I+N,J)])}" fill="none" stroke="var(--lip)" stroke-width="3" stroke-linejoin="round"/>`;
  for(let b=0;b<s.k;b++)for(let a=0;a<s.k;a++)if((a+b)%2){const i=I+1+a*LOT,j=J+1+b*LOT;o+=poly([P(i,j),P(i+LOT,j),P(i+LOT,j+LOT),P(i,j+LOT)],'var(--grass2)')}
  const cells=[];for(let n=0;n<s.k*s.k;n++)cells.push(n);
  cells.sort((x,y)=>(x%s.k+Math.floor(x/s.k))-(y%s.k+Math.floor(y/s.k)));
  for(const n of cells){const i=I+1+(n%s.k)*LOT,j=J+1+Math.floor(n/s.k)*LOT,c=s.slots[n];o+=c?lot({c,i,j},c.alias===picked):deco(s.name+'#'+n,i,j)}
  return o;
}
function areaTag(s){
  const[x,y]=P(s.I+s.N,s.J+s.N,-DEPTH-16),t=s.name||L.other,w=t.length*8+22;
  return`<g class="fx" data-x="${f(x)}" data-y="${f(y)}" data-max="3" transform="translate(${f(x)} ${f(y)})"><rect x="${f(-w/2)}" y="-11" width="${f(w)}" height="21" rx="6" fill="var(--plank)" stroke="var(--dirt2)"/><text class="areatx" x="0" y="4.5" text-anchor="middle" fill="#fff" style="fill:#fff">${esc(t)}</text></g>`;
}

/* ---------- state + view ---------- */
let cards=null,world=null,picked=null,view={x:0,y:0,s:1},fitted=false,lastLoad=0,lastTry=0,loading=false,failed=false,sig='';
const el=id=>document.getElementById(id);
const reduce=globalThis.matchMedia?matchMedia('(prefers-reduced-motion: reduce)'):{matches:true};
function show(list){
  failed=false;lastLoad=lastTry=Date.now();
  const next=JSON.stringify(list);
  if(next===sig&&world){hud();return}
  sig=next;cards=list;
  if(picked&&!cards.some(c=>c.alias===picked))picked=null;
  const focus=document.activeElement?.closest?.('.house')?.dataset.alias;
  world=layout(cards);draw();
  if(focus)for(const g of document.querySelectorAll('.house'))if(g.dataset.alias===focus){g.focus({preventScroll:true});break}
  if(!fitted&&cards.length){fitted=true;opening()}
  status(cards.length?'':L.empty);
}
// Narrow views open on the island that needs attention first; wide views show the whole world.
function opening(){
  if(size().w>=560)return fit(false);
  const top=[...cards].sort((a,b)=>b.attention-a.attention)[0],h=world.homes.get(top.alias),s=h.island;
  move({...view,s:1},false);flyTo(s.I+s.N/2,s.J+s.N/2,1);
}
function draw(){
  if(!world)return;
  const order=[...world.islands].sort((a,b)=>(a.I+a.J)-(b.I+b.J));
  el('ground').innerHTML=world.bridges.map(bridge).join('')+order.map(s=>islandSvg(s,picked)).join('');
  el('labels').innerHTML=order.map(areaTag).join('')+[...world.homes.values()].sort((a,b)=>(a.i+a.j)-(b.i+b.j)).map(tagFor).join('');
  syncTags();
  el('map').classList.toggle('few',cards.length<=12);
  el('aliases').innerHTML=cards.map(c=>`<option value="${esc(c.alias)}">`).join('');
  hud();inspect();mini();fxScale=0;apply();walk(performance.now());
}
function hud(){
  const vis=cards||[],attn=vis.filter(c=>c.attention>0),busy=vis.reduce((n,c)=>n+c.total,0),old=vis.filter(c=>c.state==='stale'||c.state==='missing').length;
  el('stats').innerHTML=[[L.projects,vis.length,''],[L.attention,attn.length,attn.length?' hot':''],[L.workers,busy,''],[L.old,old,'']].map(([k,v,x])=>`<li class="stat${x}">${esc(k)}<b>${v}</b></li>`).join('');
  const nav=el('attn');nav.replaceChildren();
  const lbl=document.createElement('span');lbl.className='lbl';lbl.textContent=L.attention;nav.append(lbl);
  if(!attn.length){const q=document.createElement('span');q.className='quiet';q.textContent=L.none;nav.append(q)}
  for(const c of attn.sort((a,b)=>b.attention-a.attention||(a.alias<b.alias?-1:1))){
    const b=document.createElement('button');b.className='chip';b.textContent=c.alias;const n=document.createElement('b');n.textContent='!'+c.attention;b.append(n);
    b.onclick=()=>select(c.alias,true);nav.append(b);
  }
  age();
}
function age(){const a=el('age');a.textContent=failed?L.failShort+(lastLoad?' · '+L.updated+' '+ago(new Date(lastLoad).toISOString()):''):lastLoad?L.updated+' '+ago(new Date(lastLoad).toISOString()):'';a.style.color=failed?'var(--warn)':''}
function row(dl,k,v,cls){const t=document.createElement('dt');t.textContent=k;const d=document.createElement('dd');if(v instanceof Node)d.append(v);else d.textContent=v;if(cls)d.className=cls;dl.append(t,d)}
function svgEl(w,h,vb,inner){const s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',w);s.setAttribute('height',h);s.setAttribute('viewBox',vb);s.setAttribute('aria-hidden','true');s.innerHTML=inner;return s}
function inspect(){
  const box=el('insp');box.replaceChildren();
  const c=cards&&picked?cards.find(x=>x.alias===picked):null;
  if(!c){
    const h=document.createElement('h2');h.textContent=L.islands;box.append(h);
    const p=document.createElement('p');p.className='note';p.textContent=L.pick;box.append(p);
    const ul=document.createElement('ul');ul.className='areas';
    for(const s of world?world.islands:[]){const li=document.createElement('li'),b=document.createElement('button');const a=document.createElement('span');a.textContent=s.name||L.other;const n=document.createElement('span');n.className='quiet';n.textContent=String(s.list.length);b.append(a,n);b.onclick=()=>flyTo(s.I+s.N/2,s.J+s.N/2,Math.max(view.s,.9));li.append(b);ul.append(li)}
    box.append(ul);return;
  }
  const who=document.createElement('div');who.className='who';
  if(c.state!=='withheld'&&c.state!=='unavailable'){const pt=svgEl(72,84,'-12.5 -33.5 25 34.5',chibi(c));pt.classList.add('portrait');who.append(pt)}
  const head=document.createElement('div'),h=document.createElement('h2');h.textContent=c.alias;head.append(h);
  const bd=document.createElement('div');bd.className='badges';
  const badge=(t,x)=>{const s=document.createElement('span');s.className='badge '+x;s.textContent=t;bd.append(s)};
  badge(L.st[c.state],c.state==='fresh'?'fresh':c.state==='withheld'?'':'warn');
  if(c.degraded)badge('⚠ '+L.degraded,'warn');
  if(c.attention)badge(L.attention+' '+c.attention,'attn');
  head.append(bd);who.append(head);box.append(who);
  const note=document.createElement('p');note.className='note';note.textContent=c.state==='withheld'?L.withheld:L.readOnly;box.append(note);

  const dl=document.createElement('dl');

/* helpers walk a loop in the yard; they line up along its edge, name tags beside them, when their house is picked or motion is reduced */
