<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMS · 프로젝트 제어</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f8f9f6; --surface: #fff; --ink: #1b2922; --muted: #59675e;
  --line: #d9ded7; --tint: #f0f4ed; --brand: #216341; --on-brand: #fff;
  --main-line: #86ad90; --warm: #865519; --warm-bg: #faf4e8; --error: #a13029;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151b18; --surface: #1d2520; --ink: #eff4ed; --muted: #b0bdb1;
    --line: #3c4940; --tint: #243529; --brand: #a1d7a8; --on-brand: #14291b;
    --main-line: #648a6c; --warm: #e6c286; --warm-bg: #352e22; --error: #ffa39b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--bg); font: 15px/1.52 Inter, system-ui, sans-serif; overflow-wrap: anywhere; }
main { max-width: 48rem; margin: auto; padding: clamp(.85rem, 4vw, 2rem); }
h1, h2, h3, p, ul, dl, dd, fieldset, legend { margin: 0; padding: 0; }
h1 { font-size: 1.45rem; letter-spacing: -.045em; }
h2, legend { font-size: 1rem; font-weight: 700; }
h3 { font-size: .9rem; }
button, input, select { font: inherit; }
#scope { margin-top: .85rem; }
select { max-width: 100%; padding: .4rem .65rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; }
button { border: 1px solid var(--line); border-radius: .65rem; background: var(--surface); color: var(--ink); min-height: 2.6rem; padding: .4rem .8rem; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--brand); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
header, .cluster, .between, .entry { display: flex; align-items: center; gap: .6rem; }
header, .between { justify-content: space-between; }
.cluster, .between, .entry { flex-wrap: wrap; }
header { padding-bottom: .95rem; border-bottom: 1px solid var(--line); }
.brand { width: 2rem; height: 2rem; display: grid; place-items: center; background: var(--ink); color: var(--surface); border-radius: .65rem; font-weight: 800; font-family: monospace; }
#status, #receipt { font-size: .88rem; }
#status:not(:empty), #receipt:not(:empty) { margin-top: .85rem; }
.error { color: var(--error); }
#receipt { white-space: pre-wrap; }
#project { margin-top: 1.1rem; font-size: 1.35rem; letter-spacing: -.035em; }
#branch, time, .muted, dt { color: var(--muted); font-size: .83rem; }
.card, .lead { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: .85rem; padding: 1rem; }
.card { margin-top: 1rem; }
.main-card { border-color: var(--main-line); background: var(--tint); }
fieldset { border: 0; min-width: 0; }
.choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .25rem; margin: .65rem 0 .85rem; }
.choice { position: relative; text-align: center; }
.choice input { position: absolute; width: 100%; height: 100%; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.choice span { display: block; border: 1px solid var(--line); border-radius: .55rem; background: var(--surface); padding: .5rem .15rem; font-weight: 600; }
.choice input:checked + span { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.choice input:focus-visible + span { outline: 3px solid var(--brand); outline-offset: 2px; }
.choice input:disabled + span { opacity: .6; }
#brief { display: block; width: 100%; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: .55rem; min-height: 2.9rem; padding: .6rem .7rem; margin: .35rem 0 .65rem; }
.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); font-weight: 650; }
.leads-region { padding-top: 1.1rem; position: relative; }
.leads-region::before { content: ''; position: absolute; left: 50%; top: 0; height: 1.1rem; border-left: 1px solid var(--main-line); }
.leads { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%, 9rem),1fr)); gap: .45rem; }
.lead { padding: .65rem .75rem; }
.lead h3 { margin-bottom: .16rem; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%, 7rem),1fr)); gap: .6rem; margin: .75rem 0; }
.metrics div { padding-left: .6rem; border-left: 2px solid var(--line); }
dd { font-weight: 650; font-variant-numeric: tabular-nums; }
ul { list-style: none; }
.entry { justify-content: space-between; padding: .45rem 0; border-top: 1px solid var(--line); }
.approval { padding: .8rem 0; }
.approval + .approval { border-top: 1px solid var(--line); }
.approval summary { cursor: pointer; white-space: pre-wrap; }
.approval p { white-space: pre-wrap; margin: .3rem 0; }
.approval code { font-size: .8rem; }
.review { color: var(--warm); background: var(--warm-bg); }
[hidden] { display: none !important; }
footer { margin: .65rem .05rem 0; }
</style>
</head>
<body>
<main>
  <header>
    <div class="cluster"><span class="brand" aria-hidden="true">M</span><h1>OMS</h1></div>
    <button id="refresh" type="button" disabled>새로고침</button>
  </header>
  <div id="scope" class="cluster" hidden>
    <label for="project-choice">프로젝트</label><select id="project-choice"></select>
  </div>
  <p id="status" role="status">OMS 연결 중…</p>
  <p id="receipt" role="status"></p>
  <div id="view" hidden>
    <h2 id="project"></h2><p id="branch"></p>
    <form class="card main-card" id="launch">
      <fieldset id="controls"><legend>Overall Main</legend>
        <p class="muted" id="current-main"></p>
        <div class="choices">
          <label class="choice"><input type="radio" name="main" value="codex" checked><span>Codex</span></label>
          <label class="choice"><input type="radio" name="main" value="claude"><span>Claude</span></label>
          <label class="choice"><input type="radio" name="main" value="agy"><span>AGY</span></label>
          <label class="choice"><input type="radio" name="main" value="pi"><span>Pi</span></label>
        </div>
        <label for="brief">새 작업 목표</label>
        <input id="brief" type="text" required placeholder="Main이 Lead들과 수행할 목표를 입력하세요.">
        <button class="primary" id="start" type="submit">목표 전달</button>
      </fieldset>
    </form>
    <section class="leads-region" aria-label="공급자별 작업 현황"><div id="leads" class="leads"></div></section>
    <section class="card" aria-labelledby="progress">
      <h2 id="progress">진행 상황</h2>
      <dl class="metrics">
        <div><dt>진행 중 시도</dt><dd id="active"></dd></div>
        <div><dt>계획된 작업</dt><dd id="tasks"></dd></div>
        <div><dt>현재 상태</dt><dd id="taskStatus"></dd></div>
      </dl>
      <h3>기록된 목표</h3><p id="goal"></p>
      <ul id="activity" aria-label="최근 작업"></ul>
      <ul id="attention" aria-label="확인이 필요한 항목"></ul>
    </section>
    <section class="card" aria-labelledby="approvals-heading">
      <h2 id="approvals-heading">승인 대기</h2><div id="approvals"></div>
    </section>
    <footer><time id="updated"></time></footer>
  </div>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const names = {codex:'Codex', claude:'Claude', agy:'AGY', antigravity:'AGY', pi:'Pi'};
const pending = new Map();
let sequence = 0;
let hostOrigin = '*';
let ready = false;
let busy = false;
let project = '';
let openingProject = '';
let retryStart;
let refreshAfterInput = false;
let contextTypes;
let contextKey;
let contextQueue = Promise.resolve();

function updateContext(data) {
  if (!contextTypes) return;
  const key = JSON.stringify(data);
  if (key === contextKey) return;
  contextKey = key;
  contextQueue = contextQueue.then(async () => {
    if (key !== contextKey) return;
    const params = !data ? {content:[]} : contextTypes.structuredContent ? {structuredContent:data}
      : {content:[{type:'text', text:key}]};
    try { await request('ui/update-model-context', params, 5000); }
    catch { if (contextKey === key) contextKey = undefined; }
  });
}

function send(message) {
  window.parent.postMessage({jsonrpc:'2.0', ...message}, hostOrigin);
}

function request(method, params, timeout = 90000) {
  const id = ++sequence;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error('응답 시간이 초과되었습니다. 새로고침으로 처리 결과를 확인하세요.'));
    }, timeout);
    pending.set(id, {resolve, reject, timer});
    send({id, method, params});
  });
}

window.addEventListener('message', event => {
  const msg = event.data;
  if (event.source !== window.parent || (hostOrigin !== '*' && event.origin !== hostOrigin) ||
      !msg || msg.jsonrpc !== '2.0') return;
  if (msg.method === 'ui/notifications/tool-input') {
    const requested = msg.params?.arguments?.project;
    if (typeof requested === 'string' && requested && !project && !openingProject) {
      openingProject = requested;
      if (busy) refreshAfterInput = true;
      else if (ready) refresh();
    }
    return;
  }
  if (!pending.has(msg.id)) return;
  if (event.origin && event.origin !== 'null') hostOrigin = event.origin;
  const call = pending.get(msg.id);
  clearTimeout(call.timer);
  pending.delete(msg.id);
  if (msg.error) call.reject(new Error(msg.error.message || '앱이 요청을 처리하지 못했습니다.'));
  else call.resolve(msg.result);
});

async function tool(name, args = {}) {
  const scoped = project && name !== 'oms_list_projects' ? {...args, project} : args;
  const result = await request('tools/call', {name, arguments: scoped});
  if (!result || result.isError) throw new Error(result?.content?.[0]?.text || 'OMS 도구 호출에 실패했습니다.');
  return result;
}

function node(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  return element;
}

function render(d) {
  el('project').textContent = d.project || 'OMS 프로젝트';
  el('branch').textContent = d.branch || '';
  el('goal').textContent = d.goal || '기록된 목표 없음';
  for (const key of ['active','tasks','taskStatus']) el(key).textContent = d[key] ?? '정보 없음';
  const list = el('attention');
  list.replaceChildren();
  for (const item of d.attention || []) {
    const li = node('li', '', 'entry');
    li.append(node('span', item.summary), node('strong', item.count ?? ''));
    list.append(li);
  }
  const date = new Date(d.updated);
  el('updated').textContent = d.updated && Number.isFinite(date.getTime()) ? '최근 조회 ' + date.toLocaleString() : '';
  el('status').textContent = d.degraded ? '일부 상태를 수집하지 못했습니다.' : '';
  el('view').hidden = false;
}

function clearProject() {
  el('view').hidden = true;
  updateContext(null);
  el('launch').reset();
  el('brief').setCustomValidity('');
  el('receipt').textContent = '';
  el('approvals').replaceChildren();
}

function chooseProject(aliases) {
  const select = el('project-choice');
  select.replaceChildren();
  el('scope').hidden = !aliases.length;
  if (project && !aliases.includes(project)) {
    project = '';
    clearProject();
  }
  if (openingProject) {
    if (aliases.includes(openingProject)) {
      project = openingProject;
      openingProject = '';
    } else {
      select.add(new Option('프로젝트 선택', ''));
      for (const alias of aliases) select.add(new Option(alias, alias));
      el('view').hidden = true;
      el('status').textContent = '대화에서 지정한 프로젝트에 연결할 수 없습니다.';
      return false;
    }
  }
  if (!aliases.length) return true;
  if (aliases.length === 1) project = aliases[0];
  if (aliases.length > 1) select.add(new Option('프로젝트 선택', ''));
  for (const alias of aliases) select.add(new Option(alias, alias));
  select.value = project;
  if (project) return true;
  el('view').hidden = true;
  el('status').textContent = 'OMS를 사용할 프로젝트를 선택하세요.';
  return false;
}

function renderActivity(d) {
  el('current-main').textContent = d.main?.provider
    ? '현재 Main · ' + (names[d.main.provider] || d.main.provider) + ' · ' + (d.main.state || '상태 미확인')
    : '현재 Main 확인 안 됨';
  const attempts = d.attempts || [];
  const providers = new Set(['codex', 'claude', 'agy']);
  for (const attempt of attempts) if (attempt.provider === 'pi') providers.add('pi');
  const cards = el('leads');
  cards.replaceChildren();
  for (const provider of providers) {
    const observed = attempts.filter(attempt => names[attempt.provider] === names[provider] && attempt.role !== 'main');
    const card = node('article', '', 'lead');
    const lead = observed.find(attempt => attempt.role === 'lead' || attempt.tool === 'panel-native-assignment');
    card.append(node('h3', names[provider] + (lead ? ' Lead' : '')), node('p',
      lead ? (lead.state || '상태 미확인') : observed.length ? '최근 시도 ' + observed.length + '건' : '최근 기록 없음', 'muted'));
    cards.append(card);
  }
  const activity = el('activity');
  activity.replaceChildren();
  for (const attempt of attempts) {
    const item = node('li', '', 'entry');
    const label = [names[attempt.provider] || attempt.provider, attempt.tool, attempt.task].filter(Boolean);
    item.append(node('span', label.join(' · ')), node('strong', attempt.state || '상태 미확인'));
    activity.append(item);
  }
}

function renderApprovals(rows, incomplete) {
  const list = el('approvals');
  list.replaceChildren();
  if (incomplete) list.append(node('p', '승인 목록을 일부만 조회했습니다.', 'muted'));
  else if (!rows.length) list.append(node('p', '대기 중인 승인 없음', 'muted'));
  for (const row of rows) {
    const details = document.createElement('details');
    details.className = 'approval';
    const summary = node('summary', row.summary || row.action);
    const body = node('div', '');
    body.append(node('p', row.action === 'Main scope decision' ? '결정 범위 · Main이 요청한 다음 작업' : '작업 · ' + row.action));
    body.append(node('p', '대상 · ' + row.object));
    if (row.sender) body.append(node('p', '요청자 · ' + row.sender));
    body.append(node('code', row.id + ' · v' + row.version + ' · ' + row.digest));
    const buttons = node('div', '', 'cluster');
    for (const decision of ['approve', 'deny']) {
      const button = node('button', decision === 'approve' ? '이 요청 승인' : '이 요청 거절', decision === 'approve' ? 'review' : '');
      button.type = 'button';
      button.addEventListener('click', () => mutate(
        () => tool('oms_decide_approval', {id:row.id, version:row.version, digest:row.digest, decision}),
        result => {
          if (result?.id !== row.id || result.decision !== decision || result.digest !== row.digest) {
            throw new Error('결정 응답이 요청과 다릅니다. 승인 목록을 확인하세요.');
          }
          el('receipt').textContent = (decision === 'approve' ? '승인' : '거절') + ' 처리됨 · ' + result.id;
          updateContext({project:project || null, room:row.object, status:result.decision});
        }
      ));
      buttons.append(button);
    }
    body.append(buttons);
    details.append(summary, body);
    list.append(details);
  }
}

function setBusy(value) {
  busy = value;
  el('refresh').disabled = value;
  el('project-choice').disabled = value;
  el('controls').disabled = value;
  for (const button of el('approvals').querySelectorAll('button')) button.disabled = value;
  if (!busy && refreshAfterInput) {
    refreshAfterInput = false;
    refresh();
  }
}

async function loadStatus() {
  el('status').className = '';
  el('status').textContent = '프로젝트 상태를 확인하는 중…';
  try {
    if (!ready) {
      if (window.parent === window) throw new Error('앱 대화에서 OMS 패널을 여세요.');
      const info = await request('ui/initialize', {appInfo:{name:'oms-panel', version:'0.1.0'}, appCapabilities:{}, protocolVersion:'2026-01-26'});
      const formats = info?.hostCapabilities?.updateModelContext;
      if (formats?.text || formats?.structuredContent) contextTypes = formats;
      send({method:'ui/notifications/initialized', params:{}});
      ready = true;
    }
    const registry = await tool('oms_list_projects');
    const aliases = registry.structuredContent?.projects;
    if (!Array.isArray(aliases)) throw new Error('프로젝트 목록 응답을 읽을 수 없습니다.');
    if (!chooseProject(aliases)) return;
    if (project && (contextKey == null || contextKey === 'null')) updateContext({project});
    const result = await tool('oms_panel_snapshot');
    const dashboard = result.structuredContent?.dashboard || result._meta?.dashboard;
    if (!dashboard) throw new Error('프로젝트 상태 응답을 읽을 수 없습니다.');
    render(dashboard);
    renderActivity(dashboard);
    try {
      const response = await tool('oms_list_approvals');
      const approvals = response.structuredContent?.approvals;
      if (!Array.isArray(approvals)) throw new Error('승인 목록 응답을 읽을 수 없습니다.');
      renderApprovals(approvals, response.structuredContent.incomplete);
    } catch (error) {
      el('approvals').replaceChildren(node('p', error.message, 'error'));
    }
  } catch (error) {
    el('view').hidden = true;
    el('status').className = 'error';
    el('status').textContent = error.message;
  }
}

async function refresh() {
  if (busy) return;
  setBusy(true);
  try { await loadStatus(); } finally { setBusy(false); }
}

async function mutate(action, onSuccess) {
  if (busy) return;
  setBusy(true);
  el('receipt').className = '';
  el('receipt').textContent = '요청을 처리하는 중…';
  try {
    const response = await action();
    onSuccess(response.structuredContent);
  } catch (error) {
    el('receipt').className = 'error';
    el('receipt').textContent = error.message;
  } finally {
    try { await loadStatus(); } finally { setBusy(false); }
  }
}

el('launch').addEventListener('submit', event => {
  event.preventDefault();
  const goal = el('brief').value.trim();
  if (!goal || Array.from(goal).length > 2000 || /[\x00-\x1f\x7f]/u.test(goal)) {
    el('brief').setCustomValidity('목표를 한 줄로 1~2,000자 입력하세요.');
    el('brief').reportValidity();
    return;
  }
  const main = el('launch').elements.main.value;
  if (!retryStart || retryStart.project !== project || retryStart.main !== main || retryStart.goal !== goal) {
    retryStart = {project, main, goal, requestId:crypto.randomUUID()};
  }
  const requestId = retryStart.requestId;
  mutate(
    () => tool('oms_start_main', {main, goal, requestId}),
    result => {
      if (result?.room !== 'oms-app-' + requestId || result.provider !== main || result.status !== 'started') {
        throw new Error('시작 응답을 확인할 수 없습니다. 진행 상황을 새로고침하세요.');
      }
      retryStart = undefined;
      el('brief').value = '';
      el('receipt').textContent = names[main] + ' Main 시작됨 · ' + result.room;
      updateContext({project:project || null, room:result.room, status:result.status});
    }
  );
});
el('brief').addEventListener('input', () => el('brief').setCustomValidity(''));
el('project-choice').addEventListener('change', () => {
  if (busy) return;
  clearProject();
  openingProject = '';
  project = el('project-choice').value;
  refresh();
});
el('refresh').addEventListener('click', refresh);
refresh();
</script>
</body>
</html>
