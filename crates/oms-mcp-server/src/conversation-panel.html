<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OMS · 프로젝트 제어</title>
<style>
:root {
  color-scheme: light dark;
  --bg: #f8f9f6; --surface: #fff; --ink: #1b2922; --muted: #59675e;
  --line: #d9ded7; --tint: #f0f4ed; --brand: #216341; --on-brand: #fff;
  --main-line: #86ad90; --warm: #865519; --warm-bg: #faf4e8; --error: #a13029;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #151b18; --surface: #1d2520; --ink: #eff4ed; --muted: #b0bdb1;
    --line: #3c4940; --tint: #243529; --brand: #a1d7a8; --on-brand: #14291b;
    --main-line: #648a6c; --warm: #e6c286; --warm-bg: #352e22; --error: #ffa39b;
  }
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); background: var(--bg); font: 15px/1.52 Inter, system-ui, sans-serif; overflow-wrap: anywhere; }
main { max-width: 68rem; margin: auto; padding: clamp(.85rem, 4vw, 2rem); }
h1, h2, h3, p, ul, dl, dd, fieldset, legend { margin: 0; padding: 0; }
h1 { font-size: 1.45rem; letter-spacing: -.045em; }
h2, legend { font-size: 1rem; font-weight: 700; }
h3 { font-size: .9rem; }
button, input, select { font: inherit; }
#scope { margin-top: .85rem; }
select { max-width: 100%; padding: .4rem .65rem; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: .6rem; }
button { border: 1px solid var(--line); border-radius: .65rem; background: var(--surface); color: var(--ink); min-height: 2.6rem; padding: .4rem .8rem; cursor: pointer; }
button:hover:not(:disabled) { border-color: var(--brand); }
button:disabled { opacity: .55; cursor: default; }
:focus-visible { outline: 3px solid var(--brand); outline-offset: 3px; }
header, .cluster, .between, .entry { display: flex; align-items: center; gap: .6rem; }
header, .between { justify-content: space-between; }
.cluster, .between, .entry { flex-wrap: wrap; }
header { padding-bottom: .95rem; border-bottom: 1px solid var(--line); }
.brand { width: 2rem; height: 2rem; display: grid; place-items: center; background: var(--ink); color: var(--surface); border-radius: .65rem; font-weight: 800; font-family: monospace; }
#status, #receipt { font-size: .88rem; }
#status:not(:empty), #receipt:not(:empty) { margin-top: .85rem; }
.error { color: var(--error); }
#receipt { white-space: pre-wrap; }
#project { font-size: 1.07rem; letter-spacing: -.025em; }
.project-line { margin-top: .9rem; }
.project-line time { margin-left: auto; }
#branch, time, .muted, dt { color: var(--muted); font-size: .83rem; }
.card, .lead { min-width: 0; background: var(--surface); border: 1px solid var(--line); border-radius: .85rem; padding: 1rem; }
.card { margin-top: 1rem; }
.main-card { border-color: var(--main-line); background: var(--tint); }
#current-main { font-size: clamp(1.4rem, 3vw, 1.8rem); line-height: 1.3; margin: .22rem 0 .4rem; }
.identity { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: .18rem .8rem; margin-top: .75rem; }
.identity dt { align-self: baseline; }
.identity dd { font-size: .88rem; }
.columns { display: grid; grid-template-columns: minmax(0,1fr); }
@media (min-width: 50rem) { .columns { grid-template-columns: minmax(0,.9fr) minmax(0,1.1fr); gap: 1rem; align-items: start; } }
details > summary { cursor: pointer; font-weight: 650; }
#launch { margin-top: .8rem; }
fieldset { border: 0; min-width: 0; }
.choices { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: .25rem; margin: .65rem 0 .85rem; }
.choice { position: relative; text-align: center; }
.choice input { position: absolute; width: 100%; height: 100%; inset: 0; margin: 0; opacity: 0; cursor: pointer; }
.choice span { display: block; border: 1px solid var(--line); border-radius: .55rem; background: var(--surface); padding: .5rem .15rem; font-weight: 600; }
.choice input:checked + span { background: var(--brand); color: var(--on-brand); border-color: var(--brand); }
.choice input:focus-visible + span { outline: 3px solid var(--brand); outline-offset: 2px; }
.choice input:disabled + span { opacity: .6; }
#brief { display: block; width: 100%; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: .55rem; min-height: 2.9rem; padding: .6rem .7rem; margin: .35rem 0 .65rem; }
.primary { background: var(--brand); color: var(--on-brand); border-color: var(--brand); font-weight: 650; }
.leads-region { margin-top: .95rem; padding-top: .75rem; border-top: 1px solid var(--main-line); }
.leads { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%, 9rem),1fr)); gap: .45rem; }
.lead { padding: .65rem .75rem; }
.leads-region > h3 { margin-bottom: .45rem; }
.lead h4 { margin: 0 0 .16rem; }
.lead p + p { margin-top: .3rem; }
.evidence, .history { margin-top: .8rem; }
.history summary { cursor: pointer; font-weight: 650; }
.metrics { display: grid; grid-template-columns: repeat(auto-fit,minmax(min(100%, 7rem),1fr)); gap: .6rem; margin: .75rem 0; }
.metrics div { padding-left: .6rem; border-left: 2px solid var(--line); }
dd { font-weight: 650; font-variant-numeric: tabular-nums; }
ul { list-style: none; }
.entry { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: start; padding: .45rem 0; border-top: 1px solid var(--line); }
.entry > strong { font-size: .83rem; }
.entry small { display: block; color: var(--muted); }
@media (max-width: 28rem) {
  .leads { grid-template-columns: 1fr; }
  .lead { padding: .5rem .65rem; }
  .entry { grid-template-columns: minmax(0,1fr); gap: .15rem; }
}
.approval { padding: .8rem 0; }
.approval + .approval { border-top: 1px solid var(--line); }
.approval summary { cursor: pointer; white-space: pre-wrap; }
.approval p { white-space: pre-wrap; margin: .3rem 0; }
.approval code { font-size: .8rem; }
.review { color: var(--warm); background: var(--warm-bg); }
[hidden] { display: none !important; }
</style>
</head>
<body>
<main>
  <header>
    <div class="cluster"><span class="brand" aria-hidden="true">M</span><h1>OMS</h1></div>
    <button id="refresh" type="button" disabled>새로고침</button>
  </header>
  <div id="scope" class="cluster" hidden>
    <label for="project-choice">프로젝트</label><select id="project-choice"></select>
  </div>
  <p id="status" role="status">OMS 연결 중…</p>
  <p id="receipt" role="status"></p>
  <div id="view" hidden>
    <div class="cluster project-line"><h2 id="project"></h2><p id="branch"></p><time id="updated"></time></div>
    <section class="card main-card" aria-labelledby="current-main">
      <p class="muted">현재 대화의 Overall Main</p><h2 id="current-main"></h2><p id="main-state"></p>
      <dl class="identity" id="identity">
        <dt>작업방</dt><dd id="room"></dd><dt>참여자</dt><dd id="participant"></dd>
      </dl>
      <section class="leads-region" id="room-leads" aria-labelledby="leads-heading">
        <h3 id="leads-heading">이 작업방의 Lead</h3><div id="leads" class="leads"></div>
      </section>
    </section>
    <details id="launcher" class="card"><summary>별도 Main에 새 목표 전달</summary>
    <form id="launch">
      <fieldset id="controls"><legend>새 Main 선택</legend>
        <div class="choices">
          <label class="choice"><input type="radio" name="main" value="codex" checked><span>Codex</span></label>
          <label class="choice"><input type="radio" name="main" value="claude"><span>Claude</span></label>
          <label class="choice"><input type="radio" name="main" value="agy"><span>AGY</span></label>
          <label class="choice"><input type="radio" name="main" value="pi"><span>Pi</span></label>
        </div>
        <label for="brief">새 작업 목표</label>
        <input id="brief" type="text" required placeholder="Main이 Lead들과 수행할 목표를 입력하세요.">
        <button class="primary" id="start" type="submit">목표 전달</button>
      </fieldset>
    </form></details>
    <div class="columns">
    <section class="card" aria-labelledby="approvals-heading">
      <h2 id="approvals-heading">프로젝트 승인 대기</h2><p id="approval-progress" role="status" class="muted"></p><div id="approvals"></div>
    </section>
    <section class="card" aria-labelledby="progress">
      <h2 id="progress">프로젝트 전체 기록</h2>
      <dl class="metrics">
        <div><dt>종료 기록 없는 시도</dt><dd id="active"></dd></div>
        <div><dt>계획된 작업</dt><dd id="tasks"></dd></div>
        <div><dt>현재 상태</dt><dd id="taskStatus"></dd></div>
      </dl>
      <h3>기록된 목표</h3><p id="goal"></p>
      <div class="evidence">
        <h3>검증 현황</h3><p id="criteria"></p><p id="reviews" class="muted"></p>
      </div>
      <details class="history"><summary>프로젝트 Main·Lead 기록</summary><ul id="repo-team"></ul></details>
      <details class="history"><summary>최근 보관된 결과물</summary><ul id="operations"></ul></details>
      <details class="history"><summary>최근 실행 기록</summary><ul id="activity"></ul></details>
      <details class="history" id="alerts"><summary>확인이 필요한 항목</summary><ul id="attention"></ul></details>
    </section>
    </div>
  </div>
</main>
<script>
'use strict';
const el = id => document.getElementById(id);
const names = {codex:'Codex', claude:'Claude', agy:'AGY', antigravity:'AGY', pi:'Pi'};
const pending = new Map();
let sequence = 0;
let hostOrigin = '*';
let initializing;
let busy = false;
let disposed = false;
let project = '';
let requestedProject = null;
let generation = 0;
const invalidProject = Symbol('invalid project');
// A tool result may arrive after a newer open or a manual project selection.
let openSeq = 0;
let seenInputOrManual = false;
const pendingOpens = [];
const pendingErrors = [];
let retryStart;
let contextTypes;
let contextKey;
let contextQueue = Promise.resolve();

function updateContext(data) {
  if (!contextTypes) return;
  const key = JSON.stringify(data);
  if (key === contextKey) return;
  contextKey = key;
  contextQueue = contextQueue.then(async () => {
    if (key !== contextKey) return;
    const params = !data ? {content:[]} : contextTypes.structuredContent ? {structuredContent:data}
      : {content:[{type:'text', text:key}]};
    try { await request('ui/update-model-context', params, 5000); }
    catch { if (contextKey === key) contextKey = undefined; }
  });
}

function send(message, origin = hostOrigin) {
  window.parent.postMessage({jsonrpc:'2.0', ...message}, origin);
}

function request(method, params, timeout = 90000) {
  if (disposed) return Promise.reject(new Error('패널이 닫혔습니다.'));
  const id = ++sequence;
  return new Promise((resolve, reject) => {
    const timer = setTimeout(() => {
      pending.delete(id);
      reject(new Error('응답 시간이 초과되었습니다. 새로고침으로 처리 결과를 확인하세요.'));
    }, timeout);
    pending.set(id, {resolve, reject, timer});
    send({id, method, params});
  });
}

function reconcileOpens() {
  for (let i = 0; i < pendingErrors.length; ) {
    const eligible = pendingOpens.filter(open => open.id <= pendingErrors[i]).length;
    if (eligible < i + 1) {
      pendingErrors.splice(i, 1);
    } else if (eligible === i + 1) {
      pendingOpens.splice(0, eligible);
      pendingErrors.splice(0, i + 1);
      i = 0;
    } else {
      i++;
    }
  }
}

window.addEventListener('message', event => {
  const msg = event.data;
  if (event.source !== window.parent || (hostOrigin !== '*' && event.origin !== hostOrigin) ||
      !msg || typeof msg !== 'object' || msg.jsonrpc !== '2.0') return;
  // The host and panel allocate request IDs independently.
  if (typeof msg.method === 'string' && (typeof msg.id === 'string' || typeof msg.id === 'number')) {
    const origin = event.origin && event.origin !== 'null' ? event.origin : '*';
    if (msg.method === 'ui/resource-teardown' && !disposed) {
      disposed = true;
      generation++;
      setBusy(true, true);
      el('view').hidden = true;
      el('status').textContent = '패널이 닫혔습니다.';
      for (const call of pending.values()) {
        clearTimeout(call.timer);
        call.reject(new Error('패널이 닫혔습니다.'));
      }
      pending.clear();
    }
    const reply = msg.method === 'ping' || msg.method === 'ui/resource-teardown'
      ? {result:{}} : {error:{code:-32601, message:'Method not found'}};
    send({id:msg.id, ...reply}, origin);
    return;
  }
  if (disposed) return;
  if (msg.method === 'ui/notifications/tool-input') {
    const target = projectArgument(msg.params?.arguments?.project);
    seenInputOrManual = true;
    pendingOpens.push({id:++openSeq, target});
    switchProject(target);
    return;
  }
  if (msg.method === 'ui/notifications/tool-result') {
    if (msg.params?.isError) {
      if (pendingOpens.length > pendingErrors.length) {
        pendingErrors.push(openSeq);
        reconcileOpens();
      }
      if (!seenInputOrManual) switchProject(invalidProject);
      return;
    }
    const result = msg.params?.structuredContent;
    if (result?.panel === 'OMS') {
      const target = projectArgument(result.project);
      let index = -1;
      for (let i = pendingOpens.length - 1; i >= 0; i--) {
        if (pendingOpens[i].target === target) { index = i; break; }
      }
      if (index >= 0) {
        pendingOpens.splice(index, 1);
        reconcileOpens();
      } else {
        switchProject(target);
      }
    }
    return;
  }
  if ('method' in msg || ('result' in msg) === ('error' in msg) || !pending.has(msg.id)) return;
  if (event.origin && event.origin !== 'null') hostOrigin = event.origin;
  const call = pending.get(msg.id);
  clearTimeout(call.timer);
  pending.delete(msg.id);
  if (msg.error) call.reject(new Error(msg.error.message || '앱이 요청을 처리하지 못했습니다.'));
  else call.resolve(msg.result);
});

async function tool(name, args = {}, expected = generation) {
  if (expected !== generation) throw new Error('프로젝트가 변경되었습니다.');
  const scoped = project && name !== 'oms_list_projects' ? {...args, project} : args;
  const result = await request('tools/call', {name, arguments: scoped});
  if (expected !== generation) throw new Error('프로젝트가 변경되었습니다.');
  if (!result || result.isError) throw new Error(result?.content?.[0]?.text || 'OMS 도구 호출에 실패했습니다.');
  return result;
}

function node(tag, text, className) {
  const element = document.createElement(tag);
  element.textContent = text;
  if (className) element.className = className;
  return element;
}

function render(d) {
  el('project').textContent = d.project || 'OMS 프로젝트';
  el('branch').textContent = d.branch || '';
  el('goal').textContent = d.goal || '기록된 목표 없음';
  for (const key of ['active','tasks','taskStatus']) el(key).textContent = d[key] ?? '정보 없음';
  const list = el('attention');
  list.replaceChildren();
  for (const item of d.attention || []) {
    const li = node('li', '', 'entry');
    li.append(node('span', item.summary), node('strong', item.count ?? ''));
    list.append(li);
  }
  el('alerts').hidden = !d.attention?.length;
  const date = new Date(d.updated);
  el('updated').textContent = d.updated && Number.isFinite(date.getTime()) ? '최근 조회 ' + date.toLocaleString() : '';
  el('status').textContent = d.degraded ? '일부 상태를 수집하지 못했습니다.' : '';
  el('view').hidden = false;
}

function clearProject() {
  el('view').hidden = true;
  updateContext(null);
  retryStart = undefined;
  el('launch').reset();
  el('launcher').open = false;
  el('brief').setCustomValidity('');
  el('receipt').className = '';
  for (const id of ['receipt','project','branch','room','participant','main-state','goal','current-main','active','tasks','taskStatus','updated','approval-progress','approvals','leads','repo-team','criteria','reviews','operations','activity','attention']) {
    el(id).replaceChildren();
  }
}

function projectArgument(value) {
  if (value == null) return null;
  return typeof value === 'string' && value.length ? value : invalidProject;
}

function switchProject(target) {
  if (target === requestedProject) return;
  if (target && target === project) {
    requestedProject = target;
    return;
  }
  generation++;
  requestedProject = target;
  project = '';
  clearProject();
  el('scope').hidden = true;
  el('project-choice').replaceChildren();
  setBusy(false);
  refresh();
}

function chooseProject(aliases) {
  const select = el('project-choice');
  select.replaceChildren();
  el('scope').hidden = !aliases.length;
  const target = requestedProject;
  if (target !== null && !aliases.includes(target)) {
    project = '';
    clearProject();
    select.add(new Option('프로젝트 선택', ''));
    for (const alias of aliases) select.add(new Option(alias, alias));
    el('status').textContent = '대화에서 지정한 프로젝트에 연결할 수 없습니다.';
    return false;
  }
  const selected = target || (aliases.length === 1 ? aliases[0] : '');
  if (selected !== project) clearProject();
  project = selected;
  if (aliases.length > 1) select.add(new Option('프로젝트 선택', ''));
  for (const alias of aliases) select.add(new Option(alias, alias));
  select.value = project;
  if (project || !aliases.length) return true;
  clearProject();
  el('status').textContent = 'OMS를 사용할 프로젝트를 선택하세요.';
  return false;
}

function isLead(attempt) {
  return attempt.role === 'lead' || (!attempt.role && attempt.tool === 'panel-native-assignment');
}

function isMain(attempt) {
  return attempt.role === 'main' || attempt.tool === 'panel-main';
}

function renderConversation(d) {
  const main = d.conversationMain;
  const joined = main?.source === 'room-session' && main.state === 'joined' && main.room && main.participant && names[main.provider];
  el('current-main').textContent = joined ? names[main.provider] + ' Main' : 'Main 미확인';
  el('main-state').textContent = joined
    ? '작업방 소유자로 참여 중' + (main.incomplete ? ' · 작업방 목록 일부 조회' : '')
    : '이 대화와 연결된 작업방 소유자를 확인할 수 없습니다.';
  el('room').textContent = joined ? main.room : '미확인';
  el('participant').textContent = joined ? main.participant : '미확인';
  el('identity').hidden = !joined;
  el('room-leads').hidden = !joined;
  const cards = el('leads');
  cards.replaceChildren();
  if (!joined) return;
  const active = d.activeAttempts || [];
  const complete = Array.isArray(d.activeAttempts) && d.active === active.length;
  const roomLeads = active.filter(attempt => attempt.room === main.room && isLead(attempt));
  if (!roomLeads.length) {
    cards.append(node('p', complete ? '미종료 Lead 기록 없음' : '조회한 기록에서 이 작업방의 Lead를 확인하지 못했습니다.', 'muted'));
    return;
  }
  const providerName = attempt => names[attempt.provider] || attempt.provider || '공급자 미확인';
  for (const provider of new Set(roomLeads.map(providerName))) {
    const card = node('article', '', 'lead');
    card.append(node('h4', provider + ' Lead'));
    for (const lead of roomLeads.filter(attempt => providerName(attempt) === provider)) {
      card.append(node('p', [lead.state || '상태 미확인', lead.task || lead.id].filter(Boolean).join(' · '), 'muted'));
    }
    cards.append(card);
  }
}

function renderActivity(d) {
  const attempts = d.attempts || [];
  const team = el('repo-team');
  team.replaceChildren();
  const members = (d.activeAttempts || []).filter(row => isMain(row) || isLead(row));
  if (d.main && !members.some(row => row.id === d.main.id && row.tool === d.main.tool &&
    row.room === d.main.room && row.provider === d.main.provider)) members.unshift(d.main);
  for (const member of members) {
    const item = node('li', '', 'entry');
    const role = member === d.main || isMain(member) ? 'Main' : 'Lead';
    const name = names[member.provider] || member.provider || '공급자 미확인';
    item.append(node('span', [name + ' ' + role, member.room || '작업방 미확인', member.task].filter(Boolean).join(' · ')),
      node('strong', member.state || '상태 미확인'));
    team.append(item);
  }
  if (!members.length) team.append(node('li', '조회한 기록에서 Main·Lead 미확인', 'muted'));
  const activity = el('activity');
  activity.replaceChildren();
  for (const attempt of attempts) {
    const item = node('li', '', 'entry');
    const label = [names[attempt.provider] || attempt.provider, attempt.tool, attempt.task, attempt.room].filter(Boolean);
    item.append(node('span', label.join(' · ')), node('strong', attempt.state || '상태 미확인'));
    activity.append(item);
  }
  if (!attempts.length) activity.append(node('li', d.active == null ? '최근 실행 기록 미확인' : '최근 실행 기록 없음', 'muted'));

  const acceptance = d.acceptance, reviews = d.reviews;
  el('criteria').textContent = acceptance?.available === true
    ? '완료 기준 검증 · ' + (acceptance.verified ?? '?') + ' / ' + (acceptance.total ?? '?') + '개' +
      (acceptance.complete === true ? ' · 완료' : acceptance.complete === false ? ' · 미완료' : ' · 완료 여부 미확인')
    : '완료 기준 미확인';
  el('reviews').textContent = reviews?.available === true
    ? '보관된 리뷰 기록 · 통과 ' + (reviews.passed ?? '?') + ' · 실패 ' + (reviews.failed ?? '?') + ' · 판정 없음 ' + (reviews.unknown ?? '?')
    : '보관된 리뷰 기록 미확인';
  const operations = el('operations');
  operations.replaceChildren();
  for (const operation of d.operations || []) {
    const item = node('li', '', 'entry');
    const label = node('span', [operation.kind || '결과물', names[operation.provider] || operation.provider].filter(Boolean).join(' · '));
    if (operation.artifactId) label.append(node('small', operation.artifactId));
    const stamp = Date.parse(operation.updated);
    if (Number.isFinite(stamp)) label.append(node('small', new Date(stamp).toLocaleString()));
    const outcome = [operation.status || '상태 미확인'];
    if (operation.exit != null) outcome.push('종료 코드 ' + operation.exit);
    item.append(label, node('strong', outcome.join(' · ')));
    operations.append(item);
  }
  if (!d.operations?.length) operations.append(node('li', reviews?.available === true ? '최근 보관된 결과물 없음' : '최근 결과물 미확인', 'muted'));
}

function renderApprovals(rows, incomplete) {
  const list = el('approvals');
  const expected = generation;
  list.replaceChildren();
  if (incomplete) list.append(node('p', '승인 목록을 일부만 조회했습니다.', 'muted'));
  else if (!rows.length) list.append(node('p', '대기 중인 승인 없음', 'muted'));
  for (const row of rows) {
    const details = document.createElement('details');
    details.className = 'approval';
    const summary = node('summary', row.summary || row.action);
    const body = node('div', '');
    body.append(node('p', row.action === 'Main scope decision' ? '결정 범위 · Main이 요청한 다음 작업' : '작업 · ' + row.action));
    body.append(node('p', '대상 · ' + row.object));
    if (row.sender) body.append(node('p', '요청자 · ' + row.sender));
    body.append(node('code', row.id + ' · v' + row.version + ' · ' + row.digest));
    const buttons = node('div', '', 'cluster');
    for (const decision of ['approve', 'deny']) {
      const button = node('button', decision === 'approve' ? '이 요청 승인' : '이 요청 거절', decision === 'approve' ? 'review' : '');
      button.type = 'button';
      button.disabled = busy;
      button.addEventListener('click', () => mutate(
        () => tool('oms_decide_approval', {id:row.id, version:row.version, digest:row.digest, decision}),
        result => {
          if (result?.id !== row.id || result.decision !== decision || result.digest !== row.digest) {
            throw new Error('결정 응답이 요청과 다릅니다. 승인 목록을 확인하세요.');
          }
          el('receipt').textContent = (decision === 'approve' ? '승인' : '거절') + ' 처리됨 · ' + result.id;
          updateContext({project:project || null, room:row.object, status:result.decision});
        }, expected
      ));
      buttons.append(button);
    }
    body.append(buttons);
    details.append(summary, body);
    list.append(details);
  }
}

function setBusy(value, writing = false) {
  busy = value;
  el('view').ariaBusy = String(value);
  el('refresh').disabled = value;
  el('project-choice').disabled = value && writing;
  el('controls').disabled = value;
  for (const button of el('approvals').querySelectorAll('button')) button.disabled = value;
}

async function initialize() {
  if (!initializing) {
    initializing = (async () => {
      if (window.parent === window) throw new Error('앱 대화에서 OMS 패널을 여세요.');
      const info = await request('ui/initialize', {appInfo:{name:'oms-panel', version:'0.1.0'}, appCapabilities:{}, protocolVersion:'2026-01-26'});
      const formats = info?.hostCapabilities?.updateModelContext;
      if (formats?.text || formats?.structuredContent) contextTypes = formats;
      send({method:'ui/notifications/initialized', params:{}});
    })().catch(error => { initializing = undefined; throw error; });
  }
  return initializing;
}

async function recoverStart(expected) {
  if (!retryStart || retryStart.project !== project) return null;
  const {main, goal, requestId} = retryStart;
  const response = await tool('oms_start_status', {requestId}, expected);
  const result = response.structuredContent;
  const room = 'oms-app-' + requestId;
  if (result?.requestId === requestId) {
    if (result.status === 'not_found' && result.room == null && result.attempt == null) {
      return 'not_found';
    }
    if (result.status === 'reserved' && result.room === room && result.attempt == null) {
      el('receipt').className = '';
      el('receipt').textContent = '별도 Main 시작 요청 접수됨 · ' + result.room;
      return 'reserved';
    }
    if (result.status === 'recorded' && result.room === room && result.provider === main &&
        typeof result.attempt === 'string' && result.attempt) {
      retryStart = undefined;
      if (el('brief').value.trim() === goal) el('brief').value = '';
      el('receipt').className = '';
      el('receipt').textContent = names[main] + ' Main · ' + (result.state || '상태 미확인') + ' · ' + result.attempt;
      updateContext({project:project || null, room:result.room, status:result.state});
      return 'recorded';
    }
  }
  throw new Error('시작 상태를 확인할 수 없습니다. 진행 상황을 새로고침하세요.');
}

async function loadStatus(expected, recover = true) {
  el('status').className = '';
  el('status').textContent = el('updated').textContent
    ? '이전 조회 결과를 표시하고 있습니다. 새 상태를 확인하는 중…'
    : '대화의 Main과 프로젝트 상태를 확인하는 중…';
  try {
    await initialize();
    const registry = await tool('oms_list_projects', {}, expected);
    const aliases = registry.structuredContent?.projects;
    if (!Array.isArray(aliases)) throw new Error('프로젝트 목록 응답을 읽을 수 없습니다.');
    if (!chooseProject(aliases)) return;
    if (project && (contextKey == null || contextKey === 'null')) updateContext({project});
    const result = await tool('oms_panel_snapshot', {}, expected);
    const dashboard = result.structuredContent?.dashboard || result._meta?.dashboard;
    if (!dashboard) throw new Error('프로젝트 상태 응답을 읽을 수 없습니다.');
    render(dashboard);
    renderConversation(dashboard);
    renderActivity(dashboard);
    el('approval-progress').textContent = '승인 목록을 확인하는 중…';
    try {
      const response = await tool('oms_list_approvals', {}, expected);
      const approvals = response.structuredContent?.approvals;
      if (!Array.isArray(approvals)) throw new Error('승인 목록 응답을 읽을 수 없습니다.');
      renderApprovals(approvals, response.structuredContent.incomplete);
    } catch (error) {
      if (expected === generation) el('approvals').replaceChildren(node('p', error.message, 'error'));
    } finally {
      if (expected === generation) el('approval-progress').textContent = '';
    }
    if (expected === generation && recover && retryStart) {
      try { await recoverStart(expected); }
      catch (error) {
        if (expected === generation) {
          el('status').className = 'error';
          el('status').textContent = error.message;
        }
      }
    }
  } catch (error) {
    if (generation !== expected) return;
    el('view').hidden = true;
    el('status').className = 'error';
    el('status').textContent = error.message;
  }
}

async function refresh() {
  if (busy) return;
  const expected = generation;
  setBusy(true);
  try { await loadStatus(expected); } finally { if (expected === generation) setBusy(false); }
}

async function mutate(action, onSuccess, expected = generation, recoverAfter = () => true) {
  if (busy || expected !== generation || el('view').hidden) return;
  setBusy(true, true);
  el('receipt').className = '';
  el('receipt').textContent = '요청을 처리하는 중…';
  try {
    const response = await action();
    if (expected === generation && response) onSuccess(response.structuredContent);
  } catch (error) {
    if (expected !== generation) return;
    el('receipt').className = 'error';
    el('receipt').textContent = error.message;
  } finally {
    if (expected === generation) {
      try { await loadStatus(expected, recoverAfter()); } finally { if (expected === generation) setBusy(false); }
    }
  }
}

el('launch').addEventListener('submit', event => {
  event.preventDefault();
  if (busy || el('view').hidden) return;
  const goal = el('brief').value.trim();
  if (!goal || Array.from(goal).length > 2000 || /[\x00-\x1f\x7f]/u.test(goal)) {
    el('launcher').open = true;
    el('brief').focus();
    el('brief').setCustomValidity('목표를 한 줄로 1~2,000자 입력하세요.');
    el('brief').reportValidity();
    return;
  }
  const main = el('launch').elements.main.value;
  const isRetry = Boolean(retryStart && retryStart.project === project && retryStart.main === main && retryStart.goal === goal);
  if (!isRetry) retryStart = {project, main, goal, requestId:crypto.randomUUID()};
  const requestId = retryStart.requestId;
  const expected = generation;
  let started = !isRetry;
  mutate(
    async () => {
      if (isRetry) {
        if (await recoverStart(expected) !== 'not_found') return null;
        started = true;
      }
      return tool('oms_start_main', {main, goal, requestId}, expected);
    },
    result => {
      if (!started) return;
      if (result?.requestId !== requestId || result.room !== 'oms-app-' + requestId ||
          typeof result.attempt !== 'string' || !result.attempt ||
          result.provider !== main || result.status !== 'started') {
        throw new Error('시작 응답을 확인할 수 없습니다. 진행 상황을 새로고침하세요.');
      }
      retryStart = undefined;
      el('brief').value = '';
      el('receipt').textContent = names[main] + ' Main 시작됨 · ' + result.room + ' · ' + result.attempt;
      updateContext({project:project || null, room:result.room, status:result.status});
    },
    expected,
    () => started
  );
});
el('brief').addEventListener('input', () => el('brief').setCustomValidity(''));
el('project-choice').addEventListener('change', () => {
  if (el('project-choice').disabled) return;
  seenInputOrManual = true;
  switchProject(projectArgument(el('project-choice').value || null));
});
el('refresh').addEventListener('click', refresh);
refresh();
</script>
</body>
</html>
