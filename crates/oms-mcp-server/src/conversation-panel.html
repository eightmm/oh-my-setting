  --focus:var(--color-ring-info,light-dark(#1467b4,#96c7ff));

:root[data-theme="light"]{color-scheme:light}
:root[data-theme="dark"]{color-scheme:dark;--blossom:var(--blossom-white)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--blossom:var(--blossom-white)}}
*{box-sizing:border-box}
body{margin:0;background-color:var(--bg);color:var(--ink)}
main{width:100%;max-width:76rem;margin-inline:auto;padding:clamp(.8rem,3vw,2.25rem)}
header,.tools,.section-head,.identity,.person,.actions{display:flex;align-items:center;gap:8px}
header,.section-head{justify-content:space-between}
header{border-bottom:1px solid var(--line);padding-bottom:12px;flex-wrap:wrap}
header h1{margin:0;font-size:1rem;font-weight:750;letter-spacing:-.02em}
.scope{display:flex;align-items:center;gap:12px;min-width:0;flex:1 1 9rem}
#project,#project-choice{max-width:100%;min-width:0;overflow:hidden;text-overflow:ellipsis}
.scope>strong{font-size:.86rem;font-weight:620}
.tools{gap:4px}
button,select,input,textarea{font:inherit;color:inherit}
button,select{cursor:pointer;border:1px solid var(--line);border-radius:var(--r-sm);background-color:var(--raised);padding:4px 12px;min-height:var(--tap)}
#start,#chat-send,#approvals .review{color:var(--on-primary);background-color:var(--primary);border-color:var(--primary);font-weight:620;min-height:var(--tap-lg);padding-inline:16px}
#start:hover:not(:disabled),#chat-send:hover:not(:disabled),#approvals .review:hover:not(:disabled){border-color:var(--primary);opacity:.88}
code,kbd,pre,samp{font-family:var(--mono)}
button:hover:not(:disabled),select:hover{border-color:var(--soft)}
button:disabled{opacity:.55;cursor:wait}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
header button,header select{font-size:.79rem}
#refresh{font:1.18rem/1 system-ui,sans-serif;width:var(--tap);padding:0}
h2,h3,p{margin:0}
h2,.label{font-size:.79rem;font-weight:650;color:var(--soft)}
#view{display:flex;flex-direction:column;gap:16px;margin-top:16px}
#goal-section{--goal-lines:3;display:flex;flex-direction:column;padding:16px clamp(16px,2.5vw,20px);background-color:var(--surface);border-radius:var(--r)}
#goal-expand{align-self:flex-start}
/* The count reads under the track; order also applies to the grid's auto placement. */
#progress{order:1;margin-top:4px}
.goal-heading{display:flex;align-items:baseline;gap:.5rem;min-width:0;flex-wrap:wrap}
@media(min-width:36rem){
  #goal-section{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:1.25rem;align-items:start}
  #goal-section .section-head{display:contents}
  .goal-heading{grid-column:1}
  #new-goal{grid-column:2;grid-row:1 / 3;align-self:center}
  #goal,#goal-expand,#progress,#progress-track{grid-column:1}
  #goal-journey{grid-column:1 / -1}
  #goal-expand{justify-self:start}
}
@media(min-width:64rem){
  #view{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:16px clamp(1.5rem,3vw,3rem);align-items:start}
  #goal-section,#outcome{grid-column:1 / -1}
  #goal-section{--goal-lines:4}
}
#goal{max-inline-size:64ch;font-weight:650;font-size:clamp(1.1rem,2.6vw,1.15rem);line-height:1.45;letter-spacing:-.015em;margin:4px 0;word-break:keep-all;text-wrap:pretty;overflow-wrap:anywhere}
.clamp{display:-webkit-box;-webkit-line-clamp:var(--goal-lines);-webkit-box-orient:vertical;overflow:hidden}
.subtle,.note,.state,small{color:var(--soft);font-size:.83rem}
.subtle,#new-goal{background:transparent;border:0;min-height:var(--tap);padding:4px 8px}
#new-goal{color:var(--ink);font-size:.86rem;font-weight:620}
#progress{font-size:.82rem;color:var(--soft)}
#main-card{--dot-ring:var(--surface);background-color:var(--surface);border:1px solid var(--main-line);border-radius:var(--r);padding:16px}
/* The wrapper keeps DOM order while the approval card reads directly under the goal. */
#view>div{display:flex;flex-direction:column;gap:12px;min-width:0}
.identity{margin:8px 0 4px;min-width:0}
#main-name,#main-status{overflow-wrap:anywhere}
@media(min-width:24rem){#main-card{display:grid;grid-template-columns:minmax(0,1fr) auto;column-gap:.85rem}#main-card :is(h2,.identity,#main-status){grid-column:1}#main-card #header-main{grid-column:2;grid-row:1 / 4;align-self:center;margin:0}}
#main-name{font-size:1rem;font-weight:680}
.avatar{position:relative;width:36px;height:36px;display:grid;place-items:center;flex:none;background-color:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);color:var(--soft);font-size:.95rem;font-weight:650}
.avatar:is([data-provider=codex],[data-provider=claude],[data-provider=agy])::before{content:"";width:100%;height:100%;background:var(--mark) center / var(--mark-size,100%) no-repeat}

/* Provider identity lives only in the mark and this presence dot: ok = live, info = working, warm = attention, muted = idle. */
.avatar[data-presence]::after{content:"";position:absolute;inset-inline-end:-3px;bottom:-3px;width:10px;height:10px;border-radius:50%;border:2px solid var(--dot-ring);background-color:var(--soft)}
.avatar[data-presence=live]::after{background-color:var(--ok)}
.avatar[data-presence=working]::after{background-color:var(--info)}
.avatar[data-presence=attention]::after{background-color:var(--warm)}
#header-main{margin-top:12px;min-height:var(--tap-lg)}
#leads{margin-top:8px;display:grid;background-color:var(--raised);border:1px solid var(--line);border-radius:var(--r)}
#leads:empty{display:none}
#leads>*+*{border-top:1px solid var(--line)}
#leads>:is(.person,.lead-group){padding-inline:14px}
.lead-slot{padding:10px 14px}
.slot-heading{display:flex;align-items:center;gap:8px}
.slot-heading h3{font-size:.92rem;font-weight:650;flex:1;min-width:0}
.slot-heading .subtle{color:var(--ink);background-color:var(--raised);border:1px solid var(--line);border-radius:999px;font-weight:600;text-align:center;padding-inline:12px}
.slot-heading .subtle:hover{text-decoration:none;border-color:var(--soft)}

.lead-slot .person :is(strong,small){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
:is(.subtle,#new-goal):hover{color:var(--ink);text-decoration:underline;text-underline-offset:.2em}
.lead-slot .person{padding:6px 0 2px 44px}

.workers{list-style:none;margin:.2rem 0 .35rem clamp(.75rem,5vw,2.8rem);padding:0 0 0 .8rem;border-inline-start:1px solid var(--line)}
.workers li{position:relative}
.workers li::before{position:absolute;content:"";inset-inline-start:-.8rem;top:1.15rem;width:.48rem;border-top:1px solid var(--line)}
.workers .person{padding:6px 0;gap:8px}
.workers strong{font-size:.84rem;font-weight:620}
.workers small,.workers .state{font-size:.77rem}
.workers li{display:grid;align-items:center}
.worker-output-link{justify-self:start;min-height:var(--tap);font-weight:600}
@supports (color:color-mix(in srgb,red 50%,blue)){.workers,.workers li::before{border-color:color-mix(in srgb,var(--line) 60%,transparent)}}
.worker-no-attempt{color:var(--soft);font-size:.77rem;padding-inline:.1rem}
@media(min-width:36rem){.workers li{grid-template-columns:minmax(0,1fr) auto;column-gap:.6rem}}
#worker-output{max-width:min(44rem,calc(100% - 1.5rem))}
#output-worker{font-weight:650;overflow-wrap:anywhere;margin-top:.65rem}
#output-body{margin:12px 0 0;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;font:.82rem/1.55 var(--mono);background-color:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm)}
#output-status:not(:empty),#output-limited:not([hidden]){margin-top:.4rem}
#output-refresh{margin-top:.65rem}
.slot-heading .state[data-tone]{flex:none;max-width:60%}
.person{width:100%;background:none;text-align:start;border:0;border-radius:0;padding:10px 0;cursor:default}
button.person{cursor:pointer;border-radius:var(--r-xs)}
.person .body{display:grid;flex:1;gap:.12rem;min-width:0}
.person strong{font-size:.92rem;overflow-wrap:anywhere}
.person small{overflow-wrap:anywhere}
.arrow{color:var(--soft);font-size:1.2rem}
.state{white-space:normal;font-weight:600;max-width:35%;text-align:end}
.state[data-tone]{border:1px solid var(--line);border-radius:999px;padding:1px 10px;font-size:.75rem;line-height:1.5;overflow-wrap:anywhere}
.state[data-tone=attention]{color:var(--warm);background-color:var(--warm-bg);border-color:currentColor}
.state[data-tone=active]{color:var(--info);background-color:var(--info-bg)}
.state[data-tone=done]{color:var(--ok);background-color:var(--ok-bg)}
.state[data-tone=muted]{color:var(--soft);background-color:transparent}
button.person:hover:not(:disabled),button.person:active:not(:disabled){background-color:var(--surface)}
button.person:hover .arrow,button.person:active .arrow{transform:translateX(3px)}
.muted{color:var(--soft)}
#status:not(:empty){margin-top:6px;font-size:.8rem;overflow-wrap:anywhere}
#status:not(:empty)[data-tone=warn]{color:var(--warm);font-weight:600}
#receipt:not(:empty){padding:8px 12px;border:1px solid var(--line);border-radius:var(--r-sm);overflow-wrap:anywhere}
#receipt:not(:empty){color:var(--ink);background-color:var(--surface)}
#receipt.error:not(:empty){color:var(--danger);background-color:var(--danger-bg);border-color:currentColor}
.progress-track{height:6px;margin-top:8px;border-radius:999px;background-color:var(--line);overflow:hidden}
#progress-fill{display:block;height:100%;width:0;background-color:var(--ok)}
.progress-track[data-segments=true]{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:3px;background-color:transparent}
.progress-track[data-segments=true] #progress-fill{display:none}
.seg{border-radius:999px;background-color:var(--line)}
.seg.done{background-color:var(--ok)}
.seg.current{background-color:var(--info)}
.observed{margin-inline-start:0;color:var(--soft);font-size:.75rem;font-variant-numeric:tabular-nums}
#auto-refresh[aria-pressed=true]{color:var(--info);background-color:var(--info-bg);border-color:currentColor}
@media(prefers-reduced-motion:no-preference){.arrow{transition:transform .12s ease}#refresh[aria-busy=true]{animation:spin 1.6s linear infinite}}
@keyframes spin{to{transform:rotate(360deg)}}
.note:not(:empty),#receipt:not(:empty){margin-top:12px}
#approval-card{order:-1;background-color:var(--warm-bg);border:1px solid var(--warm);border-radius:var(--r);padding:14px 16px}
#approval-card h2{color:var(--warm)}
.approval{margin-top:8px}
summary{cursor:pointer;font-weight:600;overflow-wrap:anywhere;min-height:var(--tap);padding-block:6px}
.approval p{margin-top:.3rem;overflow-wrap:anywhere}
.actions,.cluster{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
#approvals .cluster button:not(.review){background-color:transparent;border-color:var(--soft)}
#outcome{padding:10px 14px;color:var(--ok);background-color:var(--ok-bg);border:1px solid var(--line);border-inline-start:3px solid var(--ok);border-radius:var(--r-sm);overflow-wrap:anywhere}
dialog{color:var(--ink);background-color:var(--surface);border:1px solid var(--line);border-radius:var(--r);max-height:85vh;max-width:min(32rem,calc(100vw - 1.5rem));width:100%;padding:0}
dialog::backdrop{background:#0008}
dialog h2{font-size:1.1rem;color:var(--ink)}
fieldset{min-width:0;margin:0;padding:0;border:0}
label,legend{font-size:.86rem} .field{display:block;margin:12px 0 4px}
#brief{width:100%;min-height:var(--tap-lg);padding:8px 10px;background-color:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm)}
.checks{display:flex;flex-wrap:wrap;gap:4px 16px}
.checks label{display:inline-flex;align-items:center;gap:8px;min-height:var(--tap);cursor:pointer}
#start{margin-top:16px}
/* The inner wrapper owns the padding, so only a backdrop click targets the dialog itself. */
.dialog-body{padding:16px}
dialog .section-head{position:sticky;top:0;z-index:1;background-color:var(--surface)}
.dialog-actions{display:flex;gap:.35rem;flex:none}
#chat-title{min-width:0;overflow-wrap:anywhere}
#conversation[open]{display:flex;flex-direction:column;width:min(46rem,calc(100% - 1.5rem));max-width:none;height:min(44rem,88dvh);padding:0;overflow:hidden}
/* Lead text sits on the page background; the user's own bubbles use --surface. */
#conversation,#conversation>.section-head{background-color:var(--bg)}
#conversation>.section-head{flex:none;padding:10px 16px;border-bottom:1px solid var(--line)}
#conversation>.section-head .identity{margin:0;min-width:0}
/* A margin on a direct child is dialog surface, where a click would close the conversation. */
#conversation>#chat-status{margin:0}
#chat-status:not(:empty){padding:12px 16px 0}
#settings-toggle[aria-expanded="true"]{border-color:var(--soft)}
#chat-settings{border-bottom:1px solid var(--line);padding:12px 16px;overflow:auto;max-height:43dvh;flex:none}
#settings-fields{display:grid;grid-template-columns:minmax(0,1fr) minmax(6rem,.65fr);gap:.5rem .7rem;margin-block:.5rem}
#settings-fields label{font-weight:600}
#settings-fields select{display:block;width:100%;margin-top:.2rem;text-overflow:ellipsis}
#settings-saved,#settings-actual,#settings-hint,#settings-status{overflow-wrap:anywhere}
#settings-saved:not(:empty){display:inline-block;padding:2px 10px;font-size:.78rem;font-weight:600;background-color:var(--surface);border:1px solid var(--line);border-radius:999px}
#settings-actual{white-space:pre-line}
#settings-controls{display:flex;align-items:center;gap:.6rem;justify-content:flex-end}
#settings-status{margin-inline-end:auto}
@media(max-width:24rem){
  #conversation>.section-head{flex-wrap:wrap;gap:.35rem;padding-inline:.65rem}
  #conversation>.section-head .identity{flex:1 1 11rem}
  #conversation .dialog-actions{margin-inline-start:auto}
  #conversation>.section-head button{padding-inline:.4rem}
  #settings-fields{grid-template-columns:minmax(0,1fr)}
}
#chat-scroll{flex:1;overflow:auto;overscroll-behavior:contain;overflow-anchor:none;padding:12px 16px;scrollbar-gutter:stable}
#chat-messages{list-style:none;padding:0;margin:0}
#chat-messages li{width:fit-content;max-width:100%;padding:8px 0}
#chat-messages small{font-weight:650}
#chat-messages p{margin-top:4px}
#chat-messages time{display:block;color:var(--soft);font-size:.72rem;text-align:end}
#chat-messages li.user{max-width:85%;margin-block:4px;margin-inline-start:auto;background-color:var(--surface);border-radius:var(--r);padding:8px 12px}
#chat-result:not(:empty){margin-top:8px;padding:10px 12px;background-color:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm)}
#chat-compose{flex:none;padding:10px 16px 12px;border-top:1px solid var(--line)}
#chat-compose label{font-weight:620}
#chat-text{display:block;width:100%;min-height:2.8rem;max-height:6rem;margin-top:4px;resize:vertical;background-color:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm);padding:8px 10px}
#chat-compose .actions{margin-top:8px;align-items:center;justify-content:flex-end}
#chat-delivery:not(:empty){margin-inline-end:auto;font-size:.79rem;color:var(--soft)}
@media(max-width:25rem){#conversation[open]{width:100%;max-height:100dvh;height:100dvh;margin:0;border:0;border-radius:0}}
.count{display:block;margin-top:.25rem;color:var(--soft);font-size:.75rem;text-align:end;font-variant-numeric:tabular-nums}
.count[data-tone=warn]{color:var(--warm);font-weight:650}
#issue-evidence:not(:empty){padding:10px 12px;background-color:var(--raised);border:1px solid var(--line);border-radius:var(--r-sm)}
#chat-messages p,#chat-result,#issue-evidence{white-space:pre-wrap;overflow-wrap:anywhere}
#goal-journey{margin-top:.7rem;min-width:0}
#criteria-summary{font-size:.9rem}
#goal-evidence{padding-top:.7rem}
#criteria-list{list-style:none;margin:0;padding:0}
#criteria-list li{padding:.55rem 0;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
#criteria-list .criterion-head{display:flex;justify-content:space-between;gap:.6rem;flex-wrap:wrap}
#criteria-list small{display:block;margin-top:.2rem;white-space:pre-wrap}
#followup-panel{margin-top:.7rem;padding:.7rem;background:var(--surface);border:1px solid var(--line);border-radius:.55rem}
#followup-text{display:block;width:100%;margin-top:.35rem;min-height:6rem;resize:vertical;background:var(--bg);border:1px solid var(--line);border-radius:.4rem;padding:.5rem}
#lead-auto-label{display:flex;align-items:center;gap:.4rem;margin-top:.5rem;color:var(--soft)}
.lead-turn{display:block;color:var(--soft);font-size:.78rem}
#full-answer{margin-top:.7rem;padding-top:.6rem;border-top:1px solid var(--line)}
#full-answer-body{white-space:pre-wrap;overflow-wrap:anywhere;font:inherit}
#chat-new{align-self:center;flex:none;margin:.2rem .7rem}
#chat-count{margin-top:0}
#settings-scope,#settings-catalog{white-space:pre-line}
button,textarea{max-width:100%}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}
/* Narrow side panels: the media query follows the frame, data-compact follows the host's container report. */
@media(max-width:420px){
main{padding:12px}
header{gap:8px;padding-bottom:8px}
.tools{flex-wrap:wrap;margin-inline-start:auto}
#goal-section{padding:12px}
#main-card{padding:12px}
.lead-slot{padding:8px 10px}
#leads>:is(.person,.lead-group){padding-inline:10px}
.lead-slot .person{padding-inline-start:24px}
.workers .person{padding-inline-start:0}
.workers{margin-inline-start:12px}
.dialog-body{padding:12px}
}
:root[data-compact="true"] main{padding:12px}
:root[data-compact="true"] header{gap:8px;padding-bottom:8px}
:root[data-compact="true"] .tools{flex-wrap:wrap;margin-inline-start:auto}
:root[data-compact="true"] #goal-section{display:flex;align-items:stretch;padding:12px}
:root[data-compact="true"] #goal-section .section-head{display:flex}
:root[data-compact="true"] #view{display:flex;align-items:stretch}
:root[data-compact="true"] #main-card{padding:12px}
:root[data-compact="true"] .lead-slot{padding:8px 10px}
:root[data-compact="true"] #leads>:is(.person,.lead-group){padding-inline:10px}
:root[data-compact="true"] .lead-slot .person{padding-inline-start:24px}
:root[data-compact="true"] .workers{margin-inline-start:12px}
:root[data-compact="true"] .workers .person{padding-inline-start:0}
:root[data-compact="true"] .dialog-body{padding:12px}
:root[data-display-mode="inline"] main{padding-block:12px}
:root[data-display-mode="inline"] #goal-section{padding-block:14px}
[hidden]{display:none!important}
</style></head>
<body><main>
<header><div class="scope"><h1>OMS</h1><strong id="project"></strong><label id="scope" hidden><span class="sr-only" data-i18n="project">프로젝트</span><select id="project-choice"></select></label></div><div class="tools">

<div>
<section id="main-card" aria-labelledby="main-name"><h2 id="main-scope" class="label"></h2><div class="identity"><span id="avatar" class="avatar" aria-hidden="true"></span><strong id="main-name" tabindex="-1"></strong></div><p id="main-status" class="note"></p><button id="header-main" type="button" data-i18n="main.continue" hidden>Main 대화에서 이어가기</button></section>
<section id="approval-card" aria-labelledby="approvals-heading" hidden><h2 id="approvals-heading" tabindex="-1"></h2><div id="approvals"></div></section>
</div>
<section id="leads-section" aria-labelledby="leads-heading"><div class="section-head"><h2 id="leads-heading">Leads</h2><button id="open-leads" type="button" aria-describedby="lead-opt-in-note" data-i18n="openLeads" hidden>세 Lead 연결</button></div><p id="lead-opt-in-note" class="note" data-i18n="leadOptIn" hidden></p><label id="lead-auto-label" hidden><input id="lead-auto" type="checkbox"><span data-i18n="autoLeads">다음에도 세 Lead 자동 연결</span></label><p id="lead-control-status" class="note" role="status"></p><button id="lead-refresh" type="button" class="subtle" data-i18n="turn.check" hidden>상태 확인</button><div id="leads" class="lead-children"></div><p id="lead-note" class="note"></p></section>

<p id="outcome" hidden></p>

<p id="launch-status" class="note" role="status"></p>
<button id="issue-review" type="button" hidden data-i18n="reviewIssue">현재 Main에 전달할 이슈 확인</button><p id="issue-evidence" class="note" role="status"></p><button id="issue-record" type="button" hidden></button>
</div></dialog>

<label><span data-i18n="prefs.model">모델</span><select id="settings-model"></select></label>
<label><span data-i18n="prefs.effort">추론 강도</span><select id="settings-effort"></select></label></fieldset>

function sameIssue(p) {
  const owner=issueOwner();
  return Boolean(p && p===reviewedIssue && el('launcher').open && owner && p.room===owner.room && p.owner===owner.participant && issueInput()?.url===p.url);
}
function paintIssue(p) {
  if(!sameIssue(p))return;
  put('issue-evidence',()=>p.reference+'\n'+t('issueVersion',{revision:p.revision})+'\n'+t(p.state));
  el('issue-record').hidden=false;el('issue-record').disabled=p.pending || p.state==='received';
  put('issue-record',p.state==='absent'?'recordIssue':'checkReceipt');
}
async function receiptStatus(p,write=false) {
  if(!sameIssue(p) || p.pending || p.state==='received' || (write && (busy || p.state!=='absent' || !p.id)))return;
  p.pending=true;paintIssue(p);
  const address={room:p.room,owner:p.owner},source={issue:p.issue,sha256:p.sha256};
  try {
    const args=write?{...source,requestId:p.id}:p.id?{requestId:p.id}:source;
    const response=await tool(write?'oms_record_reviewed_issue':'oms_reviewed_issue_status',{...address,...args});
    if(!sameIssue(p))return;
    const v=response.structuredContent;
    if(!/^[0-9a-f]{8}-[0-9a-f]{4}-8[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$/.test(v?.requestId) ||
      (p.id && v.requestId!==p.id))throw uiError('uncertainIssue');
    if(!write && v.status==='not_found'){p.id=v.requestId;p.state='absent';}
    else if(v.status==='recorded' && v.schema===1 && v.kind==='oms-reviewed-issue-receipt' && v.room===p.room && v.participant===p.owner && v.issue===p.issue && v.sha256===p.sha256){
      p.id=v.requestId;
      const delivered=await updateContext({project:project||null,...address,requestId:p.id,kind:v.kind,status:v.status,issue:v.issue,sha256:v.sha256});
      if(!sameIssue(p))return;
      p.state=delivered?'received':'receiptOnly';
    }else throw uiError('uncertainIssue');
  } catch {p.state='uncertainIssue';}
  finally {p.pending=false;paintIssue(p);}
}
onClick('issue-review',async()=>{
  const source=issueInput(),owner=issueOwner();
  if(!source || !owner || !el('launcher').open || el('issue-review').disabled)return;
  resetIssue();const ticket=issueTicket,expected=generation;
  const current=()=>ticket===issueTicket && expected===generation && issueInput()?.url===source.url && el('launcher').open &&
    issueOwner()?.room===owner.room && issueOwner()?.participant===owner.participant;
  el('issue-review').disabled=true;put('issue-evidence','readingIssue');
  try{
    const {structuredContent}=await tool('oms_panel_git_status',{issuePreview:source.number},expected);
    if(!current())return;
    const v=structuredContent?.issuePreview;
    const m=/^https:\/\/github\.com\/([A-Za-z0-9-]+\/[A-Za-z0-9_.-]+)\/issues\/([1-9]\d{0,9})$/.exec(v?.reference);
    if(v?.kind!=='github-issue'||v.state!=='open'||!m||m[1].toLowerCase()!==source.slug.toLowerCase()||Number(m[2])!==source.number ||
      !/^\d{4}-\d\d-\d\dT\d\d:\d\d:\d\dZ$/.test(v.revision)||!/^[0-9a-f]{64}$/.test(v.sha256))throw uiError('unverifiedIssue');
    reviewedIssue={...source,...v,issue:m[1]+'#'+m[2],room:owner.room,owner:owner.participant,state:'readingIssue'};
    await receiptStatus(reviewedIssue);
  }catch{if(current())put('issue-evidence','unverifiedIssue');}
  finally{if(current())el('issue-review').disabled=false;}
});
onClick('issue-record',()=>receiptStatus(reviewedIssue,reviewedIssue?.state==='absent'));
function briefChanged(){briefInvalid=false;el('brief').setCustomValidity('');resetIssue();syncBriefCount();}
on('brief','input',resetIssue);
on('brief','input',syncBriefCount);
for(const provider of providers)on('lead-'+provider,'change',syncBriefCount);
// A single-line input would join pasted lines without a separator.
on('brief','paste',event=>{
  const text=event.clipboardData?.getData('text');
  if(!text || !/[\r\n\u2028\u2029]/.test(text))return;
  event.preventDefault();
  const input=el('brief'), clean=text.replace(/^[\r\n\u2028\u2029]+|[\r\n\u2028\u2029]+$/g,'').replace(/[\t ]*[\r\n\u2028\u2029]+[\t ]*|\t/g,' ');
  const start=input.selectionStart??input.value.length, end=input.selectionEnd??start;
  input.value=input.value.slice(0,start)+clean+input.value.slice(end);
  input.setSelectionRange?.(start+clean.length,start+clean.length);
  briefChanged();
});
function setBusy(value,writing=false) {
  busy=value;el('refresh').disabled=value;el('project-choice').disabled=value && writing;
  el('controls').disabled=value || staleView;el('view').ariaBusy=String(value);
  el('new-goal').disabled=value || staleView;el('header-main').disabled=staleView;
  el('followup-open').disabled=value || staleView;
  for(const b of el('approvals').querySelectorAll('button'))b.disabled=value || staleView;
  el('refresh').setAttribute('aria-busy',String(value && !disposed));
  armAuto();
}
function panelIdle() {
  return Boolean(!disposed && !el('conversation').open && !el('launcher').open && !el('worker-output').open &&
    (transientError?autoRetryCount<AUTO_RETRY_LIMIT:dashboardData && !el('view').hidden));
}
function resetAutoRetry(){transientError=false;autoRetryCount=0;}
function autoReload(){if(transientError)autoRetryCount+=1;refresh();}
function manualRefresh(){autoRetryCount=0;refresh();}
function stopAuto(){clearTimeout(autoTimer);autoTimer=undefined;}
function armAuto() {
  stopAuto();
  if(!autoRefresh || busy || !panelIdle() || document?.hidden)return;
  // Stays above the 8-15s Lead status poll cadence.
  autoTimer=setTimeout(()=>{autoTimer=undefined;if(autoRefresh && panelIdle() && !document?.hidden)autoReload();},20000);
  autoTimer?.unref?.();
}
function refetchStale() {
  if(!autoRefresh || document?.hidden || lastLoadedAt<=0 || Date.now()-lastLoadedAt<15000 || busy || !panelIdle())return; autoReload();
}
function paintAuto(){el('auto-refresh').setAttribute('aria-pressed',String(autoRefresh));}
function isTyping(target) {
  return Boolean(target && (target===el('brief') || /^(?:input|textarea|select)$/i.test(target.tagName||'') || target.isContentEditable));
}
function launchNotice(value){
  put('receipt',value);put('launch-status',value);
}
async function loadStatus(expected,recover=true) {
  setStatus(dashboardData?'refreshing':'connecting');
  let confirmedBinding=null;
  try{
    await initialize();
    const registry=(await tool('oms_list_projects',{},expected)).structuredContent||{};
    const {projects:aliases,binding}=registry;
    if(!Array.isArray(aliases) || (binding!==undefined && (!['catalog','pinned','cwd','unbound'].includes(binding) || (binding==='catalog')!==Boolean(aliases.length))))throw uiError('status.badList');
    readOnly=registry.readOnly===true;
    if(binding==='unbound'){resetAutoRetry();project='';clearProject();el('scope').hidden=true;setStatus('project.unbound');return;}
    if(!chooseProject(aliases)){resetAutoRetry();return;}
    const key=project?registry.projectKeys?.[project]:registry.projectKey;
    confirmedBinding=typeof key==='string' && /^[a-f0-9]{64}$/.test(key)?key:null;
    if(lastGoodBinding && confirmedBinding && lastGoodBinding!==confirmedBinding){
      // An alias can point at a different physical checkout without a picker change.
      generation++;clearProject();setBusy(false);refresh();return;
    }
    bindingKey=confirmedBinding;
    if(project && (!contextKey||contextKey==='null'))updateContext({project});
    const snapshot=await tool('oms_panel_snapshot',{},expected), d=snapshot.structuredContent?.dashboard||snapshot._meta?.dashboard;
    if(!d || typeof d!=='object' || Array.isArray(d))throw uiError('status.badSnapshot');
    staleView=false;render(d);lastGoodBinding=confirmedBinding;lastGoodGeneration=generation;
    resetAutoRetry();lastLoadedAt=Date.now();const notice=snapshotNotice(d);setStatus(()=>notice?t(notice):'',notice?'warn':'info');
    if(readOnly){retryStart=undefined;el('approval-card').hidden=true;el('approvals').replaceChildren();return;}
    try{
      const response=await tool('oms_list_approvals',{},expected);
      if(!Array.isArray(response.structuredContent?.approvals))throw uiError('appr.bad');
      renderApprovals(response.structuredContent.approvals,response.structuredContent.incomplete);
    }catch{if(expected===generation){approvedScope++;el('approval-card').hidden=false;put('approvals-heading','appr.list');el('approvals').replaceChildren(node('p',message('appr.bad')));}}
    if(expected===generation && leadControl)observeLeads(leadControl);
    if(expected===generation && recover && retryStart){
      try{await recoverStart(expected);}catch{if(expected===generation)launchNotice('start.unknown');}
    }
  }catch{if(expected===generation && !disposed){
    transientError=true;
    const retained=dashboardData && confirmedBinding && confirmedBinding===lastGoodBinding && lastGoodGeneration===expected;
    staleView=Boolean(retained);
    resetLeadControl();leadIntent=undefined;paintLeadControls();
    members=[];approvedScope++;closeDialogs();resetIssue();clearFollowup();updateContext(null);
    if(!retained){dashboardData=undefined;rows=[];el('view').hidden=true;}
    else{el('view').hidden=false;el('approvals').replaceChildren();el('approval-card').hidden=true;paintObserved();}
    setStatus(retained?'snapshot.stale':'connectionFailed','warn');
  }}
}
function renderApprovals(rows, incomplete) {
  const card = el('approval-card');
  card.hidden = !rows.length && !incomplete;
  put('approvals-heading', () => rows.length ? t('appr.count',{n:rows.length}) : t('appr.list'));
  const list = el('approvals');
  const expected = generation, scope=++approvedScope;
  let focusedId;
  for (const child of list.children || []) {
    if (child.children[0] === document.activeElement) focusedId = child._approvalId;
    if (child._approvalId && Boolean(child.open) !== child._initialOpen) {
      approvalState.set(child._approvalId, child.open ? 'open' : 'closed');
    }
  }
  list.replaceChildren();
  if (incomplete) list.append(node('p', message('appr.partial'), 'muted'));
  for (const row of rows) {
    const details = document.createElement('details');
    details.className = 'approval';
    const key = typeof row.id === 'string' && row.id ? row.id : null;
    const prev = key ? approvalState.get(key) : undefined;
    const open = prev === 'open' || (rows.length === 1 && (prev === undefined || prev === 'auto'));
    details.open = open;
    details._approvalId = key;
    details._initialOpen = open;
    if (key) {
      if (prev === undefined) approvalState.set(key, open ? 'auto' : 'seen');
      else if (prev === 'auto' && !open) approvalState.set(key, 'seen');
      details.addEventListener('toggle', () => {
        if (Boolean(details.open) === details._initialOpen && approvalState.get(key) === 'auto') return;
        approvalState.set(key, details.open ? 'open' : 'closed');
      });
    }
    const summary = node('summary', row.summary || row.action);
    const body = node('div', '');
    body.append(node('p', () => row.action === 'Main scope decision' ? t('appr.scope') : t('appr.action',{v:row.action})));
    if(row.object && !(row.action==='Main scope decision' && row.object===joinedMain()?.room))
      body.append(node('p', () => t('appr.target',{v:row.object})));
    const buttons = node('div', '', 'cluster');
    for (const decision of ['approve', 'deny']) {
      const button = node('button', () => t(decision === 'approve' ? 'appr.approve' : 'appr.deny'), decision === 'approve' ? 'review' : '');
      button.type = 'button';
      button.disabled = busy;
      button.addEventListener('click', async () => {
        if(readOnly || staleView || scope!==approvedScope || disposed || expected!==generation || !row.id || !row.digest || !Number.isSafeInteger(row.version))return;
        const hadFocus = document.activeElement === button;
        let acknowledged = false;
        await mutate(
          () => tool('oms_decide_approval', {id:row.id, version:row.version, digest:row.digest, decision}),
          result => {
            if (result?.id !== row.id || result.decision !== decision || result.digest !== row.digest) {
              throw uiError('appr.mismatch');
            }
            acknowledged = true;
            put('receipt', decision === 'approve' ? 'appr.approved' : 'appr.denied');
            updateContext({project:project || null, room:row.object, status:result.decision});
          }, expected
        );
        if (!acknowledged || !hadFocus || expected !== generation || disposed || el('view').hidden) return;
        if (document.activeElement !== document.body && document.activeElement !== button) return;
        const next = Array.from(list.children).find(child => child._approvalId && child._approvalId !== row.id);
        (next?.children[0] || el(card.hidden ? 'main-name' : 'approvals-heading')).focus();
      });
      if (!readOnly) buttons.append(button);
    }
    body.append(buttons);
    details.append(summary, body);
    list.append(details);
    if (key && key === focusedId) summary.focus({preventScroll:true});
  }
}

async function refresh() {
  if (busy) return;
  const expected = generation;
  setBusy(true);
  try { await loadStatus(expected); } finally { if (expected === generation) setBusy(false); }
}

async function mutate(action, onSuccess, expected = generation, recoverAfter = () => true) {
  if (busy || staleView || readOnly || expected !== generation || el('view').hidden) return;
  setBusy(true, true);
  el('receipt').className = '';
  launchNotice('mutate.working');
  try {
    const response = await action();
    if (expected === generation && response) onSuccess(response.structuredContent);
  } catch (error) {
    if (expected !== generation) return;
    el('receipt').className = 'error';
    launchNotice( () => error.message);
  } finally {
    if (expected === generation) {
      try { await loadStatus(expected, recoverAfter()); } finally { if (expected === generation) setBusy(false); }
    }
  }
}

function launchDraft() {
  const brief = el('brief').value.trim(), leads = providers.filter(p => el('lead-' + p).checked).map(providerName).join(', ');
  return {main:el('launch').elements.main.value, leads, goal:brief && (leads ? 'Requested provider Leads: ' + leads + '. ' : '') + brief};
}
function sameDraft(a,b) { return a && a.main === b.main && a.goal === b.goal && a.leads === b.leads; }
function finishStart(request) {
  if (retryStart !== request) return;
  retryStart = undefined;
  if (sameDraft(launchDraft(),request)) { el('brief').value = ''; syncBriefCount(); }
}
on('launch','submit', event => {
  event.preventDefault();
  if (readOnly || staleView || busy || el('view').hidden) return;
  const draft = launchDraft(), {main, goal} = draft;
  if (!goal || Array.from(goal).length > 2000 || /[\x00-\x1f\x7f]/u.test(goal)) {
    if(!el('launcher').open){el('launcher').showModal();armAuto();}
    el('brief').focus();
    briefInvalid = true; el('brief').setCustomValidity(t('goalRule'));
    el('brief').reportValidity();
    return;
  }
  const expected = generation;
  let request = retryStart, started = false;
  mutate(
    async () => {
      if (request) {
        const next = request.next;
        if (await recoverStart(expected) !== 'not_found' || !sameDraft(launchDraft(),draft)) return;
        if (!sameDraft(request,draft) && !sameDraft(next,draft)) {
          request.next = draft;
          launchNotice('start.resubmit');
          return;
        }
      }
      if (!request || request.goal !== goal || request.main !== main)
        request = retryStart = {...draft, project, requestId:crypto.randomUUID()};
      else request.leads = draft.leads;
      started = true;
      return tool('oms_start_main', {main, goal, requestId:request.requestId}, expected);
    },
    result => {
      const {requestId} = request;
      if (result?.requestId !== requestId || result.room !== 'oms-app-' + requestId ||
          typeof result.attempt !== 'string' || !result.attempt ||
          result.provider !== main || result.status !== 'started') {
        throw uiError('start.badResponse');
      }
      finishStart(request);
      if(el('launcher').open)el('launcher').close();
      launchNotice( () => t('start.started',{p:names[main],room:result.room,attempt:result.attempt}));
      updateContext({project:project || null, room:result.room, status:result.status});
    },
    expected,
    () => started
  );
});
on('launch','input', () => { briefInvalid = false; el('brief').setCustomValidity(''); });
on('project-choice','change', () => {
  if (el('project-choice').disabled) return;
  seenInputOrManual = true;leadIntent=undefined;openSeq++;
  switchProject(projectArgument(el('project-choice').value || null));
});
onClick('display-mode',()=>{const n=nextDisplayMode();if(n)requestDisplayMode(n.mode);});
onClick('refresh', manualRefresh);
onClick('auto-refresh',()=>{
  if(disposed)return;
  autoRefresh=!autoRefresh;
  if(autoRefresh)autoRetryCount=0;
  try{globalThis.localStorage?.setItem(AUTO_KEY,autoRefresh?'on':'off');}catch{}
  paintAuto();armAuto();
});
document.addEventListener?.('visibilitychange',()=>{
  if(document.hidden)stopAuto();
  else{refetchStale();armAuto();}
});
window.addEventListener('focus',refetchStale);
window.addEventListener('keydown',event=>{
  // WCAG 2.1.4: never a bare character key. The physical code covers layouts where Alt composes another character.
  if(!event.altKey || event.ctrlKey || event.metaKey || event.shiftKey || event.repeat || event.isComposing || event.defaultPrevented ||
     !(event.code==='KeyR' || event.key==='r' || event.key==='R'))return;
  if(busy || disposed || el('conversation').open || el('launcher').open || el('worker-output').open || isTyping(event.target) || isTyping(document.activeElement))return;
  event.preventDefault();manualRefresh();
});
on('language-choice','change', () => { const value = el('language-choice').value; if (LANGS.includes(value)) setLanguage(value, true); });

try{const v=globalThis.localStorage?.getItem(LANG_KEY);if(LANGS.includes(v))storedLang=v;}catch{}
try{autoRefresh=globalThis.localStorage?.getItem(AUTO_KEY)==='on';}catch{}
paintAuto();
setLanguage(negotiateLang(),false);
goalToggleLabel();
refresh();
