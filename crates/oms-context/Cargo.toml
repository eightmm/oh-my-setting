[package]
name = "oms-context"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["raw_value", "preserve_order", "unbounded_depth"] }
unicode-general-category = "=0.6.0"
