[package]
name = "oms-command-journal"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
oms-context = { path = "../oms-context" }
oms-json = { path = "../oms-json" }
oms-lock = { path = "../oms-lock" }
oms-safe-fs = { path = "../oms-safe-fs" }
oms-scrub = { path = "../oms-scrub" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regex = "=1.13.1"
rusqlite = { version = "=0.32.1", features = ["bundled"] }
rustix = { version = "=1.1.6", features = ["fs", "process", "event"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
sha2 = "=0.10.9"
users = { version = "=0.11.0", default-features = false }

[dev-dependencies]
oms-command-memory = { path = "../oms-command-memory" }

[lints.rust]
unsafe_code = "forbid"
