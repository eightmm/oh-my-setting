<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="title desc">
  <title id="title">oh-my-setting</title>
  <desc id="desc">One local control plane shared by Codex, Claude Code and Antigravity.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/>
      <stop offset="1" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#818cf8" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#818cf8" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1280" height="320" rx="24" fill="url(#bg)"/>
  <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="80" y="150" font-size="68" font-weight="700" fill="#f8fafc">oh-my-setting</text>
    <rect x="82" y="172" width="120" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="80" y="222" font-size="26" fill="#cbd5e1">One control plane for your coding agents.</text>
    <text x="80" y="258" font-size="20" fill="#94a3b8">Shared rules · state · plans · evidence · handoffs</text>
  </g>
  <!-- hub and three agents -->
  <g transform="translate(1010 160)">
    <circle r="130" fill="url(#glow)"/>
    <g stroke="#475569" stroke-width="2" stroke-dasharray="4 6">
      <line x1="0" y1="0" x2="-150" y2="-82"/>
      <line x1="0" y1="0" x2="150" y2="-82"/>
      <line x1="0" y1="0" x2="0" y2="112"/>
    </g>
    <circle r="46" fill="#0f172a" stroke="url(#accent)" stroke-width="4"/>
    <text y="9" text-anchor="middle" font-family="ui-monospace, 'SFMono-Regular', Menlo, Consolas, monospace" font-size="26" font-weight="700" fill="#e2e8f0">oms</text>
    <g font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="17" font-weight="600" text-anchor="middle">
      <g transform="translate(-150 -82)">
        <rect x="-62" y="-20" width="124" height="40" rx="20" fill="#0c4a6e" stroke="#38bdf8" stroke-width="2"/>
        <text y="6" fill="#e0f2fe">Codex</text>
      </g>
      <g transform="translate(150 -82)">
        <rect x="-74" y="-20" width="148" height="40" rx="20" fill="#431407" stroke="#fb923c" stroke-width="2"/>
        <text y="6" fill="#ffedd5">Claude Code</text>
      </g>
      <g transform="translate(0 112)">
        <rect x="-74" y="-20" width="148" height="40" rx="20" fill="#2e1065" stroke="#a78bfa" stroke-width="2"/>
        <text y="6" fill="#ede9fe">Antigravity</text>
      </g>
    </g>
  </g>
</svg>
