[package]
name = "oms"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[lints.rust]
unsafe_code = "forbid"

[dependencies]
oms-context = { path = "../oms-context" }
oms-context-report = { path = "../oms-context-report" }
oms-json = { path = "../oms-json" }
oms-safe-fs = { path = "../oms-safe-fs" }
serde_json = "=1.0.154"
sha2 = "=0.10.9"
signal-hook = { version = "=0.3.18", default-features = false }
users = { version = "=0.11.0", default-features = false }
rustix = { version = "=1.1.6", features = ["fs"] }
unicode-general-category = "=0.6.0"
[dev-dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["signal", "fs"] }
