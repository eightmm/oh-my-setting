[package]
name = "oms-mcp-server"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
oms-context = { path = "../oms-context" }
ryu = "=1.0.23"
serde_json = { version = "=1.0.154", features = ["preserve_order", "arbitrary_precision"] }
sha2 = "=0.10.9"
regex = "=1.13.1"
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
rustix = { version = "=1.1.6", features = ["fs", "process", "event", "pipe"] }
oms-safe-fs = { path = "../oms-safe-fs" }
unicode-general-category = "=0.6.0"

[lints.rust]
unsafe_code = "forbid"

[[test]]
name = "native"
path = "tests/native.rs"
harness = false
