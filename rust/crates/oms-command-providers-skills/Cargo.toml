[package]
name = "oms-command-providers-skills"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace]
resolver = "3"

[dependencies]
oms-context = { path = "../oms-context" }
oms-contract-markdown = { path = "../oms-contract-markdown" }
oms-command-agent-role = { path = "../oms-command-agent-role" }
oms-command-operations = { path = "../oms-command-operations" }
oms-command-memory = { path = "../oms-command-memory" }
oms-command-plan = { path = "../oms-command-plan" }
oms-command-task = { path = "../oms-command-task" }
oms-command-slurm-lint = { path = "../oms-command-slurm-lint" }
oms-command-slurm-submit = { path = "../oms-command-slurm-submit" }
oms-json = { path = "../oms-json" }
oms-lock = { path = "../oms-lock" }
oms-safe-fs = { path = "../oms-safe-fs" }
oms-scrub = { path = "../oms-scrub" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regex = "=1.13.1"
sha2 = "=0.10.9"
rustix = { version = "=1.1.6", features = ["fs", "process", "pipe", "system"] }
serde = "=1.0.229"
serde_json = "=1.0.154"
shlex = "=1.3.0"
unicode-general-category = "=0.6.0"

[lints.rust]
unsafe_code = "forbid"
