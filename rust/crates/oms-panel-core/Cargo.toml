[package]
name = "oms-panel-core"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[workspace]
resolver = "3"

[dependencies]
oms-work-inspect = { path = "../oms-work-inspect" }
oms-command-plan = { path = "../oms-command-plan" }
oms-command-task = { path = "../oms-command-task" }
oms-command-operations = { path = "../oms-command-operations" }
oms-command-room = { path = "../oms-command-room" }
oms-command-attempt-bundle = { path = "../oms-command-attempt-bundle" }
oms-command-failure = { path = "../oms-command-failure" }
oms-command-telemetry = { path = "../oms-command-telemetry" }
oms-supervisor = { path = "../oms-supervisor" }
oms-reference = { path = "../oms-reference" }
oms-contract-markdown = { path = "../oms-contract-markdown" }
oms-context = { path = "../oms-context" }
oms-json = { path = "../oms-json" }
oms-lock = { path = "../oms-lock" }
oms-safe-fs = { path = "../oms-safe-fs" }
oms-scrub = { path = "../oms-scrub" }
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regex = "=1.13.1"
sha2 = "=0.10.9"
rustix = { version = "=1.1.6", features = ["fs", "process", "pipe", "system"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.154", features = ["preserve_order"] }
shlex = "=1.3.0"
unicode-general-category = "=0.6.0"
