[package]
name = "oms-migrate"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
publish = false
build = false
autobins = false
autoexamples = false
autotests = false
autobenches = false

[workspace]
resolver = "3"

[lints.rust]
unsafe_code = "forbid"

[lib]
path = "src/lib.rs"

[[bin]]
name = "oms-migrate"
path = "src/main.rs"

[[test]]
name = "inventory"
path = "tests/inventory.rs"
