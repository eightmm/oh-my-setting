[package]
name = "oms-command-job-digest"
version = "0.1.0"
edition = "2024"
rust-version = "1.99.1"

[dependencies]
chrono = { version = "=0.4.45", default-features = false, features = ["std"] }
regex = "=1.13.1"
serde_json = { version = "=1.0.154", features = ["raw_value"] }
nix = { version = "=0.31.3", default-features = false, features = ["signal", "process"] }

[lints.rust]
unsafe_code = "forbid"
