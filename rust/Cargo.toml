[workspace]
members = [
    "crates/oms-context",
    "crates/oms-context-report",
    "crates/oms-context-session",
    "crates/oms-graph-shell",
    "crates/oms-json",
    "crates/oms-migrate",
    "crates/oms-output",
    "crates/oms-safe-fs",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.lints.rust]
unsafe_code = "forbid"
