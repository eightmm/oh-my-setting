[workspace]
members = [
    "crates/oms",
    "crates/oms-command-agent-role",
    "crates/oms-command-attempt-bundle",
    "crates/oms-command-experiment",
    "crates/oms-command-failure",
    "crates/oms-command-input",
    "crates/oms-command-job-digest",
    "crates/oms-command-telemetry",
    "crates/oms-context",
    "crates/oms-context-report",
    "crates/oms-context-session",
    "crates/oms-context-source",
    "crates/oms-contract-markdown",
    "crates/oms-experiment",
    "crates/oms-failure",
    "crates/oms-graph",
    "crates/oms-graph-python",
    "crates/oms-graph-resolve",
    "crates/oms-graph-shell",
    "crates/oms-json",
    "crates/oms-migrate",
    "crates/oms-output",
    "crates/oms-output-capture",
    "crates/oms-safe-fs",
    "crates/oms-scrub",
    "crates/oms-work-inspect",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.lints.rust]
unsafe_code = "forbid"
