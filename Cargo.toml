[workspace]
members = [
    "crates/oms",
    "crates/oms-bootstrap",
    "crates/oms-command-agent-role",
    "crates/oms-command-attempt-bundle",
    "crates/oms-command-autonomy",
    "crates/oms-command-experiment",
    "crates/oms-command-failure",
    "crates/oms-command-graph",
    "crates/oms-command-hooks",
    "crates/oms-command-input",
    "crates/oms-command-job-digest",
    "crates/oms-command-journal",
    "crates/oms-command-landing",
    "crates/oms-command-lifecycle",
    "crates/oms-command-memory",
    "crates/oms-command-operations",
    "crates/oms-command-panel",
    "crates/oms-command-peer",
    "crates/oms-command-plan",
    "crates/oms-command-providers-skills",
    "crates/oms-command-room",
    "crates/oms-command-runs",
    "crates/oms-command-slurm-lint",
    "crates/oms-command-slurm-submit",
    "crates/oms-command-state",
    "crates/oms-command-task",
    "crates/oms-command-telemetry",
    "crates/oms-context",
    "crates/oms-context-report",
    "crates/oms-context-session",
    "crates/oms-context-source",
    "crates/oms-contract-markdown",
    "crates/oms-experiment",
    "crates/oms-failure",
    "crates/oms-github",
    "crates/oms-graph",
    "crates/oms-graph-python",
    "crates/oms-graph-resolve",
    "crates/oms-graph-shell",
    "crates/oms-json",
    "crates/oms-lock",
    "crates/oms-mcp-server",
    "crates/oms-migrate",
    "crates/oms-output",
    "crates/oms-output-capture",
    "crates/oms-panel-core",
    "crates/oms-reference",
    "crates/oms-runtime",
    "crates/oms-safe-fs",
    "crates/oms-scrub",
    "crates/oms-supervisor",
    "crates/oms-toml",
    "crates/oms-work-inspect",
]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"

[workspace.lints.rust]
unsafe_code = "forbid"

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[profile.dev.package.sha2]
opt-level = 2
